<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件浏览</title>
    <script src="/resources/config.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --accent: #4f7cff;
            --accent-soft: #e9efff;
            --text: #232a3b;
            --muted: #8b91a5;
            --border: #e4e7f0;
            --danger: #ff4d4d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 顶栏：与 chat.html 的 topbar 一致 */
        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .topbar h1 { margin: 0; font-size: 18px; flex: 0 0 auto; }
        .topbar .path {
            flex: 1;
            min-width: 180px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--bg);
            color: var(--text);
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
        }
        .topbar .path:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .topbar button {
            padding: 9px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .topbar button:hover { background: #3f68e8; }
        .topbar button.ghost { background: #eef1f8; color: var(--text); }
        .topbar button.ghost:hover { background: #e2e6f2; }

        /* 列表区：卡片容器 + 表格 */
        .list-container {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--bg);
            color: var(--muted);
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: var(--accent-soft); }
        .name {
            font-family: Consolas, Monaco, monospace;
            word-break: break-all;
        }
        .dir .name { font-weight: 600; color: var(--accent); }
        .size, .modified { color: var(--muted); white-space: nowrap; }
        .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; cursor: default; }
        .empty.clickable { cursor: pointer; color: var(--accent); }
        .empty.clickable:hover { text-decoration: underline; }

        /* 底部状态栏 */
        .status {
            padding: 8px 18px;
            font-size: 12px;
            color: var(--muted);
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            white-space: nowrap;
            overflow-x: auto;
        }
        .status.error { color: var(--danger); }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>📂 文件浏览</h1>
        <input class="path" id="pathInput" value="" placeholder="输入路径，如 D:\或 /，留空为磁盘列表">
        <button class="ghost" id="upBtn" onclick="goUp()" style="display:none;">↑ 上级</button>
        <button onclick="gotoPath()">跳转</button>
    </header>

    <div class="list-container" id="listContainer">
        <table>
            <thead>
                <tr>
                    <th style="width:50%;">名称</th>
                    <th>大小</th>
                    <th>修改时间</th>
                </tr>
            </thead>
            <tbody id="fileList">
                <tr><td colspan="3" class="empty">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="status" id="statusBar"></div>

    <script>
        const API = () => location.protocol === 'file:' ? 'http://' + SERVER_IP : '';
        const fileList = document.getElementById('fileList');
        const pathInput = document.getElementById('pathInput');
        const upBtn = document.getElementById('upBtn');
        const statusBar = document.getElementById('statusBar');
        let currentPath = ''; // 当前目录；空字符串 = 磁盘列表
        let showHidden = localStorage.getItem('fileShowHidden') === '1';

        function status(msg, isError) {
            statusBar.textContent = msg || '';
            statusBar.classList.toggle('error', !!isError);
        }

        function formatSize(n) {
            if (n === 0) return '';
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
            return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function formatTime(ts) {
            if (!ts) return '';
            return new Date(ts).toLocaleString('zh-CN', { hour12: false });
        }

        function isHidden(entry) {
            if (!showHidden) return entry.name.startsWith('.');
            return false;
        }

        function renderRow(entry) {
            const tr = document.createElement('tr');
            tr.className = entry.isDirectory ? 'dir' : 'file';
            tr.onclick = () => entry.isDirectory ? loadDir(entry.path) : download(entry.path);
            const isRoot = entry.path.length === 2; // 如 "D:\"，无法取父级
            tr.innerHTML =
                '<td class="name">' + (entry.isDirectory ? '📁 ' : '📄 ') + entry.name + '</td>' +
                '<td class="size">' + (entry.isDirectory ? '—' : formatSize(entry.size)) + '</td>' +
                '<td class="modified">' + (isRoot ? '—' : formatTime(entry.modified)) + '</td>';
            return tr;
        }

        async function loadDir(path) {
            currentPath = path || '';
            pathInput.value = currentPath;
            upBtn.style.display = currentPath && currentPath.length > 2 ? '' : 'none';
            fileList.innerHTML = '<tr><td colspan="3" class="empty">加载中...</td></tr>';
            status('');
            try {
                const res = await fetch(API() + '/listFile?path=' + encodeURIComponent(path));
                if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
                const data = await res.json();
                render(data.entries);
            } catch (err) {
                fileList.innerHTML = '<tr><td colspan="3" class="empty">加载失败</td></tr>';
                status('加载失败: ' + err.message, true);
            }
        }

        function render(entries) {
            const visible = entries.filter(e => !isHidden(e));
            fileList.innerHTML = '';
            if (visible.length === 0) {
                fileList.innerHTML = '<tr><td colspan="3" class="empty">空目录</td></tr>';
            } else {
                visible.forEach(e => fileList.appendChild(renderRow(e)));
            }
            if (!showHidden && entries.some(e => e.name.startsWith('.'))) {
                const toggle = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 3;
                cell.className = 'empty clickable';
                cell.textContent = '显示隐藏文件（. 开头）';
                toggle.onclick = () => {
                    showHidden = true;
                    localStorage.setItem('fileShowHidden', '1');
                    location.reload();
                };
                toggle.appendChild(cell);
                fileList.appendChild(toggle);
            }
        }

        function download(path) {
            // 直接跳页到 /fileContent：服务端带 attachment 响应头，浏览器下载后页面保持不变
            status('正在下载 ' + path + ' ...');
            location.href = API() + '/fileContent?path=' + encodeURIComponent(path);
        }

        function gotoPath() {
            const p = pathInput.value.trim();
            loadDir(p);
        }

        function goUp() {
            if (!currentPath || currentPath.length <= 2) {
                loadDir(''); // 回到磁盘列表
                return;
            }
            const norm = currentPath.endsWith('\\') ? currentPath : currentPath + '\\';
            const idx = norm.lastIndexOf('\\', norm.length - 2);
            loadDir(idx > 0 ? norm.slice(0, idx + 1) : '');
        }

        pathInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') gotoPath();
        });

        // 默认打开服务端运行 jar 所在的目录；失败则回退到磁盘列表
        fetch(API() + '/defaultFileDir')
            .then(r => r.ok ? r.text() : '')
            .then(p => loadDir(p.trim() || ''))
            .catch(() => loadDir(''));
    </script>
</body>
</html>
