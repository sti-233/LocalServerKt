<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手</title>
    <link rel="stylesheet" href="/resources/lib/katex/katex.min.css">
    <script src="/resources/lib/katex/katex.min.js"></script>
    <script src="/resources/lib/katex/auto-render.min.js"></script>
    <script src="/resources/lib/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --accent: #4f7cff;
            --accent-soft: #e9efff;
            --text: #232a3b;
            --muted: #8b91a5;
            --border: #e4e7f0;
            --danger: #ff4d4d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* 顶栏：与 chat.html 的 topbar 一致 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px; /* 统一顶栏 56px（含 border）；其他页同值 */
            padding: 10px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .topbar h1 { margin: 0; font-size: 18px; }
        .topbar .badge {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .topbar .meta { display: flex; align-items: center; gap: 8px; }
        .chat-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }
        .message.ai pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
            margin: 8px 0;
        }
        .message.ai code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: "Consolas", "Monaco", monospace;
        }
        .message.ai pre code {
            background: none;
            padding: 0;
        }
        .message.ai ul, .message.ai ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        .message.ai li { margin: 4px 0; }
        .message.ai p { margin: 8px 0; }
        .message.ai p:first-child { margin-top: 0; }
        .message.ai p:last-child { margin-bottom: 0; }
        .message.ai blockquote {
            border-left: 3px solid var(--accent);
            margin: 8px 0;
            padding: 4px 12px;
            color: var(--muted);
            background: var(--bg);
        }
        .message.ai h1, .message.ai h2, .message.ai h3,
        .message.ai h4, .message.ai h5, .message.ai h6 {
            margin: 12px 0 6px;
            font-weight: 600;
        }
        .message.ai h1 { font-size: 1.4em; }
        .message.ai h2 { font-size: 1.25em; }
        .message.ai h3 { font-size: 1.1em; }
        .message.ai table {
            border-collapse: collapse;
            margin: 8px 0;
            width: auto;
        }
        .message.ai th, .message.ai td {
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 13px;
        }
        .message.ai th { background: var(--bg); }
        .math-block {
            text-align: center;
            margin: 10px 0;
            overflow-x: auto;
        }
        .katex-display { margin: 0 !important; }
        .message.ai .katex { font-size: 1.1em; }
        .message.system {
            align-self: center;
            background: var(--accent-soft);
            color: var(--muted);
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 8px;
        }
        /* 底部输入栏：与 chat.html 的 inputbar 一致 */
        .inputbar {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .inputbar textarea {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            background: var(--bg);
            color: var(--text);
            resize: none;
            overflow-y: auto;
            max-height: 120px;
        }
        .inputbar textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .inputbar button {
            padding: 9px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .inputbar button:hover { background: #3f68e8; }
        .inputbar button:disabled { background: #b9c8ee; cursor: not-allowed; }
        .inputbar button.ghost { background: #eef1f8; color: var(--text); }
        .inputbar button.ghost:hover { background: #e2e6f2; }
        .clear-btn {
            background: #eef1f8;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--muted);
            cursor: pointer;
        }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--card); }
        .typing::after {
            content: '▋';
            animation: blink 1s infinite;
        }
        .typing:empty::after {
            content: '▋';
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .thinking-container {
            max-width: 75%;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        .thinking-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--muted);
            user-select: none;
            transition: background .15s;
        }
        .thinking-toggle:hover { background: var(--bg); }
        .thinking-toggle .arrow { transition: transform 0.2s; font-size: 10px; }
        .thinking-toggle.collapsed .arrow { transform: rotate(-90deg); }
        .thinking-content {
            display: block;
            margin-top: 8px;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 250px;
            overflow-y: auto;
        }
        .thinking-content.collapsed { display: none; }

        /* ===== AI 回复单元 .ai-wrap：思考块（可选）+ 气泡 + 右下角 ✨ 重渲染按钮 ===== */
        .ai-wrap {
            position: relative;
            align-self: flex-start;
            max-width: 75%;
            min-width: 240px; /* 流式早期气泡为空时保持 ✨ 按钮有稳定的停靠位置 */
            width: fit-content;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ai-wrap .thinking-container {
            align-self: stretch;
            max-width: 100%;
            margin-bottom: 0; /* 间距交给 .ai-wrap 的 gap */
        }
        .ai-wrap .message.ai {
            align-self: stretch;
            max-width: 100%;
        }
        .rerender-btn {
            position: absolute;
            right: -8px;
            bottom: -8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #e0e0e0;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            font-size: 13px;
            line-height: 26px;
            text-align: center;
            padding: 0;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .rerender-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

        /* ===== 会话侧边栏：参考 chat.html 的会话列表 =====
           侧边栏可收起（.layout 无 .sidebar-open 时贴左边框），宽 230px */
        .layout { flex: 1; display: flex; min-height: 0; }
        .right-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #sidebar {
            width: 230px;
            flex: 0 0 230px;
            background: var(--card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 12px 10px;
            transition: margin-left .2s ease;
        }
        #sidebar:not(.open) { margin-left: -230px; }
        .conv-section { margin-bottom: 14px; }
        .conv-section h3 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .4px;
            padding: 0 8px;
        }
        .conv-item {
            display: block;
            position: relative;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            margin-bottom: 2px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item:hover { background: var(--bg); }
        .conv-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }
        .conv-empty {
            margin: 0;
            padding: 4px 8px;
            font-size: 12px;
            color: var(--muted);
        }
        /* 会话项右侧的操作按钮（重命名 / 删除），悬停显示 */
        .conv-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: none;
        }
        .conv-item:hover .conv-actions { display: flex; }
        .conv-actions button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--muted);
        }
        .conv-actions button:hover { background: var(--bg); color: var(--accent); }
        .conv-actions button.del:hover { color: var(--danger); }
        .conv-item .conv-title {
            display: block;
            padding-right: 46px; /* 给操作按钮留位置 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item .conv-time {
            display: block;
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            margin-top: 2px;
        }
        /* 顶栏图标按钮（☰ 侧边栏开关） */
        .topbar .icon-btn {
            background: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
        }
        .topbar .icon-btn:hover { background: #dfe6ff; }

        /* ===== Debug 窗口样式（保留深色终端风，与聊天主题分离）===== */
        #debugPanel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 280px;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 12px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            border-top: 2px solid var(--accent);
        }
        #debugPanel.open { display: flex; }
        .debug-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }
        .debug-header .debug-title {
            font-weight: 600;
            color: #fff;
            font-size: 12px;
        }
        .debug-header .debug-count {
            color: #9ca3af;
            font-size: 11px;
        }
        .debug-header button {
            margin-left: auto;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .debug-header button:hover { background: #555; }
        .debug-header .debug-close {
            background: #ef4444;
        }
        .debug-header .debug-close:hover { background: #dc2626; }
        #debugLog {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .debug-line {
            padding: 2px 0;
            border-bottom: 1px solid #2a2a2a;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .debug-line .time {
            color: #6b7280;
            margin-right: 6px;
        }
        .debug-line.log .level { color: #93c5fd; }
        .debug-line.info .level { color: #6ee7b7; }
        .debug-line.warn .level { color: #fcd34d; }
        .debug-line.error .level { color: #fca5a5; }
        .debug-line.debug .level { color: #c4b5fd; }
        .debug-line .msg { color: #d4d4d4; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left" style="display:flex;align-items:center;gap:10px;">
            <button id="sidebarToggle" class="icon-btn" title="显示/收起会话">☰</button>
            <h1>AI 助手</h1>
            <span class="badge">!?AI?!</span>
        </div>
        <div class="meta">
            <button class="clear-btn" id="debugToggleBtn" onclick="debugToggle()" style="display:none;">🐛 Debug</button>
            <button class="clear-btn" onclick="clearHistory()">清除对话</button>
        </div>
    </header>
    <div class="layout">
        <!-- 会话侧边栏：cache/ai/<用户名>/ 下的会话列表，按最后一条消息时间从新到旧 -->
        <aside id="sidebar">
            <div class="conv-section">
                <h3>历史记录</h3>
                <button class="conv-item" id="newConvBtn" style="font-weight:600;">＋ 新对话</button>
                <div id="convList"></div>
            </div>
        </aside>
        <div class="right-col">
            <div class="chat-container" id="chatContainer">
                <div class="message system">你好！我是 AI 助手，有什么可以帮你的？</div>
            </div>
            <footer class="inputbar">
                <textarea id="msgInput" placeholder="输入消息…" rows="1"></textarea>
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </footer>
        </div>
    </div>

    <!-- ===== Debug 窗口 DOM ===== -->
    <div id="debugPanel">
        <div class="debug-header">
            <span class="debug-title">🐛 Debug Console</span>
            <span class="debug-count" id="debugCount">0 条</span>
            <button onclick="debugClear()">清空</button>
            <button class="debug-close" onclick="debugToggle(false)">关闭 ✕</button>
        </div>
        <div id="debugLog"></div>
    </div>

    <script>
        /* ===== Debug 开关：设为 true 时显示 Debug 按钮，点击按钮打开调试窗口 ===== */
        var DEBUG = false;

        const chatContainer = document.getElementById('chatContainer');
        const sidebar = document.getElementById('sidebar');
        const convList = document.getElementById('convList');
        const newConvBtn = document.getElementById('newConvBtn');
        /* 当前打开的会话 id（空串 = 还没有会话） */
        let currentConvId = '';
        /* 当前会话名（用于顶栏/侧边栏高亮） */
        let currentConvName = '';
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const debugPanel = document.getElementById('debugPanel');
        const debugLog = document.getElementById('debugLog');
        const debugCount = document.getElementById('debugCount');
        const debugToggleBtn = document.getElementById('debugToggleBtn');
        let debugEntryCount = 0;
        let isProcessing = false;
        let autoScrollEnabled = true;

        /* ===== DEBUG 开启时显示 Debug 按钮，由用户手动打开面板 ===== */
        if (DEBUG) {
            debugToggleBtn.style.display = '';
        }

        /* ===== Debug 日志核心：DEBUG 开启时记录日志（面板关闭时也在后台累积，打开后可见），不再自动展开面板 ===== */
        function debugLogWrite(level, args) {
            if (!DEBUG) return;
            // 组装文本（把对象转成 JSON 便于查看）
            var parts = [];
            for (var i = 0; i < args.length; i++) {
                var a = args[i];
                if (typeof a === 'object') {
                    try { parts.push(JSON.stringify(a)); } catch (e) { parts.push(String(a)); }
                } else {
                    parts.push(String(a));
                }
            }
            var text = parts.join(' ');
            var now = new Date();
            var time = now.toLocaleTimeString('zh-CN', { hour12: false }) + '.' +
                String(now.getMilliseconds()).padStart(3, '0');

            var line = document.createElement('div');
            line.className = 'debug-line ' + level;
            line.innerHTML = '<span class="time">' + time + '</span>' +
                '<span class="level">[' + level.toUpperCase() + ']</span> ' +
                '<span class="msg"></span>';
            line.querySelector('.msg').textContent = text;
            debugLog.appendChild(line);

            // 限制条数，防止内存膨胀
            while (debugLog.childNodes.length > 500) {
                debugLog.removeChild(debugLog.firstChild);
            }
            debugEntryCount++;
            debugCount.textContent = debugEntryCount + ' 条';
            // 自动滚动到最新
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function debugToggle(force) {
            if (typeof force === 'boolean') {
                debugPanel.classList.toggle('open', force);
            } else {
                debugPanel.classList.toggle('open');
            }
        }
        function debugClear() {
            debugLog.innerHTML = '';
            debugEntryCount = 0;
            debugCount.textContent = '0 条';
        }

        /* ===== 劫持原生 console，把日志同步到 Debug 窗口 ===== */
        (function hijackConsole() {
            if (!DEBUG) return;
            var levels = ['log', 'info', 'warn', 'error', 'debug'];
            levels.forEach(function (lvl) {
                var original = console[lvl].bind(console);
                console[lvl] = function () {
                    debugLogWrite(lvl, arguments);
                    original.apply(console, arguments);
                };
            });
        })();

        debugLogWrite('info', '[init] Debug 模式已开启，点击顶部 🐛 按钮打开 Debug 面板。marked 版本:',
            (typeof marked !== 'undefined' && marked.version) || 'unknown');

        /* ===== 侧边栏展开/收起（与 chat.html 一致）===== */
        document.getElementById('sidebarToggle').addEventListener('click', function () {
            sidebar.classList.toggle('open');
        });
        newConvBtn.addEventListener('click', function () { newConversation(); });

        /* ===== 会话列表（侧边栏）=====
           数据来自 /ai/conversations：{items:[{id,name,lastTime,count,preview}], active}
           按最后一条消息时间从新到旧排序（服务端已排好序） */
        async function loadConversations() {
            try {
                const resp = await fetch('/ai/conversations');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                const items = data.items || [];
                renderConversations(items);
                if (!currentConvId && data.active) currentConvId = data.active;
                syncActiveItem();
            } catch (err) {
                debugLogWrite('error', '[loadConversations] 失败:', err);
            }
        }

        function renderConversations(items) {
            convList.innerHTML = '';
            if (!items || items.length === 0) {
                convList.innerHTML = '<p class="conv-empty">暂无历史记录</p>';
                return;
            }
            items.forEach(function (item) {
                const btn = document.createElement('button');
                btn.className = 'conv-item';
                btn.dataset.id = item.id;
                const title = document.createElement('span');
                title.className = 'conv-title';
                title.textContent = item.name || '未命名会话';
                btn.appendChild(title);
                const time = document.createElement('span');
                time.className = 'conv-time';
                time.textContent = item.lastTime ? item.lastTime.slice(5, 16) : '';
                btn.appendChild(time);

                // 操作：重命名 / 删除
                const actions = document.createElement('span');
                actions.className = 'conv-actions';
                const renameBtn = document.createElement('button');
                renameBtn.title = '重命名';
                renameBtn.textContent = '✎';
                renameBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    renameConversation(item.id, item.name);
                });
                const delBtn = document.createElement('button');
                delBtn.className = 'del';
                delBtn.title = '删除';
                delBtn.textContent = '🗑';
                delBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    deleteConversation(item.id);
                });
                actions.appendChild(renameBtn);
                actions.appendChild(delBtn);
                btn.appendChild(actions);

                btn.addEventListener('click', function () { switchConversation(item.id); });
                convList.appendChild(btn);
            });
        }

        function syncActiveItem() {
            var items = convList.querySelectorAll('.conv-item');
            for (var i = 0; i < items.length; i++) {
                if (items[i].dataset.id === currentConvId) items[i].classList.add('active');
                else items[i].classList.remove('active');
            }
        }

        /* 切换会话：拉取该会话消息并重绘 */
        function switchConversation(id) {
            if (!id) return;
            currentConvId = id;
            syncActiveItem();
            fetch('/ai/conversation?id=' + encodeURIComponent(id))
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (conv) {
                    currentConvName = conv.name || '';
                    renderConversationMessages(conv.messages || []);
                    loadConversations();
                })
                .catch(function (err) { debugLogWrite('error', '[switchConversation] 失败:', err); });
        }

        /* 把服务端返回的消息数组渲染到聊天区（复用 loadHistory 的渲染逻辑） */
        function renderConversationMessages(items) {
            chatContainer.innerHTML = '';
            if (!items || items.length === 0) {
                chatContainer.innerHTML = '<div class="message system">这个会话还没有消息。</div>';
                return;
            }
            items.forEach(function (item) { renderHistoryItem(item); });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        /* 新建会话：服务端创建后切换过去 */
        function newConversation() {
            fetch('/ai/conversation/new', { method: 'POST', body: '{}' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    currentConvId = data.id;
                    chatContainer.innerHTML = '<div class="message system">新对话已创建。</div>';
                    loadConversations();
                })
                .catch(function (err) { debugLogWrite('error', '[newConversation] 失败:', err); });
        }

        /* 重命名会话 */
        function renameConversation(id, oldName) {
            var name = window.prompt('新的会话名：', oldName || '');
            if (name === null) return; // 取消
            if (!name.trim()) {
                debugLogWrite('warn', '[renameConversation] 名称为空，已忽略');
                return;
            }
            fetch('/ai/conversation/rename', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, name: name.trim() })
            })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function () {
                    if (id === currentConvId) currentConvName = name.trim();
                    loadConversations();
                })
                .catch(function (err) { debugLogWrite('error', '[renameConversation] 失败:', err); });
        }

        /* 删除会话 */
        function deleteConversation(id) {
            if (!window.confirm('确定删除这个会话？')) return;
            fetch('/ai/conversation/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function () {
                    if (id === currentConvId) {
                        currentConvId = '';
                        chatContainer.innerHTML = '<div class="message system">会话已删除。</div>';
                    }
                    loadConversations();
                })
                .catch(function (err) { debugLogWrite('error', '[deleteConversation] 失败:', err); });
        }

        /* ===== 输入框自适应高度 ===== */
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
        });

        chatContainer.addEventListener('scroll', () => {
            const threshold = 80;
            const distanceFromBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
            autoScrollEnabled = distanceFromBottom <= threshold;
        });

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            chatContainer.appendChild(div);
            return div;
        }

        /* 创建一条 AI 回复单元：.ai-wrap 包裹 思考块（可选）+ ✨ 重渲染按钮；
           气泡 (.message.ai) 由调用方 insertBefore 按钮之前。 */
        function addAiUnit(withThinking) {
            const unit = document.createElement('div');
            unit.className = 'ai-wrap';
            let html = '';
            if (withThinking) {
                html += '<div class="thinking-container">' +
                    '<div class="thinking-toggle" onclick="toggleThinking(this)">' +
                    '<span class="arrow">▼</span>' +
                    '<span class="thinking-label">思考中...</span>' +
                    '</div>' +
                    '<div class="thinking-content"></div>' +
                    '</div>';
            }
            html += '<button class="rerender-btn" title="重新渲染 markdown 与公式">✨</button>';
            unit.innerHTML = html;
            chatContainer.appendChild(unit);
            const thinking = unit.querySelector('.thinking-container');
            return {
                unit,
                thinking,
                thinkingContent: thinking ? thinking.querySelector('.thinking-content') : null,
                thinkingToggle: thinking ? thinking.querySelector('.thinking-toggle') : null,
                thinkingLabel: thinking ? thinking.querySelector('.thinking-label') : null,
                rerenderBtn: unit.querySelector('.rerender-btn')
            };
        }

        /* ===== ✨ 重渲染：按单元上保存的原始文本 (el._thinkingText / _contentText) 重新渲染 markdown + 公式 ===== */
        function rerenderUnit(unitEl) {
            const thinking = unitEl.querySelector('.thinking-content');
            if (thinking && unitEl._thinkingText) {
                renderMarkdown(thinking, unitEl._thinkingText);
                renderMath(thinking);
            }
            const aiMsg = unitEl.querySelector('.message.ai');
            if (aiMsg && unitEl._contentText) {
                renderMarkdown(aiMsg, unitEl._contentText);
                renderMath(aiMsg);
                // 重渲染会重建 innerHTML，需补回"传输中断"提示
                if (unitEl._interrupted) {
                    const note = document.createElement('div');
                    note.textContent = '（回答在传输中断开）';
                    note.style.color = '#9ca3af';
                    note.style.fontSize = '12px';
                    aiMsg.appendChild(note);
                }
            }
            debugLogWrite('log', '[rerenderUnit] 已重新渲染 markdown 与公式');
        }

        function toggleThinking(el) {
            const content = el.nextElementSibling;
            el.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
        }

        function clearHistory() {
            debugLogWrite('log', '[clearHistory] 清除对话');
            var url = '/ai/clear' + (currentConvId ? '?conv=' + encodeURIComponent(currentConvId) : '');
            fetch(url, { method: 'POST' })
                .then(() => {
                    chatContainer.innerHTML = '<div class="message system">对话已清除。</div>';
                    autoScrollEnabled = true;
                    loadConversations();
                })
                .catch(err => debugLogWrite('error', '[clearHistory] 失败:', err));
        }

        /* ===== 渲染一条历史消息（loadHistory 与会话切换共用） ===== */
        function renderHistoryItem(item) {
            const role = item.role;
            const content = item.content || '';
            if (role === 'user') {
                addMessage(content, 'user');
                return;
            }
            if (role !== 'assistant') return;
            // 一条 AI 回复单元（.ai-wrap）：思考块（可选）+ 气泡 + 右下角 ✨ 重渲染按钮
            const unitEl = addAiUnit(!!item.reasoning_content).unit;
            if (item.reasoning_content) {
                unitEl._thinkingText = item.reasoning_content;
                const tcBody = unitEl.querySelector('.thinking-content');
                renderMarkdown(tcBody, item.reasoning_content);
                renderMath(tcBody);
                unitEl.querySelector('.thinking-label').textContent = '已折叠的思考';
                unitEl.querySelector('.thinking-toggle').classList.add('collapsed');
                tcBody.classList.add('collapsed');
            }
            const div = addMessage('', 'ai');
            unitEl.insertBefore(div, unitEl.querySelector('.rerender-btn'));
            unitEl._contentText = content;
            unitEl._interrupted = !!item.interrupted;
            if (content) {
                // 历史消息与实时回复一致：markdown + 数学公式渲染
                renderMarkdown(div, content);
                renderMath(div);
            }
            if (item.interrupted) {
                const note = document.createElement('div');
                note.textContent = '（回答在传输中断开）';
                note.style.color = '#9ca3af';
                note.style.fontSize = '12px';
                div.appendChild(note);
            }
            // 纯工具调用轮：有 tool_calls 但无正文/思考，跳过不渲染空气泡
            if (item.tool_calls && !content && !item.reasoning_content) {
                unitEl.parentNode.removeChild(unitEl);
                return;
            }
            unitEl.querySelector('.rerender-btn').addEventListener('click', () => rerenderUnit(unitEl));
        }

        /* ===== 页面加载时从服务端恢复历史对话 ===== */
        function loadHistory() {
            var url = '/ai/history' + (currentConvId ? '?conv=' + encodeURIComponent(currentConvId) : '');
            fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(items => {
                    if (!Array.isArray(items) || items.length === 0) return;
                    // 有历史时移除默认欢迎语
                    const welcome = chatContainer.querySelector('.message.system');
                    if (welcome && welcome.textContent.indexOf('AI 助手') !== -1) {
                        chatContainer.removeChild(welcome);
                    }
                    items.forEach(renderHistoryItem);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    debugLogWrite('log', '[loadHistory] 已恢复', items.length, '条消息');
                })
                .catch(err => debugLogWrite('error', '[loadHistory] 失败:', err));
        }

        function renderMath(el) {
            if (typeof renderMathInElement === 'undefined') return;
            try {
                renderMathInElement(el, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            } catch (e) {
                debugLogWrite('warn', '[renderMath] 渲染失败:', e.message);
            }
        }

        function renderMarkdown(el, text) {
            if (typeof marked !== 'undefined') {
                try {
                    el.innerHTML = marked.parse(text);
                    return;
                } catch (err) {
                    debugLogWrite('warn', '[renderMarkdown] marked 抛错，降级为文本:', err.message);
                }
            }
            el.textContent = text;
        }

        function sendMessage() {
            if (isProcessing) return;
            const text = msgInput.value.trim();
            if (!text) return;

            debugLogWrite('log', '[sendMessage] 用户发送:', text);

            msgInput.value = '';
            msgInput.style.height = 'auto';
            isProcessing = true;
            sendBtn.disabled = false;
            /* 中断：处理中按钮变为"■ 停止"，点击即关闭 SSE（服务端检测断开并标记 interrupted） */
            sendBtn.textContent = '■ 停止';
            sendBtn.onclick = stop;
            autoScrollEnabled = true;

            addMessage(text, 'user');

            /* AI 回复单元：先创建 .ai-wrap（含 ✨ 按钮），气泡插入其中；
               思考块保留到流结束时再按需挂入（保证 ✨ 始终贴在气泡右下角） */
            const aiWrap = document.createElement('div');
            aiWrap.className = 'ai-wrap';
            aiWrap.innerHTML = '<button class="rerender-btn" title="重新渲染 markdown 与公式">✨</button>';
            chatContainer.appendChild(aiWrap);
            const rerenderBtn = aiWrap.querySelector('.rerender-btn');

            const aiMessageDiv = addMessage('', 'ai');
            aiMessageDiv.classList.add('typing');
            aiWrap.insertBefore(aiMessageDiv, rerenderBtn);
            rerenderBtn.addEventListener('click', () => rerenderUnit(aiWrap));

            let thinkingContainer = null;
            let thinkingContent = null;
            let thinkingToggle = null;
            let thinkingLabel = null;
            function ensureThinking() {
                if (thinkingContainer) return;
                thinkingContainer = document.createElement('div');
                thinkingContainer.className = 'thinking-container';
                thinkingContainer.innerHTML = '<div class="thinking-toggle" onclick="toggleThinking(this)">' +
                    '<span class="arrow">▼</span>' +
                    '<span class="thinking-label">思考中...</span>' +
                '</div>' +
                '<div class="thinking-content"></div>';
                aiWrap.insertBefore(thinkingContainer, aiMessageDiv);
                thinkingContent = thinkingContainer.querySelector('.thinking-content');
                thinkingToggle = thinkingContainer.querySelector('.thinking-toggle');
                thinkingLabel = thinkingContainer.querySelector('.thinking-label');
            }

            let thinkingBuffer = '';
            let responseBuffer = '';
            let isThinking = true;
            let pendingRender = false;
            let es = null;

            /* 工具调用提示行：模型给出 delta.tool_calls 时在气泡下方显示
               “⚙ 调用 get_time(...)”，最终正文开始后标记为“已调用” */
            let toolCallDiv = null;
            let toolCallBuf = {};
            let toolCallDone = false;
            function ensureToolLine() {
                if (toolCallDiv) return;
                toolCallDiv = document.createElement('div');
                toolCallDiv.className = 'tool-note';
                toolCallDiv.style.color = '#9ca3af';
                toolCallDiv.style.fontSize = '12px';
                aiWrap.insertBefore(toolCallDiv, rerenderBtn);
            }

            function cleanup() {
                if (es) {
                    debugLogWrite('log', '[cleanup] 关闭 EventSource');
                    es.close();
                    es = null;
                }
            }

            /* 处理中按钮是"■ 停止"（onclick 指向 stop）；流程结束后还原为"发送" */
            function restoreBtn() {
                sendBtn.textContent = '发送';
                sendBtn.onclick = sendMessage;
            }

            /* 手动停止：关 SSE（服务端检测断开、记录 interrupted），标记本条并追加提示 */
            let stoppedByUser = false;
            function stop() {
                if (!isProcessing) return;
                debugLogWrite('log', '[stop] 用户手动停止');
                stoppedByUser = true;
                streamEnded = true;
                cleanup();
                aiWrap._interrupted = true;
                finalize();
                const note = document.createElement('div');
                note.textContent = '（已手动停止）';
                note.style.color = '#9ca3af';
                note.style.fontSize = '12px';
                aiMessageDiv.appendChild(note);
            }

            /* ===== 渲染节流：chunk 只累积到 buffer，实际渲染交给 heartbeat 与结束事件触发 ===== */
            function renderPending() {
                if (!pendingRender) return;
                pendingRender = false;
                if (thinkingBuffer && thinkingContent) {
                    renderMarkdown(thinkingContent, thinkingBuffer);
                    renderMath(thinkingContent);
                    thinkingContent.scrollTop = thinkingContent.scrollHeight;
                }
                if (responseBuffer) {
                    aiMessageDiv.classList.remove('typing');
                    renderMarkdown(aiMessageDiv, responseBuffer);
                    renderMath(aiMessageDiv);
                }
                if (autoScrollEnabled) {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }

            function finalize() {
                renderPending();
                // 工具提示行补上"已调用"（若最终正文没触发）
                if (toolCallDiv && !toolCallDone) {
                    toolCallDone = true;
                    toolCallDiv.textContent = toolCallDiv.textContent + '（已调用）';
                }
                if (thinkingBuffer.trim()) {
                    // 保留思考块并展开，记录原始思考文本供 ✨ 重渲染
                    aiWrap._thinkingText = thinkingBuffer;
                    thinkingContent.classList.remove('collapsed');
                    thinkingToggle.classList.remove('collapsed');
                } else if (thinkingContainer && thinkingContainer.parentNode) {
                    thinkingContainer.parentNode.removeChild(thinkingContainer);
                }
                // 成功完成（或中断）的回复记录原始文本；网络错误/服务端错误不记录
                aiWrap._contentText = responseBuffer;
                if (!responseBuffer && !thinkingBuffer) {
                    aiMessageDiv.textContent = '(空响应：请检查 Debug 窗口原始 data)';
                }
                aiMessageDiv.classList.remove('typing');
                isProcessing = false;
                restoreBtn();
                msgInput.focus();
                if (autoScrollEnabled) {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
                debugLogWrite('log', '[finalize] 完成，思考长度:', thinkingBuffer.length, '正文长度:', responseBuffer.length);
            }

            let streamEnded = false;

            function processChunk(data) {
                console.log(data);
                if (data === '[DONE]') {
                    debugLogWrite('info', '[processChunk] 收到 [DONE]');
                    streamEnded = true;
                    cleanup();
                    finalize();
                    loadConversations();
                    return;
                }

                var jsonData;
                try {
                    jsonData = JSON.parse(data);
                } catch (ex) {
                    debugLogWrite('warn', '[processChunk] 非 JSON，忽略:', data);
                    return;
                }

                if (jsonData.error) {
                    debugLogWrite('error', '[processChunk] 服务端错误:', jsonData.error);
                    aiMessageDiv.textContent = '请求失败: ' + jsonData.error;
                    cleanup();
                    isProcessing = false;
                    restoreBtn();
                    msgInput.focus();
                    return;
                }

                var choices = jsonData.choices;
                if (!choices || !choices[0]) {
                    debugLogWrite('warn', '[processChunk] 无 choices:', data);
                    return;
                }
                var delta = choices[0].delta;

                if (delta && delta.reasoning_content) {
                    ensureThinking();
                    thinkingBuffer += delta.reasoning_content;
                    // 文本逐字即时显示；markdown 渲染延迟到 heartbeat / 结束时进行
                    thinkingContent.textContent = thinkingBuffer;
                    thinkingContent.scrollTop = thinkingContent.scrollHeight;
                    pendingRender = true;
                    thinkingLabel.textContent = '思考中...';
                }

                if (delta && delta.content) {
                    if (isThinking) {
                        isThinking = false;
                        if (thinkingLabel) thinkingLabel.textContent = '思考完毕';
                    }
                    responseBuffer += delta.content;
                    // 文本逐字即时显示；markdown 渲染延迟到 heartbeat / 结束时进行
                    aiMessageDiv.textContent = responseBuffer;
                    aiMessageDiv.classList.remove('typing');
                    pendingRender = true;
                    if (autoScrollEnabled) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }

                // 工具调用：delta.tool_calls 分片（id/name 首片、arguments 逐片拼接）
                if (delta && delta.tool_calls && delta.tool_calls.length) {
                    delta.tool_calls.forEach(tc => {
                        if (!tc) return;
                        var idx = (tc.index === undefined || tc.index === null) ? 0 : tc.index;
                        var entry = toolCallBuf[idx] || { id: '', name: '', arguments: '' };
                        if (tc.id) entry.id = tc.id;
                        if (tc.function && tc.function.name) entry.name = tc.function.name;
                        if (tc.function && tc.function.arguments) entry.arguments += tc.function.arguments;
                        toolCallBuf[idx] = entry;
                    });
                    ensureToolLine();
                    toolCallDiv.textContent = '⚙ 调用 ' + Object.keys(toolCallBuf)
                        .map(i => toolCallBuf[i].name || ('tool#' + i))
                        .join(', ');
                    pendingRender = false;
                    if (autoScrollEnabled) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }

                if (delta && delta.content && toolCallDiv && !toolCallDone) {
                    // 正文开始 = 工具轮已结束，标记提示行为“已调用”
                    toolCallDone = true;
                    toolCallDiv.textContent = toolCallDiv.textContent + '（已调用）';
                }
            }

            var url = '/ai/chat?text=' + encodeURIComponent(text) +
                (currentConvId ? '&conv=' + encodeURIComponent(currentConvId) : '');
            debugLogWrite('log', '[EventSource] 建立连接:', url);
            es = new EventSource(url);

            es.onopen = function() {
                debugLogWrite('info', '[SSE] onopen 连接已建立');
            };
            es.addEventListener('heartbeat', renderPending);
            es.onmessage = function(e) {
                if (typeof e.data === 'string') {
                    processChunk(e.data);
                }
            };
            es.addEventListener('error', function(e) {
                if (e.data) {
                    debugLogWrite('warn', '[SSE] 自定义 error 事件:', e.data);
                    processChunk(e.data);
                }
            });
            es.onerror = function(ev) {
                debugLogWrite('error', '[SSE] onerror readyState=', es.readyState, 'url=', es.url);
                if (streamEnded) return; /* 含手动停止：关连接触发的 onerror 不是错误 */
                aiMessageDiv.textContent = '网络错误: SSE 连接失败（详见 Debug）';
                aiMessageDiv.classList.remove('typing');
                cleanup();
                isProcessing = false;
                sendBtn.disabled = false;
                msgInput.focus();
            };
        }
        /* ===== 初始化：拉会话列表 → 恢复当前会话消息 ===== */
        (async function init() {
            await loadConversations();
            // 服务端记录的活动会话优先；没有则用列表第一个（已按时间从新到旧排序）
            if (!currentConvId) {
                var first = convList.querySelector('.conv-item');
                if (first) {
                    currentConvId = first.dataset.id;
                    syncActiveItem();
                }
            }
            if (currentConvId) {
                switchConversation(currentConvId);
            } else {
                loadHistory();
            }
            // 宽屏默认展开侧边栏，窄屏收起（与 chat.html 一致）
            if (window.innerWidth > 600) sidebar.classList.add('open');
        })();
    </script>
</body>
</html>
