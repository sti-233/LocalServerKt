<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>终端</title>
    <script src="/resources/config.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #c9d1d9;
            --muted: #8b949e;
            --accent: #4f7cff;
            --green: #3fb950;
            --red: #ff4d4d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: Consolas, "Cascadia Code", Monaco, monospace;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--card);
            border-bottom: 1px solid #21262d;
        }
        .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
        .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
        .topbar .dot.ok { background: var(--green); }
        .topbar button {
            margin-left: auto;
            padding: 5px 12px;
            background: transparent;
            color: var(--muted);
            border: 1px solid #21262d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .topbar button:hover { color: var(--text); border-color: var(--accent); }

        /* 输出区 */
        #output {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #output .cmd { color: #58a6ff; }
        #output .cmd::before { content: "PS> "; color: var(--green); }
        #output .note { color: var(--muted); }
        #output .err-line { color: var(--red); }

        /* 输入区 */
        .inputbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--card);
            border-top: 1px solid #21262d;
        }
        .inputbar .ps1 { color: var(--green); font-weight: 600; }
        #cmd {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font: inherit;
        }
        .inputbar button {
            padding: 5px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
        }
        .inputbar button:hover { background: #3f68e8; }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>🖥️ PowerShell 终端</h1>
        <span class="dot" id="connDot"></span>
        <button onclick="document.getElementById('output').textContent=''">清屏</button>
        <button onclick="resetSession()">重置</button>
    </header>

    <div id="output"><div class="note">连接中...</div></div>

    <div class="inputbar">
        <span class="ps1">PS&gt;</span>
        <input id="cmd" autocomplete="off" spellcheck="false">
        <button onclick="send()">运行</button>
    </div>

    <script>
        const output = document.getElementById('output');
        const cmdInput = document.getElementById('cmd');
        const connDot = document.getElementById('connDot');
        const history = [];
        let histIdx = -1;
        let ws = null;

        function line(cls, text) {
            const div = document.createElement('div');
            if (cls) div.className = cls;
            div.textContent = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function send() {
            const cmd = cmdInput.value.trim();
            if (!cmd || !ws || ws.readyState !== WebSocket.OPEN) return;
            line('cmd', cmd);
            cmdInput.value = '';
            history.push(cmd);
            histIdx = -1;
            ws.send(JSON.stringify({ cmd }));
        }

        // 服务端把 PowerShell 弄死（exit 之类）会自动重启；前端提供"重置"按钮发空进程重连
        function resetSession() {
            ws?.close();
            ws = null;
            line('note', '[连接已重置，等待重连...]');
            connect();
        }

        function connect() {
            const url = (location.protocol === 'file:' ? 'ws://' + SERVER_IP : (location.protocol === 'https:' ? 'wss://' + location.hostname : 'ws://' + location.hostname)) + '/terminal';
            ws = new WebSocket(url);
            ws.onopen = () => {
                connDot.classList.add('ok');
                line('note', '[已连接 ' + location.hostname + ']');
            };
            ws.onclose = () => {
                connDot.classList.remove('ok');
                line('note', '[连接断开，2 秒后重连...]');
                setTimeout(connect, 2000);
            };
            ws.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch { return; }
                if (msg.out === 'CLEAR') {
                    output.textContent = '';
                } else if (msg.out) {
                    // 按行渲染；带"错误"字样的高亮（PowerShell 错误常含 "Exception"、"错误"）
                    msg.out.split('\n').forEach(l => {
                        if (/Exception|错误|error/ig.test(l)) line('err-line', l);
                        else line('', l);
                    });
                }
            };
        }

        cmdInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') send();
            else if (e.key === 'ArrowUp') {
                if (histIdx < history.length - 1) { histIdx++; cmdInput.value = history[history.length - 1 - histIdx]; e.preventDefault(); }
            } else if (e.key === 'ArrowDown') {
                if (histIdx > 0) { histIdx--; cmdInput.value = history[history.length - 1 - histIdx]; }
                else { histIdx = -1; cmdInput.value = ''; }
                e.preventDefault();
            }
        });

        connect();
    </script>
</body>
</html>
