<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音乐搜索 - Music Search</title>
    <script src="/resources/config.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --accent: #4f7cff;
            --accent-soft: #e9efff;
            --text: #232a3b;
            --muted: #8b91a5;
            --border: #e4e7f0;
            --danger: #ff4d4d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* 顶栏：搜索框内置，视觉与 chat.html 的 topbar 一致 */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
            flex-wrap: wrap;
        }
        .topbar h1 { margin: 0; font-size: 18px; white-space: nowrap; }
        .search-container {
            flex: 1;
            max-width: 600px;
            min-width: 180px;
            position: relative;
        }
        .search-box {
            width: 100%;
            padding: 9px 44px 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover { background: #3f68e8; }
        .settings-icon {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }
        .settings-icon:hover { background: var(--accent-soft); border-color: var(--accent); }

        /* 主区域：居中卡片 */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
            padding: 20px;
        }
        .content-header { margin-bottom: 20px; }
        .content-title { font-size: 20px; }
        .search-results { display: none; }
        .search-results.show { display: block; }
        .search-results-title { margin-bottom: 16px; font-size: 14px; color: var(--muted); }
        .music-list { display: grid; gap: 10px; }
        .music-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
        }
        .music-cover {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 14px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .music-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .music-info { flex: 1; min-width: 0; }
        .music-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
        .music-artist { font-size: 13px; color: var(--muted); word-break: break-word; }
        .music-actions { display: flex; gap: 8px; }
        .play-btn {
            background: var(--accent);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }
        .play-btn:hover { background: #3f68e8; }
        .lyrics-btn {
            background: var(--accent-soft);
            color: var(--accent);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
        }
        .lyrics-btn:hover { background: #dbe5ff; }
        .lyrics-container {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
        }
        .lyrics-container.show { display: block; }
        .lyrics-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; word-break: break-word; }
        .lyrics-content {
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
        }
        .basic-function { margin-top: 20px; }
        .basic-function.hide { display: none; }
        .basic-function h3 { font-size: 15px; }
        .basic-function p { margin-top: 8px; font-size: 13px; color: var(--muted); }

        /* 提示文本（占位/加载/错误） */
        .hint { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
        .hint.error { color: var(--danger); }

        /* 播放器：右下角卡片 */
        .player-container {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: min(360px, calc(100vw - 32px));
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 16px rgba(16, 24, 40, .12);
            z-index: 200;
            display: none;
        }
        .player-container.show { display: block; }
        .player-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
        .player-artist { font-size: 13px; color: var(--muted); margin-bottom: 8px; word-break: break-word; }
        .audio-player { width: 100%; margin-top: 8px; }
        .close-player {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            font-size: 18px;
            color: var(--muted);
            cursor: pointer;
        }
        .close-player:hover { color: var(--text); }
        .loading-text { font-size: 12px; color: var(--muted); margin-top: 4px; }

        /* 设置窗口：卡片样式 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 460px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--muted);
            cursor: pointer;
        }
        .close-btn:hover { color: var(--text); }
        .settings-options { display: flex; flex-direction: column; gap: 16px; }
        .setting-group {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }
        .group-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
        }
        .setting-label { font-size: 14px; color: var(--text); }
        .number-input {
            width: 90px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .number-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .quality-options { display: flex; flex-direction: column; gap: 8px; }
        .quality-option { display: flex; align-items: center; gap: 8px; }
        .quality-option input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }
        .quality-label { font-size: 14px; color: var(--text); }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        .save-button { margin-top: 16px; text-align: right; }
        .save-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .save-btn:hover { background: #3f68e8; }

        /* 小屏适配 */
        @media (max-width: 600px) {
            .topbar { gap: 8px; }
            .search-container { min-width: 140px; }
            .music-item { flex-wrap: wrap; }
            .music-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <!-- 头部：标题 + 搜索 + 设置 -->
    <header class="topbar">
        <h1>🎵 音乐搜索</h1>
        <div class="search-container">
            <input type="text" class="search-box" placeholder="搜索歌曲..." id="searchInput">
            <button class="search-btn" onclick="performSearch()">🔍</button>
        </div>
        <div class="settings-icon" onclick="openSettings()" title="设置">⚙️</div>
    </header>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <main class="content">
            <div class="content-header">
                <h2 class="content-title">发现音乐</h2>
            </div>

            <!-- 搜索结果 -->
            <div class="search-results" id="searchResults">
                <h3 class="search-results-title">搜索结果</h3>
                <div class="music-list" id="musicList">
                    <!-- 搜索结果将在这里动态生成 -->
                </div>
            </div>

            <!-- 基础功能区域 -->
            <div class="basic-function" id="basicFunction">
                <h3>音乐搜索</h3>
                <p>在顶部搜索框中输入歌曲名或歌手名进行搜索</p>
            </div>
        </main>
    </div>

    <!-- 音乐播放器 -->
    <div class="player-container" id="playerContainer">
        <button class="close-player" onclick="closePlayer()">×</button>
        <div class="player-title" id="playerTitle">正在播放</div>
        <div class="player-artist" id="playerArtist">歌手</div>
        <audio controls class="audio-player" id="audioPlayer">
            您的浏览器不支持音频元素
        </audio>
        <div id="customControls">
            <span>音量：</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.1"
            oninput="document.getElementById('audioPlayer').volume = this.value;" style="width: 70%;"/>
        </div>
        <div class="loading-text" id="loadingText"></div>
    </div>

    <!-- 设置窗口 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">设置</h3>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="settings-options">
                <!-- 搜索设置 -->
                <div class="setting-group">
                    <h4 class="group-title">搜索设置</h4>
                    <div class="setting-item">
                        <span class="setting-label">偏移量</span>
                        <input type="number" class="number-input" id="offset" min="0" value="0">
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">搜索个数</span>
                        <input type="number" class="number-input" id="limit" min="1" max="20" value="10">
                    </div>
                </div>

                <!-- 音乐设置 -->
                <div class="setting-group">
                    <h4 class="group-title">音乐设置</h4>
                    <div class="setting-item" style="display:block;">
                        <span class="setting-label">下载无损或HiRes报错可尝试先下一次高品质后重试</span>
                    </div>
                    <div class="setting-item" style="display:block;">
                        <span class="setting-label">音质选择</span>
                        <div class="quality-options">
                            <div class="quality-option">
                                <input type="radio" id="standard" name="quality" value="standard" checked>
                                <label for="standard" class="quality-label">标准</label>
                            </div>
                            <div class="quality-option">
                                <input type="radio" id="exhigh" name="quality" value="exhigh">
                                <label for="exhigh" class="quality-label">高品质</label>
                            </div>
                            <div class="quality-option">
                                <input type="radio" id="lossless" name="quality" value="lossless">
                                <label for="lossless" class="quality-label">无损</label>
                            </div>
                            <div class="quality-option">
                                <input type="radio" id="hires" name="quality" value="hires">
                                <label for="hires" class="quality-label">HiRes</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="save-button">
                    <button class="save-btn" onclick="saveSettings()">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 设置数据
        let settings = {
            offset: 0,
            limit: 10,
            quality: 'standard'
        };

        // 代理服务器地址
        const PROXY_SERVER = 'http://' + SERVER_IP;

        // 音乐缓存 - 存储歌曲的Blob对象
        const musicCache = new Map();

        // 加载保存的设置
        function loadSettings() {
            const savedSettings = localStorage.getItem('musicSearchSettings');
            if (savedSettings) {
                settings = JSON.parse(savedSettings);
                document.getElementById('offset').value = settings.offset;
                document.getElementById('limit').value = settings.limit;
                document.querySelector(`input[name="quality"][value="${settings.quality}"]`).checked = true;
            }
        }

        // 保存设置
        function saveSettings() {
            settings.offset = parseInt(document.getElementById('offset').value) || 0;
            settings.limit = parseInt(document.getElementById('limit').value) || 10;
            settings.quality = document.querySelector('input[name="quality"]:checked').value;

            localStorage.setItem('musicSearchSettings', JSON.stringify(settings));
            closeSettings();
        }

        // 搜索音乐
        async function searchMusic(keyword) {
            const url = `${PROXY_SERVER}/searchMusic?keyword=${keyword}&offset=${settings.offset}&limit=${settings.limit}`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`搜索失败: ${response.status} ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                console.error('搜索音乐时出错:', error);
                alert('搜索失败，请检查服务器连接');
                return [];
            }
        }

        // 获取歌词
        async function getLyrics(songId) {
            const url = `${PROXY_SERVER}/getLyrics?id=${songId}`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`获取歌词失败: ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                return data.lrc || '暂无歌词';
            } catch (error) {
                console.error('获取歌词时出错:', error);
                return '获取歌词失败';
            }
        }

        // 获取音乐URL
        async function getMusicUrl(songId) {
            const url = `${PROXY_SERVER}/getMusicUrl?id=${songId}&level=${settings.quality}`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`获取音乐URL失败: ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                return data.url;
            } catch (error) {
                console.error('获取音乐URL时出错:', error);
                return null;
            }
        }

        // 清理URL参数
        function cleanUrl(url) {
            if (!url) return null;
            // 移除URL中的查询参数
            return url.split('?')[0];
        }

        // 通过代理服务器获取图片
        function getImageProxyUrl(imageUrl) {
            if (!imageUrl) return null;
            return `${PROXY_SERVER}/download?url=${encodeURIComponent(imageUrl)}`;
        }

        // 加载图片
        function loadCoverImage(imgElement, imageUrl) {
            if (!imageUrl) {
                imgElement.style.display = 'none';
                return;
            }

            const proxyUrl = getImageProxyUrl(imageUrl);

            // 创建新的Image对象进行预加载
            const tempImg = new Image();
            tempImg.onload = function() {
                imgElement.src = proxyUrl;
                imgElement.style.display = 'block';
            };
            tempImg.onerror = function() {
                imgElement.style.display = 'none';
            };
            tempImg.src = proxyUrl;
        }

        // 搜索功能
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (keyword === '') return;

            showSearchResults();
            displaySearchResults(keyword);
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // 显示搜索结果
        function showSearchResults() {
            document.getElementById('searchResults').classList.add('show');
            document.getElementById('basicFunction').classList.add('hide');
        }

        // 显示搜索结果列表
        async function displaySearchResults(keyword) {
            const musicList = document.getElementById('musicList');
            musicList.innerHTML = '';

            const loadingElement = document.createElement('p');
            loadingElement.className = 'hint';
            loadingElement.textContent = '搜索中...';
            musicList.appendChild(loadingElement);

            try {
                const musicJson = await searchMusic(keyword)

                musicList.innerHTML = '';

                if (musicJson.length === 0) {
                    musicList.innerHTML = '<p class="hint">未找到相关音乐</p>';
                    return;
                }

                musicJson.forEach(music => {
                    const musicItem = createMusicItem(music);
                    musicList.appendChild(musicItem);
                });
            } catch (error) {
                musicList.innerHTML = '<p class="hint error">搜索失败，请稍后重试</p>';
            }
        }

        // 创建音乐项
        function createMusicItem(music) {
            const item = document.createElement('div');
            item.className = 'music-item';

            // 获取专辑封面URL
            const coverUrl = music.album && music.album.picUrl ? music.album.picUrl : '';

            // 创建封面容器
            const coverContainer = document.createElement('div');
            coverContainer.className = 'music-cover';

            // 如果没有封面URL，显示默认图标
            if (!coverUrl) {
                coverContainer.textContent = '📀';
            } else {
                // 创建图片元素但不立即设置src
                const img = document.createElement('img');
                img.className = 'music-cover-img';
                img.alt = music.name;
                coverContainer.appendChild(img);

                // 异步加载图片
                setTimeout(() => {
                    loadCoverImage(img, coverUrl);
                }, 0);
            }

            // 创建音乐信息（textContent 防 XSS）
            const infoDiv = document.createElement('div');
            infoDiv.className = 'music-info';
            const titleDiv = document.createElement('div');
            titleDiv.className = 'music-title';
            titleDiv.textContent = music.name;
            const artistDiv = document.createElement('div');
            artistDiv.className = 'music-artist';
            artistDiv.textContent = music.artists.map(artist => artist.name).join('、');
            infoDiv.appendChild(titleDiv);
            infoDiv.appendChild(artistDiv);

            // 创建动作按钮容器
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'music-actions';

            // 创建播放按钮
            const playButton = document.createElement('button');
            playButton.className = 'play-btn';
            playButton.textContent = '▶';
            playButton.title = '播放';
            playButton.onclick = () => playMusic(music.id, music.name, music.artists.map(artist => artist.name).join('、'));

            // 创建歌词按钮
            const lyricsButton = document.createElement('button');
            lyricsButton.className = 'lyrics-btn';
            lyricsButton.textContent = '词';
            lyricsButton.title = '查看歌词';
            lyricsButton.onclick = (e) => toggleLyrics(e, music.id, music.name, music.artists.map(artist => artist.name).join('、'));

            actionsDiv.appendChild(playButton);
            actionsDiv.appendChild(lyricsButton);

            // 组装音乐项
            item.appendChild(coverContainer);
            item.appendChild(infoDiv);
            item.appendChild(actionsDiv);

            return item;
        }

        // 切换歌词显示/隐藏
        async function toggleLyrics(event, songId, songName, artistName) {
            const musicItem = event.target.closest('.music-item');
            if (!musicItem) return;

            // 检查是否已有歌词容器
            let lyricsContainer = musicItem.nextElementSibling;

            // 如果下一个元素不是歌词容器，则创建新的
            if (!lyricsContainer || !lyricsContainer.classList.contains('lyrics-container')) {
                // 创建新的歌词容器
                lyricsContainer = document.createElement('div');
                lyricsContainer.className = 'lyrics-container';
                lyricsContainer.dataset.songId = songId;

                // 创建歌词标题
                const lyricsTitle = document.createElement('div');
                lyricsTitle.className = 'lyrics-title';
                lyricsTitle.textContent = `${songName} - ${artistName}`;

                // 创建歌词内容区域
                const lyricsContent = document.createElement('div');
                lyricsContent.className = 'lyrics-content';
                lyricsContent.innerHTML = '<p class="hint">加载中...</p>';

                lyricsContainer.appendChild(lyricsTitle);
                lyricsContainer.appendChild(lyricsContent);

                // 在音乐项后插入歌词容器
                musicItem.parentNode.insertBefore(lyricsContainer, musicItem.nextSibling);

                // 加载歌词
                try {
                    const lyrics = await getLyrics(songId);
                    lyricsContent.textContent = lyrics;
                } catch (error) {
                    lyricsContent.innerHTML = '<p class="hint error">歌词加载失败</p>';
                }

                // 显示歌词容器
                lyricsContainer.classList.add('show');
            } else {
                // 如果已有歌词容器，切换其显示状态
                lyricsContainer.classList.toggle('show');
            }
        }

        // 下载音乐到缓存
        async function downloadAndCacheMusic(songId) {
            try {
                // 获取音乐URL
                const musicUrl = await getMusicUrl(songId);
                if (!musicUrl) {
                    throw new Error('获取音乐URL失败');
                }

                // 清理URL参数
                const cleanMusicUrl = cleanUrl(musicUrl);
                if (!cleanMusicUrl) {
                    throw new Error('处理音乐URL失败');
                }

                // 通过代理服务器下载音乐
                const proxyMusicUrl = `${PROXY_SERVER}/download?url=${encodeURIComponent(cleanMusicUrl)}`;

                // 显示下载状态
                document.getElementById('loadingText').textContent = `正在下载${settings.quality}...`;

                // 下载音乐数据
                const response = await fetch(proxyMusicUrl);
                if (!response.ok) {
                    throw new Error('下载音乐失败');
                }

                const blob = await response.blob();

                // 将音乐数据缓存到内存中
                musicCache.set(`${songId}-${settings.quality}`, blob);

                document.getElementById('loadingText').textContent = `${settings.quality}已缓存`;

                return blob;
            } catch (error) {
                console.error('下载音乐时出错:', error);
                document.getElementById('loadingText').textContent = '下载失败';
                throw error;
            }
        }

        // 播放音乐
        async function playMusic(songId, songName, artistName) {
            try {
                // 显示播放器
                document.getElementById('playerContainer').classList.add('show');
                document.getElementById('playerTitle').textContent = songName;
                document.getElementById('playerArtist').textContent = artistName;
                document.getElementById('loadingText').textContent = '';

                const audioPlayer = document.getElementById('audioPlayer');

                // 检查缓存中是否有该音乐
                if (musicCache.has(`${songId}-${settings.quality}`)) {
                    // 从缓存中播放
                    const cachedBlob = musicCache.get(`${songId}-${settings.quality}`);
                    const blobUrl = URL.createObjectURL(cachedBlob);
                    audioPlayer.src = blobUrl;
                    audioPlayer.load();

                    document.getElementById('loadingText').textContent = `正在播放缓存${settings.quality}`;
                } else {
                    // 缓存中没有，先下载再播放
                    document.getElementById('loadingText').textContent = `正在下载${settings.quality}...`;

                    const blob = await downloadAndCacheMusic(songId);
                    const blobUrl = URL.createObjectURL(blob);
                    audioPlayer.src = blobUrl;
                    audioPlayer.load();

                    document.getElementById('loadingText').textContent = `正在播放${settings.quality}`;
                }

                // 尝试播放
                audioPlayer.play().catch(e => {
                    console.error('播放失败:', e);
                    alert(`播放失败: ${e.message}`);
                });

            } catch (error) {
                console.error('播放音乐时出错:', error);
                alert(`播放失败: ${error.message}`);
                document.getElementById('loadingText').textContent = '播放失败';
            }
        }

        // 关闭播放器
        function closePlayer() {
            document.getElementById('playerContainer').classList.remove('show');
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.pause();
            audioPlayer.src = '';
            document.getElementById('loadingText').textContent = '';
        }

        // 打开设置窗口
        function openSettings() {
            loadSettings();
            document.getElementById('settingsModal').classList.add('show');
        }

        // 关闭设置窗口
        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        // 点击模态框外部关闭
        document.getElementById('settingsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                saveSettings();
                closeSettings();
            }
        });

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
        });
    </script>
</body>
</html>
