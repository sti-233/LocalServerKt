<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>狼人杀 - Play</title>
    <link rel="stylesheet" href="/resources/lib/theme.css">
    <script src="/resources/lib/page-store.js"></script>
    <script src="/resources/lib/theme.js"></script>
    <link rel="stylesheet" href="/resources/play/play.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <h1>🐺 狼人杀</h1>
        <div class="room-chip hidden" id="roomChip">
            <span class="room-chip-label">房号</span>
            <strong class="room-id" id="roomId">----</strong>
            <span class="room-title hidden" id="roomTitle"></span>
            <button class="btn tiny" id="copyBtn" type="button">复制</button>
        </div>
        <span class="conn-text" id="phaseHint"></span>
    </div>
    <div class="topbar-right">
        <a class="top-link" href="/resources/play/index.html">← 游戏大厅</a>
        <span id="connDot" class="conn-dot wait" title="正在连接…"></span>
    </div>
</div>

<div class="wrap">

    <!-- ================= A. 大厅态 ================= -->
    <div id="lobby">
        <div class="lobby">
            <div class="card">
                <h3 class="card-title">创建房间</h3>
                <div class="join-row">
                    <input id="nameInput" class="text-input" placeholder="房间别名（可留空）" maxlength="20">
                    <button id="createBtn" class="btn primary" type="button">创建房间</button>
                </div>
                <p class="card-hint">创建后把房号发给朋友，他们用「加入」进来。</p>
            </div>
            <div class="card">
                <h3 class="card-title">加入房间</h3>
                <div class="join-row">
                    <input id="roomInput" class="text-input" placeholder="房号，如 ABCD" maxlength="8">
                    <button id="joinBtn" class="btn" type="button">加入</button>
                </div>
                <p class="card-hint">房号不区分大小写。</p>
            </div>
        </div>

        <h2 class="page-title">房间列表</h2>
        <div class="panel">
            <div id="rooms" class="room-list"></div>
        </div>
    </div>

    <!-- ================= B. 房间态 ================= -->
    <div id="room" class="hidden">
        <div id="banner" class="banner hidden"></div>
        <div id="errBar" class="err-bar hidden"></div>

        <div class="room-cols">
            <div class="col side">
                <div class="panel" id="mePanel"></div>

                <div class="panel">
                    <div class="sec-head">
                        <span class="sec-title">玩家</span>
                        <span class="sec-count" id="playerCount"></span>
                    </div>
                    <div id="players" class="players"></div>
                </div>

                <div class="panel hidden" id="seerPanel">
                    <div class="sec-head"><span class="sec-title">查验记录</span></div>
                    <div id="seerList" class="kv-list"></div>
                </div>

                <div class="panel hidden" id="wolfPanel">
                    <div class="sec-head"><span class="sec-title">狼人刀口</span></div>
                    <div id="wolfList" class="kv-list"></div>
                </div>

                <div class="panel hidden" id="deathsPanel">
                    <div class="sec-head"><span class="sec-title">昨夜死亡</span></div>
                    <div id="deathsList" class="kv-list"></div>
                </div>

                <div class="panel hidden" id="hostPanel">
                    <div class="sec-head">
                        <span class="sec-title">房主管理</span>
                        <span class="sec-count" id="hostPhase"></span>
                    </div>
                    <div id="hostBody" class="host-body"></div>
                </div>
            </div>

            <div class="col main">
                <div id="log" class="log"></div>
                <div id="acts" class="acts"></div>
                <div class="chatbar">
                    <button id="wolfTab" class="btn tiny wolf-tab hidden" type="button">狼人频道</button>
                    <input id="chatInput" class="text-input chat-input" placeholder="说点什么…" maxlength="200">
                    <button id="sendBtn" class="btn primary" type="button">发送</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/resources/play/play.js"></script>
<script>
    (function () {
        'use strict';

        var GAME = 'werewolf';

        var state = null;
        var room = '';
        var mySeat = '';
        var gotState = false;
        var resumeTimer = null;
        var wolfScope = false;   // 聊天是否发到狼人频道
        var witchMode = '';      // '' | 'poison'：女巫点了「用毒药」后进入选人态

        var dot = Play.$('connDot');
        var phaseHint = Play.$('phaseHint');
        var roomChip = Play.$('roomChip');
        var roomIdEl = Play.$('roomId');
        var roomTitleEl = Play.$('roomTitle');
        var lobbyEl = Play.$('lobby');
        var roomEl = Play.$('room');
        var bannerEl = Play.$('banner');
        var errBar = Play.$('errBar');
        var mePanel = Play.$('mePanel');
        var playersEl = Play.$('players');
        var playerCount = Play.$('playerCount');
        var seerPanel = Play.$('seerPanel');
        var seerList = Play.$('seerList');
        var wolfPanel = Play.$('wolfPanel');
        var wolfList = Play.$('wolfList');
        var deathsPanel = Play.$('deathsPanel');
        var deathsList = Play.$('deathsList');
        var hostPanel = Play.$('hostPanel');
        var hostBody = Play.$('hostBody');
        var hostPhase = Play.$('hostPhase');
        var logEl = Play.$('log');
        var actsEl = Play.$('acts');
        var chatInput = Play.$('chatInput');
        var wolfTab = Play.$('wolfTab');
        var nameInput = Play.$('nameInput');
        var roomInput = Play.$('roomInput');
        var roomsEl = Play.$('rooms');

        var STATUS_TEXT = { ok: '已连接', wait: '连接中…', down: '已断开，重连中…' };

        /* ---------- 公共小工具 ---------- */

        function show(node, on) {
            if (!node) return;
            if (on) node.classList.remove('hidden');
            else node.classList.add('hidden');
        }

        function showErr(text) {
            if (!text) { show(errBar, false); return; }
            errBar.textContent = String(text);
            show(errBar, true);
        }

        function pickRoom() {
            var v = (roomInput.value || '').replace(/\s+/g, '').toUpperCase();
            if (!v) { Play.toast('先输入房号'); roomInput.focus(); return; }
            // 房间里已经没有昵称了：座位名由服务端按顺序给（玩家1、玩家2…）
            Play.send({ type: 'join', room: v });
        }

        /* 创建时填的是房间别名，不是玩家昵称 */
        function roomTitleOf() {
            return (nameInput.value || '').trim();
        }

        function playerMap() {
            var map = {};
            ((state && state.players) || []).forEach(function (p) { map[p.id] = p; });
            return map;
        }

        function nameOf(id) {
            var p = playerMap()[id];
            return p && p.name ? p.name : String(id || '?');
        }

        function isAlive(p) {
            return p && p.alive !== false;
        }

        /* 还离线着的人名。开局要求全员在线，列出来房主才知道在等谁。 */
        function offlineNames() {
            var out = [];
            ((state && state.players) || []).forEach(function (p) {
                if (p.online === false) out.push(p.name || '玩家');
            });
            return out;
        }

        /* ---------- A. 大厅 ---------- */

        function enterLobby() {
            room = '';
            state = null;
            gotState = false;
            wolfScope = false;
            witchMode = '';
            show(lobbyEl, true);
            show(roomEl, false);
            show(roomChip, false);
            phaseHint.textContent = '';
            // 不清空房间列表：等服务端回新的 roomList 再覆盖，避免回大厅时闪空态
            Play.send({ type: 'lobby' });
        }

        function goRoom(r) {
            if (!r || !r.id) return;
            if (r.game && r.game !== GAME) {
                location.href = '/resources/play/' + r.game + '.html?room=' + encodeURIComponent(r.id);
                return;
            }
            roomInput.value = String(r.id).toUpperCase();
            pickRoom();
        }

        /* ---------- 渲染：我的信息 ---------- */

        function addInfoRow(parent, key, val, extraCls) {
            var row = Play.el('div', 'info-row');
            row.appendChild(Play.el('span', 'info-key', key));
            row.appendChild(Play.el('span', 'info-val' + (extraCls ? ' ' + extraCls : ''), val));
            parent.appendChild(row);
        }

        function renderMe() {
            Play.clear(mePanel);
            if (!state) return;
            if (state.myRole) {
                addInfoRow(mePanel, '我的身份：', Play.roleName(state.myRole),
                    state.myRole === 'wolf' ? 'role-wolf' : '');
            } else {
                addInfoRow(mePanel, '我的身份：', '未分配', 'dim');
            }
            if (state.round) addInfoRow(mePanel, '轮次：', '第 ' + state.round + ' 轮');
        }

        /* ---------- 渲染：查验 / 刀口 / 死亡 ---------- */

        function renderSeer() {
            var checks = (state && state.seerChecks) || {};
            var ids = Object.keys(checks);
            if (!ids.length) { show(seerPanel, false); return; }
            show(seerPanel, true);
            Play.clear(seerList);
            ids.forEach(function (id) {
                var row = Play.el('div', 'kv-row');
                row.appendChild(Play.el('span', 'kv-k', nameOf(id)));
                row.appendChild(Play.el('span', 'kv-arrow', '→'));
                row.appendChild(Play.el('span', 'kv-v', Play.roleName(checks[id])));
                seerList.appendChild(row);
            });
        }

        function renderWolfVotes() {
            var votes = (state && state.wolfVotes) || {};
            var ids = Object.keys(votes);
            if (!ids.length) { show(wolfPanel, false); return; }
            show(wolfPanel, true);
            Play.clear(wolfList);
            ids.forEach(function (id) {
                var row = Play.el('div', 'kv-row');
                row.appendChild(Play.el('span', 'kv-k', nameOf(id)));
                row.appendChild(Play.el('span', 'kv-arrow', '刀 →'));
                row.appendChild(Play.el('span', 'kv-v', nameOf(votes[id])));
                wolfList.appendChild(row);
            });
        }

        function renderDeaths() {
            var deaths = (state && state.deaths) || [];
            if (!deaths.length) { show(deathsPanel, false); return; }
            show(deathsPanel, true);
            Play.clear(deathsList);
            deaths.forEach(function (id) {
                var row = Play.el('div', 'kv-row');
                row.appendChild(Play.el('span', 'kv-k', nameOf(id)));
                row.appendChild(Play.el('span', 'kv-v', '出局'));
                deathsList.appendChild(row);
            });
        }

        /* ---------- 渲染：结果横幅 ---------- */

        function renderBanner() {
            if (!state) { show(bannerEl, false); return; }
            var text = '';
            if (state.phase === 'finished') {
                if (state.result === 'good') text = '🎉 好人胜利';
                else if (state.result === 'wolves') text = '🎉 狼人胜利';
                else text = '本局结束';
            }
            if (!text) { show(bannerEl, false); return; }
            bannerEl.textContent = text;
            bannerEl.className = 'banner' + (state.result === 'wolves' ? ' win' : '');
            show(bannerEl, true);
        }

        /* ---------- 渲染：投票 ---------- */

        function voteCard(title, list, myVote, tally, onPick, prefix) {
            var card = Play.el('div', 'act-card');
            card.appendChild(Play.el('div', 'act-title', title));
            var row = Play.el('div', 'btn-row');
            if (!list.length) row.appendChild(Play.el('div', 'act-hint', '没有可选的玩家'));
            list.forEach(function (p) {
                var label = (prefix || '') + (p.name || '玩家');
                var b = Play.el('button', 'btn' + (myVote && myVote === p.id ? ' sel' : ''), label);
                b.type = 'button';
                var n = tally && tally[p.id];
                if (n) b.appendChild(Play.el('span', 'tally', ' ' + n));
                b.onclick = function () { onPick(p); };
                row.appendChild(b);
            });
            card.appendChild(row);
            return card;
        }

        function alivePlayers() {
            return ((state && state.players) || []).filter(isAlive);
        }

        /* ---------- 渲染：夜间行动 ---------- */

        /**
         * 狼人眼里的「非狼人」候选：协议里别人的 role 恒为 null，
         * 只能靠 wolfVotes 的键（其他狼的座位）+ 自己来判，判不出来的由服务端兜底。
         */
        function wolfSet() {
            var set = {};
            if (mySeat) set[mySeat] = true;
            var votes = (state && state.wolfVotes) || {};
            Object.keys(votes).forEach(function (id) { set[id] = true; });
            ((state && state.players) || []).forEach(function (p) {
                if (p.role === 'wolf') set[p.id] = true;
            });
            return set;
        }

        /**
         * 狼人们当前各投了谁。多个狼人必须指向同一个人才能进入下一步，
         * 所以这行是给他们商量用的，不是给外人看的（服务端只对狼下发 wolfVotes）。
         */
        function wolfVoteSummary() {
            var votes = (state && state.wolfVotes) || {};
            var ids = Object.keys(votes);
            var off = offlineWolves();
            var warn = off.length
                ? '离线的狼人不参与这一刀：' + off.join('、') + '。'
                : '';
            if (!ids.length) return warn + '还没有狼人表态。';
            var targets = {};
            ids.forEach(function (id) { targets[votes[id]] = true; });
            var parts = ids.map(function (id) {
                return nameOf(id) + ' → ' + nameOf(votes[id]);
            });
            var text = warn + '当前刀口：' + parts.join('　');
            if (Object.keys(targets).length > 1) {
                text += '（意见不一致，统一目标后才能进入下一步）';
            } else {
                text += '（一致）';
            }
            return text;
        }

        /**
         * 已经离线、因而不需要表态的狼人。
         *
         * 服务端只等在线狼人（否则一个人关了手机，剩下的狼永远凑不出一致），
         * 所以这里也得把离线的人摘掉 —— 不然在场的人会以为还差他一票。
         */
        function offlineWolves() {
            var out = [];
            var known = wolfSet();
            ((state && state.players) || []).forEach(function (p) {
                if (known[p.id] && isAlive(p) && p.online === false) {
                    out.push(p.name || '玩家');
                }
            });
            return out;
        }

        function nightCard(kind) {
            var card = Play.el('div', 'act-card');
            var row;
            var wolves;

            if (kind === 'wolf') {
                card.appendChild(Play.el('div', 'act-title', '狼人行动：选择今晚要刀的人'));
                // 多个狼人必须统一目标才能进入下一步，各自看到别人投了谁才好商量
                card.appendChild(Play.el('div', 'act-hint', wolfVoteSummary()));
                row = Play.el('div', 'btn-row');
                wolves = wolfSet();
                alivePlayers().forEach(function (p) {
                    if (wolves[p.id]) return;
                    var b = Play.el('button', 'btn', '刀他：' + (p.name || '玩家'));
                    b.type = 'button';
                    b.onclick = function () {
                        Play.action('wolfVote', { target: p.id });
                        Play.toast('已选择刀 ' + (p.name || '该玩家'));
                    };
                    row.appendChild(b);
                });
                if (!row.firstChild) row.appendChild(Play.el('div', 'act-hint', '没有可选目标'));
                card.appendChild(row);

            } else if (kind === 'seer') {
                card.appendChild(Play.el('div', 'act-title', '预言家行动：查验一个人'));
                row = Play.el('div', 'btn-row');
                alivePlayers().forEach(function (p) {
                    // 验自己没有意义，服务端也会拒，干脆不给这个选项
                    if (p.me) return;
                    var b = Play.el('button', 'btn', '查验：' + (p.name || '玩家'));
                    b.type = 'button';
                    b.onclick = function () {
                        Play.action('seerCheck', { target: p.id });
                        Play.toast('已查验 ' + (p.name || '该玩家'));
                    };
                    row.appendChild(b);
                });
                card.appendChild(row);

            } else if (kind === 'witch') {
                card.appendChild(Play.el('div', 'act-title', '女巫行动：今晚要用什么药？'));

                // 解药与毒药各只有一瓶，可以都不用。服务端只对女巫下发剩余数。
                var antidoteLeft = state.antidoteLeft === undefined ? 1 : Number(state.antidoteLeft);
                var poisonLeft = state.poisonLeft === undefined ? 1 : Number(state.poisonLeft);
                var hasAntidote = antidoteLeft > 0;
                var hasPoison = poisonLeft > 0;
                card.appendChild(Play.el('div', 'act-hint',
                    '解药 ×' + (hasAntidote ? 1 : 0) + '　毒药 ×' + (hasPoison ? 1 : 0)));

                // 女巫必须知道今晚谁被刀了，否则「要不要用解药」根本无从判断。
                // 服务端只在夜间、且只对女巫下发 wolfVictim。
                var victim = state.wolfVictim;
                if (victim) {
                    var who = nameOf(victim);
                    var mine = victim === mySeat;
                    card.appendChild(Play.el('div', 'act-hint',
                        mine ? '今晚被袭击的是你自己（' + who + '），不能自救。'
                             : '今晚被袭击的是 ' + who + '。'));
                } else {
                    card.appendChild(Play.el('div', 'act-hint', '今晚没有人被袭击。'));
                }

                row = Play.el('div', 'btn-row');
                if (witchMode !== 'poison') {
                    // 没人被刀时解药没有意义，直接不给按钮（服务端也会拒）；
                    // 解药用完（antidoteLeft === 0）同样不显示
                    if (hasAntidote && victim && victim !== mySeat) {
                        var save = Play.el('button', 'btn primary', '用解药救 ' + nameOf(victim));
                        save.type = 'button';
                        save.onclick = function () {
                            Play.action('witchAct', { use: 'save' });
                            Play.toast('已使用解药');
                        };
                        row.appendChild(save);
                    }

                    // 毒药用完（poisonLeft === 0）就不显示这个按钮
                    if (hasPoison) {
                        var poison = Play.el('button', 'btn', '用毒药');
                        poison.type = 'button';
                        poison.onclick = function () {
                            witchMode = 'poison';
                            renderActs();
                        };
                        row.appendChild(poison);
                    }

                    var none = Play.el('button', 'btn', '本夜不用药');
                    none.type = 'button';
                    none.onclick = function () {
                        Play.action('witchAct', { use: 'none' });
                        Play.toast('本夜不用药');
                    };
                    row.appendChild(none);
                    card.appendChild(row);
                } else {
                    card.appendChild(Play.el('div', 'act-hint', '选一个要毒死的人：'));
                    alivePlayers().forEach(function (p) {
                        // 毒自己没有意义，服务端也会拒
                        if (p.me) return;
                        var b = Play.el('button', 'btn on', '毒 ' + (p.name || '玩家'));
                        b.type = 'button';
                        b.onclick = function () {
                            Play.action('witchAct', { use: 'poison', target: p.id });
                            witchMode = '';
                            Play.toast('已下毒 ' + (p.name || '该玩家'));
                        };
                        row.appendChild(b);
                    });
                    var cancel = Play.el('button', 'btn', '取消');
                    cancel.type = 'button';
                    cancel.onclick = function () {
                        witchMode = '';
                        renderActs();
                    };
                    row.appendChild(cancel);
                    card.appendChild(row);
                }

            } else if (kind === 'guard') {
                card.appendChild(Play.el('div', 'act-title', '守卫行动：守护一个人'));
                row = Play.el('div', 'btn-row');
                alivePlayers().forEach(function (p) {
                    var b = Play.el('button', 'btn', '守护：' + (p.name || '玩家'));
                    b.type = 'button';
                    b.onclick = function () {
                        Play.action('guardProtect', { target: p.id });
                        Play.toast('已守护 ' + (p.name || '该玩家'));
                    };
                    row.appendChild(b);
                });
                card.appendChild(row);
            }

            return card;
        }

        function renderActs() {
            Play.clear(actsEl);
            if (!state) return;

            // 夜间：按 pendingFor 逐个显示面板（空数组 = 不需要行动或已提交）
            var pending = state.pendingFor || [];
            pending.forEach(function (kind) {
                actsEl.appendChild(nightCard(kind));
            });

            // 白天讨论：每人必须发一次言，全员发完服务端自动开投票
            if (state.phase === 'day') {
                var hint = Play.speakHint(state);
                if (hint) actsEl.appendChild(Play.el('div', 'note', hint));
            }

            // 投票：投票卡片 + 弃票；已表态后只等自动结算
            if (state.phase === 'voting' || state.phase === 'vote') {
                if (state.myVoted) {
                    actsEl.appendChild(Play.el('div', 'note', Play.voteWaitHint(state)));
                } else if (state.canVote) {
                    // 目标是存活玩家，排除自己
                    var list = alivePlayers().filter(function (p) { return !p.me; });
                    var card = voteCard('投票：选出你要放逐的人',
                        list, state.myVote, state.tally, function (p) {
                            Play.action('vote', { target: p.id });
                            Play.toast('已投给 ' + (p.name || '该玩家'));
                        });

                    var row = Play.el('div', 'btn-row');
                    var skip = Play.el('button', 'btn', '弃票');
                    skip.type = 'button';
                    skip.onclick = function () {
                        Play.action('abstain');
                        Play.toast('已弃票');
                    };
                    row.appendChild(skip);
                    card.appendChild(row);
                    actsEl.appendChild(card);
                } else {
                    actsEl.appendChild(Play.el('div', 'note', '投票进行中，等待其他玩家…'));
                }

                if (state.voteIn > 0) {
                    var progress = (state.votedCount || 0) + '/' + (state.voteTotal || 0);
                    actsEl.appendChild(Play.el('div', 'note',
                        '已表态 ' + progress + ' · ' + Play.secsText(state.voteIn)));
                }
            }

            // 夜间不是并发提交的：守卫→狼人→女巫→预言家挨个来。
            // 没轮到自己（或已经交过）时明确告诉他们现在等谁，别让人对着空面板干等。
            if (state.phase === 'night' && !pending.length) {
                var step = state.nightStep || '';
                var text;
                if (!step) {
                    text = '夜间行动已全部提交，正在结算。';
                } else if (state.nightStepOffline) {
                    // 行动者全离线，服务端几秒后替他决定；说清楚就不会有人以为还要等满一分钟
                    text = Play.roleName(step) + '离线，即将自动行动。';
                } else {
                    text = '现在轮到' + Play.roleName(step) + '行动，请等待。';
                }
                actsEl.appendChild(Play.el('div', 'note', text));
            }
        }

        /* ---------- 渲染：房主管理 ---------- */

        function hostButton(label, cls, fn) {
            var b = Play.el('button', 'btn ' + (cls || ''), label);
            b.type = 'button';
            b.onclick = fn;
            return b;
        }

        function renderHost() {
            if (!state || !state.isHost) { show(hostPanel, false); return; }
            show(hostPanel, true);
            hostPhase.textContent = Play.phaseName(state.phase);

            Play.clear(hostBody);
            var phase = state.phase;

            if (phase === 'waiting') {
                if (state.canStart) {
                    hostBody.appendChild(hostButton('开始游戏', 'primary', function () {
                        Play.action('start');
                    }));
                } else {
                    // 人数够了但还有人离线时按钮会消失，不给提示就成了「按钮怎么没了」
                    var off = offlineNames();
                    if (off.length) {
                        hostBody.appendChild(Play.el('div', 'act-hint',
                            '等待上线：' + off.join('、')));
                    } else {
                        var n = 0;
                        (state.players || []).forEach(function (p) { if (!p.spectating) n++; });
                        if (n < 4) {
                            hostBody.appendChild(Play.el('div', 'act-hint', '还需要 ' + (4 - n) + ' 名玩家'));
                        }
                    }
                }
            } else if (phase === 'finished') {
                hostBody.appendChild(hostButton('再开一局', 'primary', function () {
                    Play.action('endGame');
                }));
            }
            // 讨论 / 夜晚 / 投票全部自动推进（全员发言自动开投票、全员投完自动结算、
            // 夜间收齐行动自动进下一步），房主没有可点的操作了

            // 解散房间：任何时候都能做（包括对局中），所以放在分支外面
            var row = Play.el('div', 'btn-row');
            var dis = Play.el('button', 'btn', '解散房间');
            dis.type = 'button';
            dis.onclick = function () {
                if (!window.confirm('解散后房间会立刻消失，其他人会被踢回大厅。确定吗？')) return;
                Play.send({ type: 'disband' });
            };
            row.appendChild(dis);
            hostBody.appendChild(row);
        }

        /* ---------- 渲染：聊天频道 ---------- */

        function renderWolfTab() {
            if (state && state.myRole === 'wolf') {
                show(wolfTab, true);
                wolfTab.className = 'btn tiny wolf-tab' + (wolfScope ? ' on' : '');
                wolfTab.textContent = wolfScope ? '狼人频道（点回公共）' : '狼人频道';
            } else {
                wolfScope = false;
                show(wolfTab, false);
            }
        }

        /* ---------- 渲染总入口 ---------- */

        function render() {
            if (!state) return;
            roomIdEl.textContent = room || state.room || '----';
            if (state.title) {
                roomTitleEl.textContent = state.title;
                show(roomTitleEl, true);
            } else {
                show(roomTitleEl, false);
            }
            phaseHint.textContent = Play.phaseName(state.phase) +
                (state.round ? ' · 第 ' + state.round + ' 轮' : '');
            renderMe();
            Play.renderPlayers(playersEl, state);
            playerCount.textContent = (state.players || []).length + ' 人';
            Play.renderLog(logEl, state.log);
            renderSeer();
            renderWolfVotes();
            renderDeaths();
            renderBanner();
            renderActs();
            renderHost();
            renderWolfTab();
        }

        /* ---------- 状态/事件 ---------- */

        function applyJoined(msg) {
            room = msg.room || room;
            mySeat = msg.seat || mySeat;
            if (room && mySeat) Play.setSeat(room, mySeat);
            if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
            show(lobbyEl, false);
            show(roomEl, true);
            show(roomChip, true);
            roomIdEl.textContent = room;
        }

        function applyState(msg) {
            room = msg.room || room;
            mySeat = msg.seat || mySeat;
            if (room && mySeat) Play.setSeat(room, mySeat);
            state = msg.state || {};
            gotState = true;
            if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
            // 不再是夜间行动了就把女巫的选人态收起，避免下一晚误触
            var pending = state.pendingFor || [];
            if (pending.indexOf('witch') < 0) witchMode = '';
            if (state.myRole !== 'wolf') wolfScope = false;
            show(lobbyEl, false);
            show(roomEl, true);
            show(roomChip, true);
            showErr('');
            render();
        }

        /* ---------- 连接 ---------- */

        function onStatus(s) {
            dot.className = 'conn-dot ' + s;
            dot.title = STATUS_TEXT[s] || '';
        }

        function resumeOrLobby() {
            var seat = room ? Play.getSeat(room) : '';
            if (room && seat) {
                mySeat = seat;
                // 重连后要重新订阅，等新 state 到达才算恢复；页面继续显示旧内容
                gotState = false;
                Play.send({ type: 'resume', room: room, seat: seat });
                if (resumeTimer) clearTimeout(resumeTimer);
                resumeTimer = setTimeout(function () {
                    resumeTimer = null;
                    if (!gotState) {
                        Play.clearSeat(room);
                        Play.toast('房间已失效，回到大厅');
                        enterLobby();
                    }
                }, 6000);
            } else {
                Play.send({ type: 'lobby' });
            }
        }

        Play.connect({
            onOpen: resumeOrLobby,
            onJoined: applyJoined,
            onState: applyState,
            onRoomList: function (rooms) {
                Play.renderRooms(roomsEl, rooms, goRoom);
            },
            onClosed: function (msg) {
                showErr('');
                Play.toast((msg && msg.text) || '房间已解散');
                Play.clearSeat(room);
                enterLobby();
            },
            onError: function (text) {
                showErr(text);
                Play.toast(text);
            },
            onStatus: onStatus
        });

        /* ---------- 交互绑定 ---------- */

        Play.$('createBtn').onclick = function () {
            if (!Play.send({ type: 'create', game: GAME, name: roomTitleOf() })) {
                Play.toast('还没连上服务器，稍等一下');
            }
        };

        Play.$('joinBtn').onclick = pickRoom;

        roomInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); pickRoom(); }
        });
        nameInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); pickRoom(); }
        });

        Play.$('copyBtn').onclick = function () {
            if (!room) return;
            Play.copyText(room, function (ok) {
                Play.toast(ok ? '房号已复制' : '复制失败，请手动复制');
            });
        };

        wolfTab.onclick = function () {
            wolfScope = !wolfScope;
            renderWolfTab();
            Play.toast(wolfScope ? '切到狼人频道' : '切回公共频道');
        };

        function sendChat() {
            var text = (chatInput.value || '').trim();
            if (!text) return;
            var scope = wolfScope ? 'wolves' : 'public';
            if (!Play.chat(text, scope)) {
                Play.toast('未连接，消息没有发出');
                return;
            }
            chatInput.value = '';
        }

        Play.$('sendBtn').onclick = sendChat;
        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
        });

        /* ---------- 启动 ---------- */

        var q = {};
        (location.search.replace(/^\?/, '') || '').split('&').forEach(function (kv) {
            if (!kv) return;
            var i = kv.indexOf('=');
            var k = i < 0 ? kv : kv.slice(0, i);
            var v = i < 0 ? '' : kv.slice(i + 1);
            try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) { q[k] = v; }
        });

        var urlRoom = (q.room || '').toUpperCase();
        if (urlRoom) {
            roomInput.value = urlRoom;
            if (Play.getSeat(urlRoom)) {
                room = urlRoom;
            }
        }

        Play.renderRooms(roomsEl, null, goRoom);
    })();
</script>
</body>
</html>
