<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B站视频 - 推荐</title>
    <link rel="stylesheet" href="/resources/lib/theme.css">
    <script src="/resources/lib/theme.js"></script>
    <script src="/resources/config.js"></script>
    <link rel="stylesheet" href="/resources/video/video.css">
    <link rel="stylesheet" href="/resources/lib/lightbox.css">
    <script src="/resources/lib/lightbox.js"></script>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">
        <img class="bili-logo" id="biliLogo" alt="BiliBili">
        <h1>BiliBili</h1>
    </div>
    <div class="search-container">
        <input id="kw" class="search-box" placeholder="搜索视频、用户…">
        <button id="go" class="search-btn">🔍</button>
    </div>
    <a class="nav-setting" href="/setting" title="设置">⚙ 设置</a>
</div>

<div class="container">
    <div id="status"></div>
    <div id="feed"></div>
    <div style="text-align:center;margin:18px 0 28px">
        <button class="btn primary" id="more">换一批 / 加载更多</button>
    </div>
</div>

<script src="/resources/video/common.js"></script>
<script>
    document.getElementById('biliLogo').src = imgUrl('https://i0.hdslb.com/bfs/static/jinkela/long/images/favicon.ico');
    const feedEl = document.getElementById('feed');
    const statusEl = document.getElementById('status');
    const moreBtn = document.getElementById('more');

    let fresh = 0;
    let loading = false;
    // 已经画到页面上的全部条目，用于「从播放页退回来时照原样重画」
    let allItems = [];

    const CACHE_KEY = 'video_feed';

    /** 用快照重画列表（只在后退进入时走这里，见 common.js 的 cameBack） */
    function restore() {
        const snap = pageCache.get(CACHE_KEY);
        if (!snap || !snap.items || !snap.items.length) return false;
        allItems = snap.items;
        fresh = snap.fresh || 1;
        feedEl.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'grid';
        allItems.forEach(v => grid.appendChild(videoCard(v)));
        feedEl.appendChild(grid);
        if (fresh >= 10) moreBtn.style.display = 'none';
        return true;
    }

    async function load() {
        if (loading) return;
        loading = true;
        moreBtn.disabled = true;
        moreBtn.textContent = '加载中…';
        // 首次加载显示骨架，之后是追加
        if (fresh === 0) showSpinner(feedEl);
        try {
            const data = await api('/recommend', { fresh, pageSize: 12 });
            const items = data.items || [];
            if (fresh === 0) feedEl.innerHTML = '';
            if (!items.length) {
                if (fresh === 0) showHint(feedEl, '暂时没有推荐内容，稍后再试');
                moreBtn.style.display = 'none';
                return;
            }
            let grid = feedEl.querySelector('.grid');
            if (!grid) {
                grid = document.createElement('div');
                grid.className = 'grid';
                feedEl.appendChild(grid);
            }
            items.forEach(v => grid.appendChild(videoCard(v)));
            allItems = allItems.concat(items);
            fresh++;
            if (fresh >= 10) moreBtn.style.display = 'none';
            // 记下"现在页面上是什么"，从播放页退回来（页面被重建时）照这个重画
            pageCache.set(CACHE_KEY, { items: allItems, fresh: fresh });
        } catch (e) {
            if (fresh === 0) {
                feedEl.innerHTML = '';
                showError(statusEl, '加载推荐失败：' + e.message);
            } else {
                showError(statusEl, '加载更多失败：' + e.message);
            }
        } finally {
            loading = false;
            moreBtn.disabled = false;
            moreBtn.textContent = '换一批 / 加载更多';
        }
    }

    moreBtn.onclick = load;
    bindSearchBox('kw', 'go');

    // 滚到底部自动加载更多
    window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 320) load();
    });

    // 后退进入且有快照：直接照原样画，不请求 /recommend（否则列表会换一批）
    if (!(cameBack() && restore())) load();
</script>
</body>
</html>
