<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频观看 - B站</title>
    <link rel="stylesheet" href="/resources/lib/theme.css">
    <script src="/resources/lib/theme.js"></script>
    <script src="/resources/lib/page-store.js"></script>
    <script src="/resources/config.js"></script>
    <link rel="stylesheet" href="/resources/video/video.css">
    <link rel="stylesheet" href="/resources/lib/lightbox.css">
    <script src="/resources/lib/lightbox.js"></script>
    <script src="/resources/lib/idb-store.js"></script>
    <style>
        /* 左侧可收起的画质/音轨设置侧边栏：与 chat/music 侧边栏同款（230px、.open 展开、收起贴左）。
           内联在本页，避免影响 video.css 里 index/search/space 等其它共用页面。 */
        .wlayout { flex: 1; display: flex; min-height: 0; }
        #sidebar {
            width: 230px; flex: 0 0 230px;
            background: var(--card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 14px;
            transition: margin-left .2s ease;
        }
        #sidebar:not(.open) { margin-left: -230px; }
        .wmain { flex: 1; min-width: 0; overflow-y: auto; }
        /* 本页 body 固定视口高度：侧边栏/主区各自内部滚动（覆盖 video.css 的 min-height:100vh，
           仅影响本页；index/search/space 仍用自然页面滚动） */
        body { height: 100vh; }
        /* 顶栏不再 wrap：展开侧边栏不改变顶栏宽度，避免旧 Chrome 下与侧边栏布局互相
           触发重排（music.html 同款坑，见其注释）；小屏下搜索框改回 static 整行才需要 wrap */
        .topbar { flex-wrap: nowrap; }
        @media (max-width: 640px) { .topbar { flex-wrap: wrap; } }
        /* 侧边栏内容：竖排 label+select（用 margin 兜底而非 flex gap，兼容 Chrome 80） */
        .ws-card h3 { margin: 0 0 10px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
        .ws-row { margin-bottom: 10px; }
        .ws-row label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
        .ws-row .select { width: 100%; }
        .ws-info { margin-top: 4px; }
        /* 侧边栏里的音量子行：滑块吃掉剩余宽度（margin 兜底，不用 flex gap） */
        .ws-vol { display: flex; align-items: center; }
        .ws-vol > * + * { margin-left: 6px; }
        .ws-vol input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent, var(--pink)); }
        /* 音量百分比跟在 label 文字后面，字号与 label 一致但颜色浅一档 */
        .ws-vol-val { margin-left: 4px; font-weight: 400; color: var(--text); }
        /* 侧边栏里第二张及以后的卡片与上方留间距 */
        .ws-card + .ws-card { margin-top: 14px; }
        /* 侧边栏里的整行按钮：撑满宽度，字号跟侧边栏其它控件一致 */
        .ws-btn { width: 100%; padding: 7px 10px; font-size: 12px; }

        /* 续播提示条：浮在播放器底部，几秒后自动淡出。
           用 absolute 覆盖而不是插在播放器下方 —— 下方插入会把评论顶下去、
           也会改变页面高度，用户正看着视频时整页跳一下很难受。 */
        .player-wrap { position: relative; }
        .resume-tip {
            position: absolute;
            left: 12px;
            bottom: 68px;
            z-index: 5;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
            font-size: 13px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .18s ease, transform .18s ease;
            pointer-events: none;
        }
        .resume-tip.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .resume-tip > * + * { margin-left: 8px; }
        .resume-tip .resume-text { color: var(--text); }
        .resume-tip button {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--accent, var(--pink));
            color: var(--on-accent, #fff);
            cursor: pointer;
        }
        .resume-tip button.ghost-resume {
            background: transparent;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">
        <button id="sidebarToggle" class="icon-btn" title="显示/收起设置">☰</button>
        <h1>视频观看</h1>
    </div>
    <div class="search-container">
        <input id="kw" class="search-box" placeholder="搜索视频、用户…">
        <button id="go" class="search-btn">🔍</button>
    </div>
    <a class="nav-setting" href="/setting" title="设置">⚙ 设置</a>
</div>

<div class="wlayout">
    <!-- 画质/音轨设置侧边栏：与 chat/music 侧边栏同款（可收起，默认收起） -->
    <aside id="sidebar">
        <div class="ws-card">
            <h3>画质 / 音轨</h3>
            <div class="ws-row">
                <label for="format">格式</label>
                <select id="format" class="select">
                    <option value="mp4" selected>MP4</option>
                    <option value="dash">DASH</option>
                </select>
            </div>
            <div class="ws-row">
                <label for="quality">清晰度</label>
                <select id="quality" class="select"></select>
            </div>
            <div class="ws-row">
                <label for="codec">编码</label>
                <select id="codec" class="select"></select>
            </div>
            <span class="small muted ws-info" id="streamInfo"></span>
        </div>

        <!-- 音量与倍速收进侧边栏：原先贴在播放器下方，鼠标划到视频边缘容易误触滑块。
             侧边栏默认收起，要调时点 ☰ 展开，代价是多一次点击，换来播放区不被误碰。 -->
        <div class="ws-card">
            <h3>播放</h3>
            <div class="ws-row">
                <label for="vol">音量 <span class="ws-vol-val muted" id="volVal">10%</span></label>
                <div class="ws-vol">
                    <span style="font-size:14px">🔊</span>
                    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.1">
                </div>
            </div>
            <div class="ws-row">
                <label for="rate">倍速</label>
                <!-- 倍速用 <select> 而非自定义下拉：Chrome 80 直接可用，也不抢键盘快捷键 -->
                <select id="rate" class="select" title="播放倍速"></select>
            </div>
            <div class="ws-row" style="margin-bottom:0">
                <!-- 截帧：把当前画面画到 canvas 再交给 lightbox，保存/裁剪在那边（共用 lib/lightbox.js） -->
                <button id="shot" class="btn ws-btn" title="截取当前画面，可在预览里保存或裁剪">📷 截取当前画面</button>
            </div>
        </div>
    </aside>

    <div class="wmain">
    <div class="container">
    <div id="status"></div>

    <div id="content" style="display:none">
        <div class="player-wrap">
            <!-- preload=auto：设置 src 后立刻开始缓冲，用户点播放时已经有数据。
                 配合服务端的首段预取，起播基本是瞬时的。 -->
            <video id="player" controls playsinline preload="auto"></video>
            <!-- 续播提示：绝对定位浮在播放器上，避免插入 DOM 把下方内容顶下去 -->
            <div id="resumeTip" class="resume-tip">
                <span class="resume-text" id="resumeText"></span>
                <button type="button" id="resumeGo">继续播放</button>
                <button type="button" id="resumeNo" class="ghost-resume">从头开始</button>
            </div>
        </div>

        <div id="playMsg" class="small muted" style="margin-top:8px"></div>

        <div class="video-title" id="title"></div>

        <div class="up-row">
            <img id="upFace" data-lb alt="" referrerpolicy="no-referrer">
            <div>
                <div style="font-size:14px;font-weight:600" id="upName"></div>
                <div class="small muted" id="upMeta"></div>
            </div>
            <a class="btn" id="upSpace" style="margin-left:auto" target="_self">查看空间</a>
        </div>

        <div class="stat-row" id="stats"></div>

        <div class="card" id="pagesCard" style="display:none">
            <div class="small muted" style="margin-bottom:9px">分P列表（点击切换）</div>
            <div class="pages" id="pages"></div>
        </div>

        <div class="card">
            <div class="small muted" style="margin-bottom:9px">简介</div>
            <div class="desc" id="desc"></div>
        </div>

        <div class="card">
            <div class="cmt-toolbar">
                <span style="font-size:14px;font-weight:600">评论</span>
                <label class="small muted" style="margin-left:8px">排序</label>
                <select id="cmtSort" class="select">
                    <option value="3">按热度</option>
                    <option value="2">按时间</option>
                    <option value="1">热度+时间</option>
                </select>
                <span class="small muted" id="cmtCount" style="margin-left:auto"></span>
            </div>
            <div id="comments"></div>
            <div class="pager" id="cmtPager" style="display:none">
                <button class="btn" id="cmtPrev">上一页</button>
                <span class="info" id="cmtPageInfo"></span>
                <button class="btn" id="cmtNext">下一页</button>
            </div>
        </div>
    </div>
    </div><!-- /.container -->
    </div><!-- /.wmain -->
</div><!-- /.wlayout -->

<script src="/resources/video/common.js"></script>
<script>
    const statusEl = document.getElementById('status');
    const content = document.getElementById('content');
    const player = document.getElementById('player');
    const playMsg = document.getElementById('playMsg');
    const formatSel = document.getElementById('format');
    const qualitySel = document.getElementById('quality');

    // 设置侧边栏展开/收起（与 chat/music 同款，默认收起）
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('open');
    });
    const codecSel = document.getElementById('codec');
    const streamInfo = document.getElementById('streamInfo');
    const volSlider = document.getElementById('vol');
    const volVal = document.getElementById('volVal');

    // 音量默认 10%：同时管 <video>（MP4 兜底）与 <audio>（DASH 音轨）两个出声口
    player.volume = 0.1;
    const setVol = v => {
        player.volume = v;
        if (audioEl) audioEl.volume = v;
        volVal.textContent = Math.round(v * 100) + '%';
    };
    volSlider.oninput = e => setVol(Number(e.target.value));

    // ---------- 播放倍速 ----------
    // 可选档位：0.1~3.0。0.1x/0.25x 用来逐帧抠动作或看快速闪过的字幕。
    // <video> 的 playbackRate 是主时钟，DASH 的 <audio> 音轨由 bindSync 的
    // ratechange 监听跟随，纠偏逻辑在 0.05s 内把微调速率清掉。
    const RATES = [0.1, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];
    const rateSel = document.getElementById('rate');
    // 倍速偏好走 PageStore（Cookie ls_video_rate，与项目其它页一致，不用 localStorage）
    const videoStore = (window.PageStore ? PageStore.create('video') : null);
    let rateTimer = null;
    let desiredRate = 1;    // 用户选的倍速：换源后要重新盖回去（见 applyStream 末尾）

    RATES.forEach(r => {
        const o = document.createElement('option');
        o.value = String(r);
        o.textContent = r + 'x';
        rateSel.appendChild(o);
    });

    function applyRate(r) {
        desiredRate = r;
        player.playbackRate = r;
        if (audioEl) audioEl.playbackRate = r;
        rateSel.value = String(r);
        rateSel.title = r === 1 ? '播放倍速' : ('播放倍速 ' + r + 'x');
    }

    rateSel.onchange = () => {
        const r = Number(rateSel.value) || 1;
        applyRate(r);
        // 下拉是离散的，但键盘连按/滚动选档仍可能连发 change，去抖 400ms 少写几次 Cookie
        if (videoStore) {
            if (rateTimer) clearTimeout(rateTimer);
            rateTimer = setTimeout(() => { rateTimer = null; videoStore.set('rate', String(r)); }, 400);
        }
    };

    // 换源/换清晰度时浏览器可能在 media load 阶段把 playbackRate 重置为 defaultPlaybackRate，
    // 时机晚于 applyStream 的赋值，所以在元数据就绪后再盖一次，确保不掉回 1x。
    player.addEventListener('loadedmetadata', () => {
        if (player.playbackRate !== desiredRate) player.playbackRate = desiredRate;
    });

    let info = null;        // videoInfo.data
    let playData = null;    // playStreamInfo
    let currentCid = 0;
    // B 站音频是独立流（DASH），这里用 <video> 播视频流，另用 <audio> 同步播放音频。
    let audioEl = null;

    // ================= 播放进度持久化（IndexedDB） =================
    // 为什么用 IndexedDB 而不是 Cookie/PageStore：
    //   1. 进度是"每集一条"的多值数据（视频 × 分P），Cookie 只能放几十个键值且会被 4KB 上限挤掉，
    //      每集一个 Cookie 更会在浏览器里堆出上百条；
    //   2. 首页要做"继续观看"列表，需要按 updatedAt 排序取前 N 条 —— Spring 化的排序索引
    //      IndexedDB 天生就有，Cookie/sessionStorage 都得自己全表读再排序；
    //   3. 进度是"丢了也不致命"的附加数据，正好符合"只当加速层"的定位。
    // 键为 `bvid|cid`：同一视频不同分P 各自记进度，切分P 不会互相覆盖。
    const PROGRESS_STORE = 'progress';
    const PROGRESS_SAVE_INTERVAL = 5000;  // timeupdate 很密（~4Hz），节流到 5 秒写一次
    const PROGRESS_MIN_T = 5;             // 前 5 秒不记（刚点开还没看）
    const PROGRESS_END_GAP = 30;          // 距结尾不足 30 秒视为看完，不再提示续播

    let lastSavedT = -1;     // 上次落盘的时刻（节流用）
    let playedCid = 0;       // 播放器当前装的是哪个分P —— 用于区分"换流"与"换集"
    let resumeAt = 0;        // 待续播的时间点（applyStream 里消费）
    let resumeShownFor = ''; // 已经对哪个 key 弹过提示，避免换源重复弹

    function progressKey() {
        const bvid = (info && info.bvid) || '';
        return (bvid || 'x') + '|' + (currentCid || 0);
    }

    /** 读进度；拿不到（不可用/没存过）就返回 null */
    function readProgress() {
        if (!window.IdbStore) return Promise.resolve(null);
        // soon()：进度只是"顺便提示一下"，最多等 300ms，等不到就当没看过
        return IdbStore.soon(IdbStore.get(PROGRESS_STORE, progressKey()), 300)
            .then(v => v || null, () => null);
    }

    /** 写进度。t 秒、d 总时长；只写必要的字段，别把整个视频对象塞进去 */
    function writeProgress(t, d) {
        if (!window.IdbStore || !info) return;
        if (!isFinite(t) || t <= 0) return;
        const dur = isFinite(d) && d > 0 ? d : 0;
        IdbStore.set(PROGRESS_STORE, {
            k: progressKey(),
            t: Math.round(t),
            d: Math.round(dur),
            bvid: info.bvid || '',
            cid: currentCid || 0,
            title: info.title || '',
            pic: (info.pic || '') || '',
            owner: (info.owner && info.owner.name) || '',
            page: currentPageNo(),
            updatedAt: Date.now()
        });
    }

    /** 当前分P 序号（用于"继续观看"卡片显示 P2 之类） */
    function currentPageNo() {
        const pages = (info && info.pages) || [];
        for (let i = 0; i < pages.length; i++) {
            if (Number(pages[i].cid) === Number(currentCid)) return pages[i].page || (i + 1);
        }
        return 1;
    }

    /** timeupdate / pause / 页面隐藏时调用：节流写入，避免每帧一次 IDB 事务。
        force=true 时忽略节流窗口（暂停、切分P、页面隐藏时用）。 */
    function scheduleSave(force) {
        if (!info || !currentCid) return;
        const now = Date.now();
        if (!force && now - lastSavedT < PROGRESS_SAVE_INTERVAL) return;
        if (now - lastSavedT < 3000 && force) return; // force 也别太密
        lastSavedT = now;
        writeProgress(player.currentTime, player.duration);
    }

    player.addEventListener('timeupdate', () => scheduleSave(false));
    player.addEventListener('pause', () => scheduleSave(true));
    // 用户绕过提示条直接点了原生播放键：把提示收掉，别一直浮在那儿
    player.addEventListener('play', () => {
        if (resumeAt > 0 && !player.paused && player.currentTime < 1) hideResumeTip();
    });
    // 播完就把这条进度删掉，下次进来是干净的「从头看」
    player.addEventListener('ended', () => {
        if (window.IdbStore && currentCid) IdbStore.del(PROGRESS_STORE, progressKey());
        resumeShownFor = '';
    });
    // 关标签页/切后台时补一次：手机端上 pause 不一定来得及触发
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') scheduleSave(true);
    });
    window.addEventListener('pagehide', () => scheduleSave(true));

    /** 取时长字符串：进度提示用 */
    function fmtClock(sec) {
        const s = Math.max(0, Math.floor(Number(sec) || 0));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        const p = n => String(n).padStart(2, '0');
        return h > 0 ? (h + ':' + p(m) + ':' + p(ss)) : (m + ':' + p(ss));
    }

    let resumeTipTimer = null;

    /** 显示续播提示；用户点"从头开始"则清掉这条记录 */
    function showResumeTip(row) {
        const key = progressKey();
        if (resumeShownFor === key) return;
        resumeShownFor = key;
        const tip = document.getElementById('resumeTip');
        const text = document.getElementById('resumeText');
        if (!tip || !text) return;
        text.textContent = '上次看到 ' + fmtClock(row.t) + (row.d ? ' / ' + fmtClock(row.d) : '');
        resumeAt = Number(row.t) || 0;
        tip.classList.add('show');
        // 12 秒后自动收起：用户没理它就当继续从头看，不打扰
        clearTimeout(resumeTipTimer);
        resumeTipTimer = setTimeout(function () { tip.classList.remove('show'); }, 12000);
    }

    function hideResumeTip() {
        const tip = document.getElementById('resumeTip');
        if (tip) tip.classList.remove('show');
        clearTimeout(resumeTipTimer);
    }

    document.getElementById('resumeGo').onclick = () => {
        hideResumeTip();
        if (resumeAt > 0) {
            try { player.currentTime = resumeAt; } catch (e) { /* 元数据没到时忽略 */ }
            if (audioEl) { try { audioEl.currentTime = resumeAt; } catch (e) { /* ignore */ } }
        }
        player.play().catch(() => {});
    };

    document.getElementById('resumeNo').onclick = () => {
        hideResumeTip();
        resumeAt = 0;
        if (window.IdbStore) IdbStore.del(PROGRESS_STORE, progressKey());
        try { player.currentTime = 0; } catch (e) { /* ignore */ }
        player.play().catch(() => {});
    };


    const CODEC_NAME = { 7: 'AVC/H.264', 12: 'HEVC/H.265', 13: 'AV1' };
    const QN_NAME = {
        6: '240P', 16: '360P', 32: '480P', 64: '720P', 74: '720P60',
        80: '1080P', 100: '智能修复', 112: '1080P+', 116: '1080P60',
        120: '4K', 125: 'HDR', 126: '杜比视界', 127: '8K'
    };

    /** 解析地址栏，拿到 bvid 或 aid，然后加载 */
    async function boot() {
        const sp = new URLSearchParams(location.search);
        const bvid = sp.get('bvid');
        const aid = sp.get('aid');
        if (!bvid && !aid) {
            showHint(statusEl, '请从首页或搜索结果中选择一个视频');
            return;
        }
        // 列表卡片会把 cid 一并带过来：有 cid 就能和 /videoInfo 并发起取流，
        // 不必等视频信息返回后再串行请求，起播更快。
        const cidHint = sp.get('cid');
        await loadVideo(bvid ? { bvid } : { aid }, bvid, cidHint);
    }

    /**
     * 加载视频页。
     * @param target        /videoInfo 的查询参数
     * @param bvid          用于取流（取流接口需要 bvid）
     * @param cidHint       列表卡片带来的 cid，可让取流与信息并行
     */
    async function loadVideo(target, bvid, cidHint) {
        showSpinner(statusEl);
        content.style.display = 'none';

        // 关键：两个请求"同时发出"，总耗时约等于较慢的那个（实测 /videoInfo ~600ms、
        // 取流 ~200ms）。若在拿到 cid 后再串行请求取流，则要 800ms+ 才能起播。
        const infoPromise = api('/videoInfo', target);
        const streamPromise = (bvid && cidHint)
            ? api('/videoStreamInfo', { bvid, cid: cidHint }).catch(() => null)
            : null;

        try {
            info = await infoPromise;
        } catch (e) {
            statusEl.innerHTML = '';
            showError(statusEl, '获取视频信息失败：' + e.message);
            return;
        }
        const prefetched = streamPromise ? await streamPromise : null;

        statusEl.innerHTML = '';
        content.style.display = 'block';
        renderInfo();
        // 评论不再与起播抢连接：让播放器先拿到数据
        setTimeout(initComments, 0);
        // 默认播放第一个分P
        const first = (info.pages && info.pages.length) ? info.pages[0] : { cid: info.cid, page: 1, part: '' };

        // 命中并发请求的结果、且正是第一个分P 时直接复用，避免重复请求
        if (prefetched && Number(first.cid) === Number(cidHint)) {
            playData = prefetched;
            // 必须记住当前分P：否则此后切"格式"（MP4/DASH）时 currentCid 为 0，
            // formatSel.onchange 的 `if (currentCid)` 直接吞掉，表现为切了没反应。
            currentCid = first.cid;
            highlightPage(first.cid);
            buildQualityOptions();
            applyStream();
        } else {
            await selectPage(first.cid, first.page || 1);
        }
    }

    /** 仅更新分P 高亮，不发请求（用于复用已取到的流） */
    function highlightPage(cid) {
        document.querySelectorAll('.page-chip').forEach(c => {
            c.classList.toggle('active', Number(c.dataset.cid) === Number(cid));
        });
    }

    // ---------- 评论（内嵌，与视频页合二为一） ----------
    let comments = null;

    function initComments() {
        const box = document.getElementById('comments');
        const pager = document.getElementById('cmtPager');
        const pageInfo = document.getElementById('cmtPageInfo');
        const countEl = document.getElementById('cmtCount');
        const upMid = info.owner ? info.owner.mid : 0;

        comments = createCommentSection(box, info.aid);
        comments.onCount(total => {
            countEl.textContent = total ? `共 ${fmtNum(total)} 条评论` : '';
        });
        comments.onPage((page, hasNext, hasPrev) => {
            pager.style.display = (hasNext || hasPrev) ? 'flex' : 'none';
            pageInfo.textContent = `第 ${page} 页`;
            document.getElementById('cmtPrev').disabled = !hasPrev;
            document.getElementById('cmtNext').disabled = !hasNext;
        });
        document.getElementById('cmtSort').onchange = e => {
            comments.setSort(e.target.value);
            comments.reset(upMid);
        };
        document.getElementById('cmtPrev').onclick = () => comments.goPage(comments.getPage() - 1, upMid);
        document.getElementById('cmtNext').onclick = () => comments.goPage(comments.getPage() + 1, upMid);
        comments.reset(upMid);
    }

    function renderInfo() {
        document.getElementById('title').textContent = info.title || '';
        document.getElementById('upName').textContent = (info.owner && info.owner.name) || '未知UP主';
        document.getElementById('upFace').src = imgUrl(info.owner && info.owner.face);
        const mid = info.owner ? info.owner.mid : 0;
        document.getElementById('upMeta').textContent = 'UID: ' + mid + ' · ' + (info.tname || '');
        document.getElementById('upSpace').href = '/resources/video/space.html?mid=' + mid;
        document.getElementById('desc').textContent = info.desc || '（无简介）';

        const s = info.stat || {};
        document.getElementById('stats').innerHTML = `
            <span>▶ 播放 ${fmtNum(s.view)}</span>
            <span>💬 评论 ${fmtNum(s.reply)}</span>
            <span>⭐ 收藏 ${fmtNum(s.favorite)}</span>
            <span>🪙 投币 ${fmtNum(s.coin)}</span>
            <span>👍 点赞 ${fmtNum(s.like)}</span>
            <span>📅 ${fmtTime(info.pubdate)}</span>`;

        // 分P 列表
        const pages = info.pages || [];
        const card = document.getElementById('pagesCard');
        const box = document.getElementById('pages');
        box.innerHTML = '';
        if (pages.length > 1) {
            card.style.display = 'block';
            pages.forEach((p, idx) => {
                // 接口对第一个分P 可能不返回 page 字段，用下标兜底
                const no = p.page || (idx + 1);
                const chip = document.createElement('div');
                chip.className = 'page-chip';
                chip.dataset.cid = p.cid;
                chip.textContent = `P${no} ${p.part || ''}`;
                chip.title = p.part || '';
                chip.onclick = () => selectPage(p.cid, no);
                box.appendChild(chip);
            });
        } else {
            card.style.display = 'none';
        }
    }

    async function selectPage(cid, pageNo) {
        // 切分P 前先把当前分P 的进度落盘（下面一改 currentCid，progressKey() 就变了）
        if (currentCid && player.currentTime > 0) scheduleSave(true);
        currentCid = cid;
        // 换分P 是"另一个播放位置"，续播提示要对新分P 重新判定
        resumeShownFor = '';
        resumeAt = 0;
        hideResumeTip();
        // 高亮当前分P
        document.querySelectorAll('.page-chip').forEach(c => {
            c.classList.toggle('active', Number(c.dataset.cid) === Number(cid));
        });
        await fetchStream(cid);
    }

    /**
     * 取当前播放地址。
     * @param cid  分P 的 cid
     * @param qn   目标清晰度；只在 MP4 模式下有意义 —— MP4 返回的是**一次协商好的单条 durl**，
     *             改清晰度必须回服务端重新协商（DASH 一次就返回全部档位，切档在本地完成）。
     */
    async function fetchStream(cid, qn) {
        try {
            // format 由"格式"下拉决定（默认 mp4）：mp4 音画合一单流，dash 音画分离
            const params = { bvid: info.bvid, cid, format: formatSel.value };
            if (qn) params.qn = qn;
            playData = await api('/videoStreamInfo', params);
        } catch (e) {
            showError(statusEl, '获取播放地址失败：' + e.message);
            return;
        }
        buildQualityOptions(qn);
        applyStream();
    }

    /** 当前取流结果是不是 MP4 单流（没有 dash 段）。MP4 的清晰度是"请求时定档"的 */
    function isMp4Mode() {
        return !(playData && playData.dash && playData.dash.video && playData.dash.video.length);
    }

    /**
     * 依据取流结果重建清晰度下拉。
     * @param keepQn 切格式前用户选中的档位，能保留就保留，避免 MP4↔DASH 来回切时档位乱跳
     */
    function buildQualityOptions(keepQn) {
        qualitySel.innerHTML = '';
        // 后端已算好"实际可用清晰度"（降序），直接采用，避免前端猜错档位
        const dash = playData && playData.dash;
        const avail = (playData.availableQualities && playData.availableQualities.length)
            ? playData.availableQualities
            : (dash && dash.video ? [...new Set(dash.video.map(v => v.id))].sort((a, b) => b - a) : []);

        if (avail.length) {
            avail.forEach(id => {
                const o = document.createElement('option');
                o.value = id;
                o.textContent = QN_NAME[id] || ('qn' + id);
                qualitySel.appendChild(o);
            });
            // DASH 一次拿到全部档位，切档只需在本地换流地址，永远不必禁用
            qualitySel.disabled = false;
            // 优先沿用用户之前选的档位；否则用服务端选的默认档（免登录可用的最高清晰度）
            const best = Number(playData.bestQuality || 0);
            const prefer = Number(keepQn || 0);
            if (avail.includes(prefer)) qualitySel.value = String(prefer);
            else qualitySel.value = avail.includes(best) ? String(best) : String(avail[0]);
        } else {
            // MP4(html5) 单流：档位来自 accept_quality/accept_description，无独立编码档。
            // 注意 accept_quality 是"该模式下 B 站愿意提供的档位"（本片只有 720P/360P，
            // 虽然 DASH 下有 480P，MP4 模式却不给 —— 所以这里必须以它为准，不能自己拼 QN_NAME）。
            const qs = playData.accept_quality || [];
            qs.forEach((q, i) => {
                const o = document.createElement('option');
                o.value = q;
                o.textContent = (playData.accept_description && playData.accept_description[i]) || ('qn' + q);
                qualitySel.appendChild(o);
            });
            // 之前以为"单流只有 durl[0] 所以切档无意义"而禁用下拉 —— 那是错的：
            // durl 只有一条，但服务端按 qn 参数重新协商会返回对应档位的流（实测 qn=16/64 各回各的）。
            // 所以只有"可用档位确实只有一档"时才禁用。
            qualitySel.disabled = qs.length <= 1;
            // 用服务端**实际协商到**的 quality，而不是用户请求的 qn：
            // 比如本片 MP4 选 480P(32) 时服务端只能给 360P(16)，下拉要如实回显 360P。
            const actual = Number(playData.quality || 0);
            const prefer = Number(keepQn || 0);
            if (qs.includes(prefer)) qualitySel.value = String(prefer);
            else if (qs.includes(actual)) qualitySel.value = String(actual);
            else if (qs.length) qualitySel.value = String(qs[0]);
        }
        refreshCodecOptions();
    }

    function refreshCodecOptions() {
        const qn = Number(qualitySel.value);
        codecSel.innerHTML = '';
        const vids = (playData && playData.dash && playData.dash.video || []).filter(v => v.id === qn);
        if (vids.length) {
            vids.forEach(v => {
                const o = document.createElement('option');
                o.value = v.codecid;
                o.textContent = CODEC_NAME[v.codecid] || ('codec' + v.codecid);
                codecSel.appendChild(o);
            });
            // 默认选 AVC/H.264(7)：兼容性最好。
            // HEVC(12)/AV1(13) 虽然更省带宽，但部分浏览器/设备不支持，
            // 选中后会直接黑屏报 DEMUXER_ERROR，故只在用户手动切换时才用。
            const avc = vids.find(v => v.codecid === 7);
            codecSel.value = String((avc || vids[0]).codecid);
            codecSel.disabled = false;
        } else {
            const o = document.createElement('option');
            o.textContent = '默认';
            codecSel.appendChild(o);
            codecSel.disabled = true;
        }
        codecSel.onchange = applyStream;
    }

    /** 把选中的视频流与音频流交给播放器 */
    function applyStream() {
        const qn = Number(qualitySel.value);
        const codecid = Number(codecSel.value);
        const fmt = formatSel.value === 'mp4' ? 'mp4' : 'dash';
        const bvid = (info && info.bvid) || '';
        const cid = currentCid;
        let vSrc = '', aSrc = '';

        const dash = playData && playData.dash;
        if (dash && dash.video && dash.video.length) {
            // 优先精确匹配清晰度；匹配不到就退回最高可用清晰度，避免直接失败
            let cands = dash.video.filter(v => v.id === qn);
            if (!cands.length) {
                const best = Math.max(...dash.video.map(v => v.id));
                cands = dash.video.filter(v => v.id === best);
            }
            const pick = cands.find(v => v.codecid === codecid) || cands[0];
            // 用语义参数拼地址（不用上游签名地址），同一路流的 URL 跨会话恒定，
            // 浏览器缓存才复用得了；服务端负责换成真实地址并跟随签名续期。
            if (pick) vSrc = streamUrlOf(bvid, cid, pick.id, pick.codecid, 'v', fmt);
            if (dash.audio && dash.audio.length) {
                // 选码率最高的音频
                const a = dash.audio.slice().sort((x, y) => (y.bandwidth || 0) - (x.bandwidth || 0))[0];
                aSrc = streamUrlOf(bvid, cid, 0, 0, 'a', fmt);
            }
        } else if (playData && playData.durl && playData.durl.length) {
            vSrc = streamUrlOf(bvid, cid, qn, 0, 'm', 'mp4');
        }

        if (!vSrc) {
            playMsg.textContent = '没有拿到可用的视频流地址。';
            return;
        }

        const wasPlaying = !player.paused && player.currentTime > 0;
        // 必须先取进度再换源：player.src = ... 会立刻把 currentTime 清成 0
        const keepTime = player.currentTime;
        // 同一分P 内换流（切清晰度/编码/格式）才算"接着看"；换分P 是另一集，位置必须归零
        const sameEpisode = playedCid > 0 && Number(playedCid) === Number(cid);
        player.src = vSrc;
        playedCid = cid;
        if (wasPlaying) player.play().catch(() => {});

        if (sameEpisode && keepTime > 0) {
            // 切清晰度/编码/格式：把当前进度原样带过去，别让用户从头看，也不弹续播提示
            // （他正看着呢，弹提示等于打断）。pause 状态下切档同样保留位置。
            const restore = () => {
                try { player.currentTime = keepTime; } catch (e) { /* ignore */ }
                player.removeEventListener('loadedmetadata', restore);
            };
            player.addEventListener('loadedmetadata', restore);
        } else {
            // 首次进入页面 / 换分P：读本地进度，够长就浮出"上次看到 xx:xx"
            // 判断挂在异步里，此时 duration 未必可信，所以用记录里存的总时长 d。
            const key = progressKey();
            if (resumeShownFor !== key) {
                readProgress().then(row => {
                    if (!row || !row.t) return;
                    if (row.d && row.t >= row.d - PROGRESS_END_GAP) {
                        // 已看完：静默丢掉这条，下次从头看
                        if (window.IdbStore) IdbStore.del(PROGRESS_STORE, key);
                        return;
                    }
                    if (row.t < PROGRESS_MIN_T) return;
                    showResumeTip(row);
                }).catch(() => {});
            }
        }

        // DASH 视频流不含音轨，单独挂一个 <audio> 跟随 <video>（主时钟）播放。
        // 同步策略见 bindSync：playbackRate 微调收敛漂移，避免跳表。
        if (aSrc) {
            if (!audioEl) {
                audioEl = document.createElement('audio');
                audioEl.preload = 'auto';
                audioEl.volume = player.volume;
                document.body.appendChild(audioEl);
                bindSync();
            }
            audioEl.src = aSrc;
        } else {
            // MP4：清掉 DASH 音轨（pause + 清空 src，必须 load() 真正停掉取流）
            if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }
        }

        streamInfo.textContent = `当前: ${QN_NAME[qn] || qn} · ${CODEC_NAME[codecid] || '默认'}`;
        // 换源会把 playbackRate 打回 1（置 src 等同于换媒体，速率重置为 defaultPlaybackRate），
        // 这里重新盖上用户选的倍速，切清晰度/切分P/切格式都不会掉回 1x。
        player.playbackRate = desiredRate;
        if (audioEl) audioEl.playbackRate = desiredRate;
    }

    /**
     * 双流同步：以 <video> 为主时钟，音频用 playbackRate 微调（0.9~1.1 倍速内
     * 人耳难以察觉）连续收敛漂移；只有漂移 > 0.5s（seek / 音频卡缓冲）才直接对表。
     * requestVideoFrameCallback 按视频帧节拍跑、节流到 ~15Hz；不支持时退回 rAF。
     */
    function bindSync() {
        let scheduled = false;
        let lastTick = 0;

        const scheduleSync = () => {
            if (scheduled || !audioEl || player.paused) return;
            scheduled = true;
            const tick = () => {
                scheduled = false;
                const now = performance.now();
                if (now - lastTick < 66) { scheduleSync(); return; }
                lastTick = now;
                correct();
            };
            if (player.requestVideoFrameCallback) player.requestVideoFrameCallback(tick);
            else requestAnimationFrame(tick);
        };

        const correct = () => {
            if (!audioEl || audioEl.readyState === 0 || player.paused) return;
            const delta = audioEl.currentTime - player.currentTime;
            if (Math.abs(delta) > 0.5) {
                // 漂移过大：直接对表（音频 seek 无感知，因为它没在追播）
                audioEl.currentTime = player.currentTime;
                audioEl.playbackRate = player.playbackRate || 1;
            } else if (Math.abs(delta) > 0.05) {
                // 音频偏慢(delta>0)就放慢、偏快就加速，让漂移自然归零
                audioEl.playbackRate = (player.playbackRate || 1) *
                    Math.max(0.9, Math.min(1.1, 1 - delta * 0.8));
            } else {
                audioEl.playbackRate = player.playbackRate || 1;
            }
            scheduleSync();
        };

        player.addEventListener('play', () => {
            if (!audioEl) return;
            if (audioEl.readyState >= 2 && Math.abs(audioEl.currentTime - player.currentTime) > 0.2) {
                audioEl.currentTime = player.currentTime;
            }
            audioEl.playbackRate = player.playbackRate || 1;
            lastTick = 0;
            audioEl.play().catch(() => {});
            scheduleSync();
        });
        player.addEventListener('pause', () => {
            if (!audioEl) return;
            audioEl.pause();
            audioEl.playbackRate = 1;
        });
        player.addEventListener('seeked', () => {
            if (!audioEl || audioEl.readyState === 0) return;
            if (Math.abs(audioEl.currentTime - player.currentTime) > 0.2) {
                audioEl.currentTime = player.currentTime;
            }
            audioEl.playbackRate = player.playbackRate || 1;
        });
        player.addEventListener('ratechange', () => {
            if (!audioEl) return;
            // 播放器变速时音频同步跟倍速（纠偏逻辑会在 0.05s 内把微调速率清掉）
            audioEl.playbackRate = player.playbackRate || 1;
        });
    }

    // ---------- 截取当前画面 ----------
    // 把 <video> 当前帧画到 canvas，转成 dataURL 交给共用的 lightbox 打开；
    // 之后点 💾 保存到自己的 cache/picture/<用户名>/、点 ✎ 裁剪，两个能力都复用 lib/lightbox.js。
    const shotBtn = document.getElementById('shot');
    shotBtn.addEventListener('click', () => {
        // 没有可画的画面时 canvas 会得到全黑图，先挡掉
        if (!player.videoWidth || !player.videoHeight) {
            showError(playMsg, '还没有画面可截取，等视频加载出第一帧再试');
            return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = player.videoWidth;
        canvas.height = player.videoHeight;
        const ctx = canvas.getContext('2d');
        try {
            ctx.drawImage(player, 0, 0, canvas.width, canvas.height);
        } catch (e) {
            // 跨域画面（理论上都走 /videoStream 同源代理，这里只是兜底）
            showError(playMsg, '截取失败：' + e.message);
            return;
        }
        // 统一用 PNG：无损、且与 lightbox 裁剪后落盘的格式一致（都是 image/png）
        let url;
        try {
            url = canvas.toDataURL('image/png');
        } catch (e) {
            showError(playMsg, '截取失败：' + e.message);
            return;
        }
        if (!url || url === 'data:,') {
            showError(playMsg, '截取失败：画面不可用');
            return;
        }
        if (window.Lightbox) Lightbox.open(url);
    });

    // 切清晰度：DASH 一次就拿到所有档位，本地换流地址即可；
    // MP4 是单条 durl，必须带新 qn 回服务端重新协商，否则改了没反应。
    qualitySel.onchange = () => {
        if (isMp4Mode()) {
            if (currentCid) fetchStream(currentCid, Number(qualitySel.value));
            return;
        }
        refreshCodecOptions();
        applyStream();
    };
    // 切换格式（MP4/DASH）时重新取流：后端按 format 参数返回对应结构。
    // 带上当前清晰度，让两种格式尽量停在同一个档位。
    formatSel.onchange = () => {
        if (currentCid) fetchStream(currentCid, Number(qualitySel.value));
    };

    // 恢复上次用的倍速（没有记录/值非法就回到 1x）
    (function restoreRate() {
        let saved = null;
        try { saved = videoStore ? videoStore.get('rate') : null; } catch (e) { saved = null; }
        const r = RATES.indexOf(Number(saved)) >= 0 ? Number(saved) : 1;
        applyRate(r);
    })();

    // 顶栏搜索：统一按关键词搜索
    bindSearchBox('kw', 'go');

    boot();
</script>
</body>
</html>
