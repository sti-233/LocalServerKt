            let toast = document.getElementById('errToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'errToast';
                toast.className = 'error-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function () { toast.classList.remove('show'); }, 4000);
        }

        // ===== 聊天历史本地缓存（IndexedDB）=====
        // 为什么值得缓存：每次切会话/切日期都要 fetch('/history') 再把整块 DOM 重建一遍，
        // 局域网也要几十毫秒，切过去先是白屏。存一份本地副本后可以"先画缓存、后对齐服务端"，
        // 视觉上几乎瞬时；服务端数据没变时连 DOM 都不重建（图片不会重新解码、滚动不会抖）。
        //
        // 只当加速层：读不到/写失败一律忽略，回源行为与没有缓存时完全一致。
        const HIST_STORE = 'chatHistory';
        const HIST_MAX_ROWS = 60;   // 最多留 60 个会话/日期的副本
        // 会话名可能随天变化（群聊按日期、私聊按对方），但缓存键必须稳定：
        // 用「私聊对象 | 日期」拼，日期为空表示"今天"（服务端默认），
        // 这样今天这份缓存会被后续每次刷新覆盖，不会攒出一堆历史文件。
        function histKey(userParam, day) {
            return (userParam || '') + '|' + (day || '');
        }

        // 只保留最近 HIST_MAX_ROWS 条：按 savedAt 倒序取，多出来的删掉。
        // 聊天记录体量不大，但一天一个会话、再乘上私聊对象，几个月就会积起来。
        async function pruneHistoryCache() {
            if (!window.IdbStore) return;
            const rows = await IdbStore.getAll(HIST_STORE, { index: 'savedAt', direction: 'prev', limit: HIST_MAX_ROWS + 40 });
            if (!rows || rows.length <= HIST_MAX_ROWS) return;
            for (let i = HIST_MAX_ROWS; i < rows.length; i++) {
                IdbStore.del(HIST_STORE, rows[i].k);
            }
        }

        // 消息数组的指纹：用于判断服务端数据与本地副本是否一致。
        // 逐字段拼串而不是 JSON.stringify —— 后者对 ImageB64:（data URL）会复制一遍大字符串。
        function histFingerprint(items) {
            if (!items || !items.length) return '0';
            let h = items.length + ':';
            for (let i = 0; i < items.length; i++) {
                const m = items[i] || {};
                h += (m.name || '') + '\u0001' + (m.time || '') + '\u0001' + ((m.text || '').length) +
                     '\u0001' + (m.reply ? ((m.reply.name || '') + '@' + (m.reply.time || '')) : '') + ';';
            }
            return h;
        }

        // ===== 图片字节本地缓存（IndexedDB 的 imgBlobs 表）=====
        // 图片文件名是内容哈希（<sha256>.<ext>），同名必然同字节，所以按名字存、永不过期，
        // 只按张数淘汰。聊天记录里的图和「缓存图片」面板的缩略图共用这一份。
        //
        // 为什么还值得存：/img/ 本来就给了 immutable 长缓存，但那是浏览器说清就清的
        // （清站点数据、配额回收、隐私模式），换个浏览器更是完全没有。本地存一份之后，
        // 命中时直接给 blob URL，连 HTTP 请求都不用发；没命中才回源，并顺手补存进去。
        const IMG_BLOB_MAX = 240;               // 最多留 240 张，超出按 savedAt 淘汰
        const IMG_BLOB_LIMIT = 6 * 1024 * 1024; // 单张上限 6MB：再大的图存它不划算
        const imgUrlMemo = new Map();           // name -> objectURL（避免同一张图反复 createObjectURL）
        const imgPending = Object.create(null); // name -> true，正在补存的图，防重复 fetch
        // 「缓存图片」面板的列表副本：键与当前已画出的那份指纹（判断服务端那份有没有变）
        const PICK_LIST_KEY = 'pictures';
        let pickShownFp = '';

        /** 这张 blob URL 还有没有 <img> 在用（用来判断回收它会不会把图弄裂） */
        function imgUrlInUse(url) {
            const imgs = document.images;
            for (let i = 0; i < imgs.length; i++) {
                if (imgs[i].src === url) return true;
            }
            return false;
        }

        /**
         * 取（或新建）某张图的 blob URL。
         *
         * 映射超过 200 条就回收最老的，但**跳过还挂在页面上**的那些：
         * revoke 掉一个正在显示的 blob URL，图会立刻变成裂图。所以淘汰时从最老的开始试，
         * 撞上在用的就把它挪到队尾再试下一个；实在全都在用就先留着（数量受屏幕能容纳的张数约束）。
         */
        function imgUrlOf(name, blob) {
            const hit = imgUrlMemo.get(name);
            if (hit) return hit;
            const url = URL.createObjectURL(blob);
            imgUrlMemo.set(name, url);
            if (imgUrlMemo.size > 200) evictImgUrls();
            return url;
        }

        function evictImgUrls() {
            let guard = imgUrlMemo.size;
            while (imgUrlMemo.size > 200 && guard-- > 0) {
                const first = imgUrlMemo.keys().next();
                if (first.done) return;
                const key = first.value;
                const url = imgUrlMemo.get(key);
                if (imgUrlInUse(url)) {
                    // 挪到队尾：它只是"现在还在用"，不是"最近用过"
                    imgUrlMemo.delete(key);
                    imgUrlMemo.set(key, url);
                    continue;
                }
                imgUrlMemo.delete(key);
                try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
            }
        }

        /** 忘掉一张图：IDB 里的字节、内存里的 blob URL、以及"已画出"的那份列表 */
        function forgetImg(name) {
            if (!name) return;
            const url = imgUrlMemo.get(name);
            if (url) {
                // 消息区里可能还挂着同一张图（删除只是从「我的缓存」里摘掉，
                // 已经发出的那条消息不受影响）。这时候 revoke 会把它变成裂图，
                // 所以只摘映射、把 URL 留给页面继续用，等它自然消失。
                if (!imgUrlInUse(url)) {
                    try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
                }
                imgUrlMemo.delete(name);
            }
            if (window.IdbStore) IdbStore.blobDel(name);
        }

        /** 从 kv:pictures 那份列表里摘掉一张（删图后调用，避免下次打开先闪出它） */
        function dropFromPickList(name) {
            if (!window.IdbStore || !name) return;
            IdbStore.kvGet(PICK_LIST_KEY).then(function (data) {
                if (!data || !data.items) return;
                const rest = data.items.filter(function (it) { return it.name !== name; });
                if (rest.length === data.items.length) return;
                data.items = rest;
                data.total = Math.max(0, (data.total || 1) - 1);
                IdbStore.kvSet(PICK_LIST_KEY, data, 0);
            }, function () {});
        }

        /** 把一张已经上屏的图补存进 IDB（字节从 HTTP 缓存取，通常不花流量） */
        function rememberImg(name) {
            if (!window.IdbStore || !name || imgPending[name]) return;
            imgPending[name] = true;
            fetch('/img/' + name, { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.blob() : null; })
                .then(function (blob) {
                    if (!blob) return null;
                    return IdbStore.blobSet(name, blob, IMG_BLOB_LIMIT).then(function (ok) {
                        if (ok) IdbStore.blobPrune(IMG_BLOB_MAX);
                    });
                })
                .catch(function () { /* 补存失败无所谓，下次看图还是走 HTTP 缓存 */ })
                .then(function () { delete imgPending[name]; });
        }

        /**
         * 给 <img> 上图：优先本地缓存，没有才走网络；走网络的那张加载成功后补存。
         * 故意不返回 Promise —— 调用方只管把节点摆上去，别为一张图阻塞整块渲染。
         *
         * `onFail` 只在**连网络都失败**时才回调：本地那份坏字节会先退回网络重试，
         * 那一步不该被调用方当成"这张图已经不存在了"（头像靠它决定要不要回落首字）。
         */
        function paintImg(img, name, ref, onFail) {
            const net = ref || ('/img/' + name);
            const memo = imgUrlMemo.get(name);
            if (memo) {
                if (onFail) img.addEventListener('error', function () { onFail(); }, { once: true });
                img.src = memo;
                return;
            }

            function fromNet() {
                img.addEventListener('load', function () { rememberImg(name); }, { once: true });
                if (onFail) img.addEventListener('error', function () { onFail(); }, { once: true });
                img.src = net;
            }

            if (window.IdbStore) {
                // 不会等 open：soon() 150ms 内没结果就当没命中，直接走网络。
                // （隐私模式下 indexedDB.open 会卡满 1.5 秒，这里绝不能跟着等）
                IdbStore.soon(IdbStore.blobGet(name), 150).then(function (row) {
                    if (!row || !row.blob) { fromNet(); return; }
                    // 本地这份万一是坏的（写的时候断电之类），退回网络，别留一张裂图
                    img.addEventListener('error', function () {
                        forgetImg(name);
                        fromNet();
                    }, { once: true });
                    img.src = imgUrlOf(name, row.blob);
                }, fromNet);
                return;
            }
            fromNet();
        }

        // 老存档（没跑过 /migrateImages）里的图片是 ImageB64: 内联 data URL，一条就能有几 MB。
        // 那种会话不写缓存：IndexedDB 配额是整库共用的，Chrome 清理时所有表一起丢，
        // 为一份静态旧存档冒这个险不划算（新消息一律是 ImageRef: 短引用，只有几十字节）。
        function hasLegacyImage(items) {
            for (let i = 0; i < items.length; i++) {
                const t = (items[i] && items[i].text) || '';
                if (typeof t === 'string' && t.startsWith('ImageB64:')) return true;
            }
            return false;
        }

        function paintHistory(items) {
            const container = document.getElementById('MsgBox');
            container.innerHTML = '';
            // 先在一个游离的片段里把整段历史拼完，最后一次性挂到 DOM 上。
            // 逐条 appendChild 到已上屏的容器，每条都会触发一次布局/绘制，
            // 几百条的长会话切过来能明显卡一下；片段内构建只付一次代价。
            const frag = document.createDocumentFragment();
            for (const msg of items) {
                frag.appendChild(crtMsg(msg.name, msg.time, msg.text, msg.reply));
            }
            container.appendChild(frag);
            // 切会话/切日期/刷新后一律回到最新一条：先瞬时到底（不走动画），
            // 再给懒加载的图片挂回调，等它们把高度撑开后继续贴底
            stickBottom = true;
            scrollToBottom(false);
            stickToImages();
        }

        // 撤回/新消息会改动当前会话内容，缓存里那份要跟着改，否则下次刷新会闪回旧内容
        async function patchHistoryCache(fn) {
            if (!window.IdbStore || !histCurrentKey) return;
            const row = await IdbStore.get(HIST_STORE, histCurrentKey);
            if (!row || !row.items) return;
            const next = fn(row.items.slice());
            if (!next) return;
            row.items = next;
            row.savedAt = Date.now();
            IdbStore.set(HIST_STORE, row);
        }

        let histCurrentKey = '';  // 当前 MsgBox 里画的是哪个会话
        let histGen = 0;          // 代际令牌：切会话期间回来的旧请求一律丢弃

        async function renderHistory() {
            const gen = ++histGen;
            const target = document.getElementById('user').value;
            // 日期不是用户名：浏览某日群聊记录时 targetuser 留空，只带 date 参数，避免服务端 400
            const userParam = isDateStr(target) ? '' : target;
            // 群聊模式下 currentDay 非空时查看该日期的历史文件，否则由服务端默认今天
            const dateParam = currentDay ? '&date=' + encodeURIComponent(currentDay) : '';
            const key = histKey(userParam, currentDay);
            histCurrentKey = key;

            // 1) 先上本地副本：有就立刻画出来（首屏不用等服务端）
            let shownItems = null;
            if (window.IdbStore) {
                // soon()：本地副本只是加速，最多等 250ms；等不到就直接回源，
                // 别让隐私模式下的 1.5 秒 open 超时把首屏拖慢
                const row = await IdbStore.soon(IdbStore.get(HIST_STORE, key), 250);
                if (gen !== histGen) return;   // 这期间用户又切了会话，别再画了
                if (row && row.items) {
                    paintHistory(row.items);
                    shownItems = row.items;
                }
            }

            // 2) 再对齐服务端
            let resp;
            try {
                resp = await fetch('/history?targetuser=' + encodeURIComponent(userParam) + dateParam);
            } catch (e) {
                // 服务器重启/网络断掉时 fetch 直接 reject。旧写法没人接，变成一次未处理的
                // Promise 拒绝：控制台一片红，界面上什么提示都没有。
                // refresh() 是按钮和侧边栏都会调的，这里必须就地兜住。
                console.warn('拉取聊天记录失败:', e);
                showError('拉取聊天记录失败：' + (e && e.message ? e.message : '网络异常'));
                return; // 保留已经画出来的本地副本
            }
            if (gen !== histGen) return;
            let history = [];
            if (resp.ok) {
                try {
                    history = await resp.json();
                } catch (e) {
                    // /history 现在走 authenticate("auth")：鉴权失败时 form("auth") 的 challenge
                    // 会 302 到外部 SSO 页，fetch 跟着跳过去拿到的是 HTML，状态码还是 200。
                    // 这里不兜住就会变成一次未处理的 Promise 拒绝，页面停在旧内容上毫无提示。
                    console.warn('解析历史记录失败（多半是登录状态失效）:', e);
                    showError('无法读取聊天记录：登录状态可能已失效，请刷新页面重新登录');
                    return; // 保留上面画出来的本地副本
                }
            } else {
                // 服务端返回 400（如私聊对象不存在于用户列表）时给出提示，不渲染旧消息
                showError(await resp.text());
                return; // 失败时保留上面的本地副本，别清空成白屏
            }
            if (gen !== histGen) return;

            // 数据没变就不重画：省掉一次整块 DOM 重建，图片也不会重新解码
            if (!shownItems || histFingerprint(shownItems) !== histFingerprint(history)) {
                paintHistory(history);
            }

            // 3) 回写缓存（内联 base64 的老存档跳过，见 hasLegacyImage）
            if (window.IdbStore && !hasLegacyImage(history)) {
                IdbStore.set(HIST_STORE, {
                    k: key,
                    user: userParam,
                    day: currentDay || '',
                    items: history,
                    savedAt: Date.now()
                }).then(pruneHistoryCache, function () {});
            }
        }

        async function sendMsg() {
            // 私聊对象填的是日期时处于"浏览群聊记录"模式，不能发消息
            if (isDateStr(document.getElementById('user').value)) {
                showError('正在浏览某日群聊记录，请先清空对象框再发送消息');
                return;
            }
            // 浏览非今天的群聊记录（侧边栏日期项或对象框填日期）时禁止发送：
            // 新消息只会写入今天的存档，发到群里也不属于正在查看的旧日
            if (inOldGroupDay()) {
                showError('正在浏览旧日群聊记录，该日不可发送消息；点"今天"或改选私聊对象后可发送');
                return;
            }
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const text = document.getElementById('content').value;
            if (text.trim() === '') return; // 纯换行/空白不发送
            // 没发出去就不清输入框：清空后消息既没进存档也没广播，用户会以为发出去了
            if (!(await sendRaw(text))) return;
            document.getElementById('content').value = '';
            autoGrow(); // 发送后把输入框高度还原
        }

        // 统一的 WS 发送出口：切过私聊对象先刷新再发，保证历史渲染正确。
        // 返回是否真的交给了 WS —— 断线期间调用方要把输入框留着
        async function sendRaw(text) {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) {
                showError('连接已断开，正在重连，消息未发送');
                return false;
            }
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const user = document.getElementById('user').value;
            const payload = { type: 'send', name: 'unused', time: 'unused', text, sendTo: user };
            // 回复快照跟着这一条走；发出去之后就清掉，下一条不再带（否则会连着回好几条）
            if (replyTo) {
                payload.reply = { name: replyTo.name, time: replyTo.time, text: replyTo.text };
            }
            try {
                websocket.send(JSON.stringify(payload));
                if (replyTo) clearReply();
                return true;
            } catch (e) {
                showError('发送失败：' + e.message);
                return false;
            }
        }

        async function delMsg(name, time) {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) {
                showError('连接已断开，正在重连，撤回未生效');
                return;
            }
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const user = document.getElementById('user').value;
            const json = JSON.stringify({ type: 'del', name, time, text: 'unused', sendTo: user });
            try {
                websocket.send(json);
            } catch (e) {
                showError('撤回失败：' + e.message);
            }
        }

        async function refresh() {
            nowTarget = document.getElementById('user').value;
            // 正在看的这个会话顺手记为已读：点「刷新」、敲完人名按回车都走这里。
            // 早先只有点侧边栏项才 markRead，于是"手打对象名/点刷新"看完了消息，
            // 红点还赖在侧边栏上，必须再点一次同名项才能消掉。
            // 后台标签页（切回来时 onopen 触发的 refresh）不算看过，别把红点悄悄清掉。
            if (document.visibilityState !== 'hidden') {
                markCurrentAsRead();
                updateUnreadState();
            }
            await renderHistory();
        }

        // 是否"贴着底部"：切进会话后图片懒加载会不断撑高消息区，
        // 只有用户没自己往上翻（仍贴底）时才继续跟着滚，否则会把他正在看的位置拽走
        let stickBottom = true;

        // 自己触发的滚动期间，不能用 scroll 事件反推用户意图：smooth 动画的每一帧
        // 都还"没到底"，若据此把 stickBottom 置 false，后面新消息就再也不跟随了。
        let autoScrollUntil = 0;

        function nearBottom() {
            const box = document.getElementById('MsgBox');
            return box.scrollHeight - box.scrollTop - box.clientHeight < 8;
        }

        // 滚到最新一条。必须直接改消息区自己的 scrollTop —— 页面本身不滚动
        // （body 固定 100vh，滚动条在 .chat-area 上），scrollIntoView 那类
        // 对 window 生效的调用在这里没有效果，这正是之前"切会话没滚到底"的原因。
        // smooth 只给新消息用；切换会话要瞬时到底，否则会看到从顶部一路滑下去的动画。
        function scrollToBottom(smooth) {
            const box = document.getElementById('MsgBox');
            if (!box) return;
            autoScrollUntil = Date.now() + (smooth ? 800 : 120);
            if (smooth && box.scrollTo) {
                box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
            } else {
                box.scrollTop = box.scrollHeight;
            }
        }

        // 给还没加载完的图片挂一次性回调：加载完高度才最终确定，这时再补一次贴底
        // 只认图片消息（.img-message）：头像是固定 32px，加载完也不会改变布局，
        // 把它们也算进来只会白白多触发几次贴底
        function stickToImages() {

            background: transparent;
            color: var(--muted);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }
        .reply-bar .reply-bar-close:hover { background: var(--fill); color: var(--text); }

        /* @ 选人浮层：挂在输入框上方，键盘上下选、回车确定 */
        .mention-pop {
            position: absolute;
            bottom: 100%;
            left: 12px;
            max-width: 260px;
            max-height: 190px;
            margin-bottom: 6px;
            z-index: 59;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
        }
        .mention-pop.show { display: flex; }
        .mention-pop button {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        .mention-pop button.active { background: var(--accent-soft-strong); color: var(--accent); font-weight: 600; }
        .mention-pop button .avatar { width: 20px; height: 20px; }
        .mention-pop button .avatar-text { font-size: 10px; }
        .mention-pop button span.mn { margin-left: 8px; }

        /* 跳到被回复的那条消息时闪一下，否则用户不知道滚到了哪里 */
        @keyframes msgFlash {
            0% { background: var(--accent-soft-strong); }
            100% { background: transparent; }
        }
        .message-box.flash .bubble { animation: msgFlash 1.2s ease-out; }

        /* 错误提示浮层（服务端 err 消息，如私聊对象不存在） */
        .error-toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            max-width: 80vw;
            padding: 10px 18px;
            background: var(--danger);
            color: var(--on-danger);
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(255, 77, 77, .35);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 10;
        }
        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 底部输入栏 */
        .inputbar {
            position: relative; /* 图片选择面板 #pickPanel 以它为定位祖先，贴在输入栏正上方 */
            display: flex;
            align-items: flex-end;
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .inputbar.inputbar > * + * { margin-left: 8px; }
        .inputbar input,
        .inputbar textarea {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .inputbar input:focus,
        .inputbar textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .inputbar #user { flex: 0 0 180px; }
        .inputbar textarea {
            resize: none;      /* 高度由 autoGrow 自动控制 */
            overflow-y: auto;
            max-height: 120px;
        }
        .inputbar button {
            padding: 9px 16px;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .inputbar button:hover { background: var(--accent-hover); }
        .inputbar button.ghost { background: var(--fill); color: var(--text); }
        .inputbar button.ghost:hover { background: var(--fill-strong); }

        /* 图片消息缩略图（配合 ImageB64: 前缀协议） */
        .img-message {
            max-width: 220px;
            max-height: 220px;
            border-radius: 10px;
            display: block;
            cursor: zoom-in;
        }

        /* ===== 图片选择面板（点 🖼️ 弹出：本地选取 / 缓存里挑） =====
           浮在输入栏上方，靠 .inputbar 的 position:relative 定位；
           样式全部用 theme.css 变量，日间/夜间自动跟随 */
        .pick-mask {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 60;
            display: none;
        }
        .pick-mask.show { display: block; }
        .pick-panel {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 100%;               /* 贴在输入栏上沿 */
            margin-bottom: 8px;
            z-index: 61;
            display: none;
            flex-direction: column;
            max-height: 52vh;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
            overflow: hidden;
        }
        .pick-panel.show { display: flex; }
        .pick-head {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }
        .pick-tabs { display: flex; }
        .pick-tabs button {
            padding: 6px 12px;
            margin-right: 6px;          /* 不用 flex gap（Chrome<84 不支持） */
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--fill);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .pick-tabs button.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }
        .pick-count {
            margin-left: auto;          /* 靠右 */
            font-size: 12px;
            color: var(--muted);
        }
        /* 注意：面板里的 button 都在 .inputbar 内，会被 `.inputbar button`（0,1,1）命中，
           所以这几个按类选中的规则要带上 .pick-panel 前缀提高特异性，否则背景/内边距会被顶掉 */
        .pick-panel .pick-close {
            width: 28px; height: 28px;
            padding: 0;
            margin-left: 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .pick-panel .pick-close:hover { background: var(--fill); color: var(--text); }
        .pick-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
        }
        .pick-body.hidden { display: none; }
        /* 本地选取 tab：一整块虚线区，点哪儿都触发文件选择 */
        .pick-panel .pick-local {
            display: block;
            width: 100%;
            padding: 26px 12px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            background: var(--fill);
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }
        .pick-panel .pick-local:hover { border-color: var(--accent); color: var(--accent); }
        /* 缓存 tab：缩略图网格（用 grid gap，Chrome 57+ 支持） */
        .pick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 8px;
        }
        .pick-grid img {
            width: 100%;
            height: 84px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            background: var(--fill);
            cursor: pointer;
            display: block;
        }
        .pick-grid img:hover { border-color: var(--accent); }
        /* 换头像时不接受的图（GIF）：仍然画出来，但压暗且不可点 */
        .pick-grid img.pick-banned {
            opacity: .38;
            cursor: not-allowed;
        }
        .pick-grid img.pick-banned:hover { border-color: transparent; }
        /* 选中的那张：加一圈 accent 边，和操作条呼应 */
        .pick-grid img.sel {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        /* 点中缩略图后浮出的操作条（查看 / 删除 / 发送），钉在面板底部 */
        .pick-actions {
            display: none;
            align-items: center;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            background: var(--fill);
        }
        .pick-actions.show { display: flex; }
        .pick-sel-name {
            flex: 1 1 auto;
            min-width: 0;               /* 允许收缩，否则长文件名把按钮挤出去 */
            margin-right: 8px;
            font-size: 12px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 同样要带 .pick-panel 前缀压过 `.inputbar button`（见上） */
        .pick-panel .pick-actions button {
            padding: 6px 12px;
            margin-left: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .pick-panel .pick-actions button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .pick-panel .pick-actions button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }
        .pick-panel .pick-actions button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--on-accent);
        }
        .pick-panel .pick-actions button.danger {
            color: var(--danger);
            border-color: var(--danger-border);
        }
        .pick-panel .pick-actions button.danger:hover {
            background: var(--danger-soft);
            color: var(--danger);
        }
        .pick-panel .pick-actions button.ghost {
            background: var(--fill);
            color: var(--muted);
        }
        .pick-panel .pick-actions button.ghost:hover {
            background: var(--fill-strong);
            color: var(--text);
            border-color: var(--border);
        }

        /* 面板两种用途（发图 / 换头像）靠 data-mode 切换按钮，
           不用 JS 逐个改 display —— 少一半状态要同步 */
        .pick-panel .pick-actions #pickResetAvatar { display: none; }
        .pick-panel .pick-actions #pickSetAvatar { display: none; }
        .pick-panel[data-mode="avatar"] .pick-actions #pickSend { display: none; }
        .pick-panel[data-mode="avatar"] .pick-actions #pickDelete { display: none; }
        .pick-panel[data-mode="avatar"] .pick-actions #pickSetAvatar { display: block; }
        /* 「恢复默认」不依赖选中项，头像模式下常驻在操作条最左边 */
        .pick-panel[data-mode="avatar"] .pick-actions #pickResetAvatar { display: block; }
        /* 头像模式下没必要让用户先点一张图才能看到操作条：
           操作条本身在选中时才 .show，这里让它在整个头像模式里都可见 */
        .pick-panel[data-mode="avatar"] .pick-actions { display: flex; }
        .pick-panel[data-mode="avatar"] .pick-actions #pickSetAvatar:disabled { opacity: .5; cursor: default; }
        .pick-hint {
            padding: 18px 8px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        /* 小屏适配 */
        @media (max-width: 600px) {
            .message-box { max-width: 92%; }
            .avatar { width: 28px; height: 28px; }
            .message-box.message-box > * + * { margin-left: 6px; }
            .message-box.own.own > * + * { margin-left: 0; margin-right: 6px; }
            .avatar-text { font-size: 13px; }
            /* 换行后行首不该带左边距，间距改到子项右侧 */
            .inputbar { flex-wrap: wrap; }
            .inputbar > * + * { margin-left: 0; }
            .inputbar > * { margin-right: 8px; }
            .inputbar #user { flex: 1 1 100%; margin-right: 0; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <button id="sidebarToggle" class="icon-btn" title="显示/收起会话">☰</button>
            <h1>Chat</h1>
        </div>
        <div class="meta">
            <span id="connDot" class="conn-dot wait" title="正在连接…"></span>
            <button id="avatarBtn" class="avatar-btn" title="更换头像" type="button">
                <span id="meAvatar" class="avatar-slot"></span>
                <span class="avatar-btn-text">换头像</span>
            </button>
            <span id="meName" class="me"></span>
            <a href="/userList">查看用户列表</a>
            <a class="nav-setting" href="/setting" title="设置">⚙ 设置</a>
        </div>
    </header>

    <div class="layout">
        <!-- 会话侧边栏：按 message/history_*.json 文件名分组（私聊 "名A-名B"、群聊 yyyy-MM-dd），点击切换 -->
        <aside id="sidebar">
            <!-- 两段各占一半高度（.conv-section 用 flex:1 1 0），各自列表内部滚动；
                 群聊段带一条上分割线，内容再多也不会把另一段顶出去 -->
            <div class="conv-section conv-section-priv">
                <h3>私聊</h3>
                <div id="privList" class="conv-list"></div>
            </div>
            <div class="conv-section conv-section-group">
                <h3>群聊记录</h3>
                <div id="dayList" class="conv-list"></div>
            </div>
        </aside>

        <div class="right-col">
            <main id="MsgBox" class="chat-area"></main>

            <!-- 回复提示条：选中某条消息的「回复」后出现，发送或点 ✕ 消失。
                 放在消息区与输入栏之间，用 flex 自然撑开，不遮消息。 -->
            <div id="replyBar" class="reply-bar">
                <span id="replyBarWho" class="reply-bar-who"></span>
                <span id="replyBarText" class="reply-bar-text"></span>
                <button id="replyBarClose" class="reply-bar-close" type="button" title="取消回复">✕</button>
            </div>

            <footer class="inputbar">
                <!-- @ 补全候选面板：浮在输入栏上方（.inputbar 是 position:relative，
                     所以 bottom:100% 正好贴着它上沿）。 -->
                <div id="mentionPop" class="mention-pop"></div>
                <input type="text" id="user" placeholder="私聊对象，留空发到群里；填日期(yyyy-MM-dd)浏览该日群聊">
                <textarea id="content" rows="1" placeholder="输入消息，Enter 换行，Ctrl+Enter 发送"></textarea>
                <button id="imgBtn" class="ghost" title="发送图片（本地选取或从缓存中选择）">🖼️</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none">
                <button id="sendBtn">发送</button>
                <button id="refreshBtn" class="ghost">刷新</button>

                <!-- 图片选择面板：🖼️ 触发（发图）或顶栏「换头像」触发（设头像），
                     浮在输入栏上方（绝对定位，不占 flex 流）。
                     两种用途共用同一个面板，靠 .pick-panel 上的 data-mode 区分：
                     mode=send 显示「发送」，mode=avatar 显示「设为头像 / 恢复默认」。 -->
                <div id="pickMask" class="pick-mask"></div>
                <div id="pickPanel" class="pick-panel" data-mode="send">
                    <div class="pick-head">
                        <div class="pick-tabs">
                            <button type="button" id="pickTabCache" class="active">缓存图片</button>
                            <button type="button" id="pickTabLocal">本地选取</button>
                        </div>
                        <span id="pickCount" class="pick-count"></span>
                        <button type="button" id="pickClose" class="pick-close" title="关闭">✕</button>
                    </div>
                    <div id="pickBodyCache" class="pick-body">
                        <div id="pickGrid" class="pick-grid"></div>
                        <div id="pickHint" class="pick-hint" style="display:none"></div>
                    </div>
                    <div id="pickBodyLocal" class="pick-body hidden">
                        <button type="button" id="pickLocalBtn" class="pick-local">
                            点击选择本地图片（≤10MB）
                        </button>
                    </div>
                    <!-- 点中缩略图后浮出的操作条：查看 / 删除 / 发送（头像模式下最后一个换成为头像） -->
                    <div id="pickActions" class="pick-actions">
                        <span id="pickSelName" class="pick-sel-name"></span>
                        <button type="button" id="pickResetAvatar" class="ghost">恢复默认</button>
                        <button type="button" id="pickView">查看</button>
                        <button type="button" id="pickDelete" class="danger">删除</button>
                        <button type="button" id="pickSend" class="primary">发送</button>
                        <button type="button" id="pickSetAvatar" class="primary">设为头像</button>
                    </div>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
