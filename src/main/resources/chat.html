<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <link rel="stylesheet" href="/resources/lib/theme.css">
    <script src="/resources/lib/theme.js"></script>
    <script src="/resources/config.js"></script>
    <script src="/resources/lib/page-store.js"></script>
    <link rel="stylesheet" href="/resources/lib/lightbox.css">
    <script src="/resources/lib/idb-store.js"></script>
    <script src="/resources/lib/lightbox.js"></script>
    <script src="/resources/lib/chat-prefs.js"></script>
    <script>
        // 本页配置存 Cookie（路径 /resources/chat.html，与其他页面互不混杂）
        // remote：同时同步一份到服务端 /api/prefs —— 已读表条目数随私聊对象增长，
        // 单靠 4KB 的 Cookie 迟早撑破，服务端那份没有上限
        const store = PageStore.create('chat', { remote: true });

        // ===== 全局状态 =====
        let websocket = null;
        let nowTarget = null; // 当前私聊对象，与输入框不一致时先刷新再发送
        let me = null;        // 自己的用户名，来自 /whoami；路由未实现时为 null
        let currentDay = null; // 群聊当前查看的历史日期（null 表示今天）
        let serverToday = null; // 服务端今天（Asia/Shanghai），来自 /conversations 的 today 字段
        let convLast = {}; // 各会话最后一条消息 {time, by}（按 history 文件名），来自 /conversations，未读判断用
        let privLastMap = {}; // "对方" -> {time, by}：同一对方可能对应新旧多份归档，取最新一条
        let privPartners = new Set(); // 侧边栏已渲染的私聊对象，用于判断是否需要重新拉取会话列表
        let onlineSet = new Set(); // 当前在线用户名，来自服务端的 presence 帧（连接/断开时各推一次）
        let lastConvNames = null; // 上次拉取到的会话名单（拼接串）；重连后重拉时名单没变就只重算红点、不重建列表
        let lastRead = {}; // 各会话已读到的时间戳 {键: 时间}，存 Cookie；私聊键 'p:对方'，群聊键 'g:'
        let memberNames = []; // 全部用户名（来自 /members），@ 补全与高亮都按这份名单认人
        let replyTo = null;   // 正在回复的那条消息 {name, time, text}；null = 不回复

        document.addEventListener('DOMContentLoaded', async function () {
            document.getElementById('sendBtn').addEventListener('click', sendMsg);
            document.getElementById('refreshBtn').addEventListener('click', refresh);
            // 侧边栏展开/收起
            document.getElementById('sidebarToggle').addEventListener('click', function () {
                document.getElementById('sidebar').classList.toggle('open');
            });
            // 记住用户有没有自己往上翻：只有仍贴着底部时才自动跟随新消息/图片撑高。
            // 自己刚触发的滚动（含 smooth 动画进行中）跳过，否则动画每帧都"没到底"，
            // 会把 stickBottom 误置 false，之后新消息就再也不跟随了。
            // scroll 事件一帧可能来好几次，每次 nearBottom() 都要读 scrollHeight/scrollTop/
            // clientHeight（会逼浏览器同步布局）。合并到下一帧只算一次。
            let scrollTickPending = false;
            document.getElementById('MsgBox').addEventListener('scroll', function () {
                if (scrollTickPending) return;
                scrollTickPending = true;
                const tick = function () {
                    scrollTickPending = false;
                    if (Date.now() < autoScrollUntil) return;
                    stickBottom = nearBottom();
                };
                if (window.requestAnimationFrame) requestAnimationFrame(tick);
                else setTimeout(tick, 16);
            });
            // 图片缩略图双击全屏查看：统一交给 /resources/lib/lightbox.js
            // （与 B 站各页共用同一实现；缩放/平移/手势/关闭、以及设置页的控件显隐都在那边）
            // 聊天图本身已在服务端缓存里，但保存按钮仍然开放：点 💾 会把它复制一份到
            // cache/picture/<当前用户名>/，这样它才会出现在自己「从缓存中选取」的列表里；
            // 裁剪不开放（聊天图直接改内容容易误伤存档）。
            Lightbox.mount({ dblclick: 'img.img-message', save: true, edit: false });
            // 图片发送：点 🖼️ 打开选择面板（本地选取 / 从自己的 cache/picture/<用户名>/ 里挑），两个 tab
            document.getElementById('imgBtn').addEventListener('click', function () { openPickPanel('send'); });
            document.getElementById('avatarBtn').addEventListener('click', function () { openPickPanel('avatar'); });
            document.getElementById('pickClose').addEventListener('click', closePickPanel);
            document.getElementById('pickMask').addEventListener('click', closePickPanel);
            document.getElementById('pickTabLocal').addEventListener('click', function () { switchPickTab('local'); });
            document.getElementById('pickTabCache').addEventListener('click', function () { switchPickTab('cache'); });
            // 点中缩略图后的三个动作：查看（走共用查看器）/ 删除（只删自己目录）/ 发送（发引用）
            document.getElementById('pickView').addEventListener('click', viewPicked);
            document.getElementById('pickDelete').addEventListener('click', deletePicked);
            document.getElementById('pickSend').addEventListener('click', sendPicked);
            document.getElementById('pickSetAvatar').addEventListener('click', setPickedAvatar);
            document.getElementById('pickResetAvatar').addEventListener('click', resetAvatar);
            // 本地选取：面板上的大按钮转去点隐藏的 file input
            document.getElementById('pickLocalBtn').addEventListener('click', function () {
                document.getElementById('imgInput').click();
            });
            document.getElementById('imgInput').addEventListener('change', function (e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (inOldGroupDay()) {
                    showError('正在浏览旧日群聊记录，该日不可发送图片');
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    showError('请选择图片文件');
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    showError('图片太大，请选择 10MB 以内的图片');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async function (ev) {
                    // 参考 talk.html 的前缀协议：ImageB64: + 完整 data URL，服务端校验后广播并存档
                    // 上传不成功就把面板留着，用户不用重新挑文件
                    if (await sendRaw('ImageB64:' + ev.target.result)) closePickPanel();
                };
                reader.onerror = function () {
                    showError('读取图片文件失败');
                };
                reader.readAsDataURL(file);
            });

            // Esc 关闭选择面板（只在面板打开时生效，不干扰页面上其他 Esc 行为）
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && document.getElementById('pickPanel').classList.contains('show')) {
                    closePickPanel();
                }
            });

            // ===== 图片选择面板 =====
            // mode：'send' 发图（🖼️ 触发）/ 'avatar' 设头像（顶栏「换头像」触发）。
            // 两种用途共用同一个面板：缩略图网格、查看、删除全都一样，
            // 差别只在底部操作条最后那个按钮是「发送」还是「设为头像」。
            function openPickPanel(mode) {
                const asAvatar = mode === 'avatar';
                // 发图时要挡旧日归档（那天不能发消息）；换头像是全局设置，与当前会话无关
                if (!asAvatar && inOldGroupDay()) {
                    showError('正在浏览旧日群聊记录，该日不可发送图片');
                    return;
                }
                document.getElementById('pickPanel').setAttribute('data-mode', asAvatar ? 'avatar' : 'send');
                document.getElementById('pickMask').classList.add('show');
                document.getElementById('pickPanel').classList.add('show');
                // 默认落在缓存 tab：发图时多是已经存过的图；换头像也**只能**选缓存里的图
                // （设头像走的是"引用已有文件"，不接受重新上传 base64）
                if (asAvatar) {
                    document.getElementById('pickTabLocal').style.display = 'none';
                } else {
                    document.getElementById('pickTabLocal').style.display = '';
                }
                switchPickTab('cache');
                if (asAvatar) updatePickSetAvatarLabel();
            }

            function closePickPanel() {
                document.getElementById('pickMask').classList.remove('show');
                document.getElementById('pickPanel').classList.remove('show');
                // 关掉时清掉选中态，下次打开是干净的
                selectPick(null);
            }

            function pickMode() {
                return document.getElementById('pickPanel').getAttribute('data-mode') || 'send';
            }

            function switchPickTab(tab) {
                document.getElementById('pickTabLocal').classList.toggle('active', tab === 'local');
                document.getElementById('pickTabCache').classList.toggle('active', tab === 'cache');
                document.getElementById('pickBodyLocal').classList.toggle('hidden', tab !== 'local');
                document.getElementById('pickBodyCache').classList.toggle('hidden', tab !== 'cache');
                // 操作条只服务于缓存里的图，切到本地选取时收起
                if (tab !== 'cache') selectPick(null);
                // 每次切到缓存都重拉：刚保存的图要能立刻出现在列表里
                if (tab === 'cache') loadPickCache();
            }

            // 当前选中的缓存图片（{name, ref} 或 null）。点缩略图只是选中并浮出「查看/删除/发送」，
            // 不再像旧版那样单击直接发送 —— 发错了撤回也麻烦，多一步确认更稳。
            var pickSel = null;

            // 列表指纹：只取名字序列 + 总数。mtime/size 会随同内容重存而变，
            // 但对"要不要重画这一格"没影响，忽略掉能少抖几次。
            function pickFingerprint(data) {
                if (!data) return '';
                var items = data.items || [];
                var h = (data.total || 0) + ':';
                for (var i = 0; i < items.length; i++) h += (items[i].name || '') + ',';
                return h;
            }

            function selectPick(item) {
                pickSel = item;
                // 头像模式下操作条常驻，但「设为头像」要跟着选中态置灰
                if (pickMode() === 'avatar') updatePickSetAvatarLabel();
                const actions = document.getElementById('pickActions');
                const nameEl = document.getElementById('pickSelName');
                if (item) {
                    actions.classList.add('show');
                    // 只显示哈希前 8 位，完整名字在 title 里（64 位哈希全显示会把按钮挤走）
                    nameEl.textContent = item.name.substring(0, 8) + '…';
                    nameEl.title = item.name;
                } else {
                    actions.classList.remove('show');
                    nameEl.textContent = '';
                    nameEl.title = '';
                }
                // 同步缩略图的选中框
                const imgs = document.getElementById('pickGrid').querySelectorAll('img');
                for (let i = 0; i < imgs.length; i++) {
                    const on = !!item && imgs[i].getAttribute('data-name') === item.name;
                    imgs[i].classList.toggle('sel', on);
                }
            }

            // 发送当前选中的图：服务端已有这份文件，只发引用，不走 base64 重传
            async function sendPicked() {
                if (!pickSel) return;
                // 面板开着的时候可能切到了旧日群聊，这里再挡一次（与本地选取一致）
                if (inOldGroupDay()) {
                    showError('正在浏览旧日群聊记录，该日不可发送图片');
                    return;
                }
                const ref = pickSel.ref;
                // 断线时别先把面板关掉：关了就得从头再找这张图。发成功了才收起
                if (!(await sendRaw('ImageRef:' + ref))) return;
                closePickPanel();
            }

            // 查看当前选中的图：交给共用查看器（缩放/保存都在那边，裁剪仍关闭）
            // 本地有这份字节就用 blob URL，没有才给 /img/ 地址。
            // 这里现查 imgUrlMemo 而不是用选中时记下的：选中之后可能发生过淘汰，
            // 拿着一个已 revoke 的地址打开会是一张裂图。
            function viewPicked() {
                if (!pickSel || !window.Lightbox) return;
                Lightbox.open(imgUrlMemo.get(pickSel.name) || pickSel.ref);
            }

            // ===== 换头像（复用图片选择面板，mode=avatar） =====

            // 头像模式下「设为头像」的可用态跟着选中项走：
            // 没选图时置灰，选了才亮。不再额外维护一份状态，直接从 pickSel 推。
            function updatePickSetAvatarLabel() {
                const btn = document.getElementById('pickSetAvatar');
                if (!btn) return;
                btn.disabled = !pickSel;
                btn.textContent = '设为头像';
            }

            // 把当前选中的缓存图设为头像：服务端只接受自己目录里已存在的文件名，
            // 不重传字节（和「发送」一样走引用）
            async function setPickedAvatar() {
                if (!pickSel) return;
                // 面板里已经把 gif 标成不可选了，这里再挡一次：防止缓存里的旧列表
                // （kv:pictures 可能还是空模式那次画的）让人点进可发状态。
                if (/\.gif$/i.test(pickSel.name)) {
                    showError('头像不支持 GIF 动图，请选一张静态图片');
                    return;
                }
                const btn = document.getElementById('pickSetAvatar');
                btn.disabled = true;
                btn.textContent = '设置中…';
                try {
                    const res = await fetch('/setAvatar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: pickSel.name })
                    });
                    const data = await res.json().catch(function () { return {}; });
                    if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
                    // 本地先记住，省一次 /avatars；in-screen 的消息就地换头像
                    if (me) avatarMap[me] = data.ref || pickSel.ref;
                    paintMeAvatar();
                    repaintOwnAvatars();
                    closePickPanel();
                } catch (err) {
                    showError('设置头像失败：' + err.message);
                } finally {
                    btn.textContent = '设为头像';
                    updatePickSetAvatarLabel();
                }
            }

            // 恢复默认（首字头像）
            async function resetAvatar() {
                const btn = document.getElementById('pickResetAvatar');
                btn.disabled = true;
                btn.textContent = '恢复中…';
                try {
                    const res = await fetch('/deleteAvatar', { method: 'POST' });
                    const data = await res.json().catch(function () { return {}; });
                    if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
                    if (me) delete avatarMap[me];
                    paintMeAvatar();
                    repaintOwnAvatars();
                    closePickPanel();
                    showError('已恢复默认头像');
                } catch (err) {
                    showError('恢复默认头像失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '恢复默认';
                }
            }

            // 删除当前选中的图：只删自己目录里的那一份，成功后从网格里摘掉
            async function deletePicked() {
                if (!pickSel) return;
                const item = pickSel;
                const btn = document.getElementById('pickDelete');
                btn.disabled = true;
                btn.textContent = '删除中…';
                try {
                    const res = await fetch('/deletePicture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: item.name })
                    });
                    const data = await res.json().catch(function () { return {}; });
                    if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
                    // 本地两份缓存同步删掉：字节（imgBlobs）与列表（kv:pictures），
                    // 否则下次打开面板会先闪出这张已经删掉的图
                    forgetImg(item.name);
                    dropFromPickList(item.name);
                    // 摘掉对应缩略图
                    const imgs = document.getElementById('pickGrid').querySelectorAll('img');
                    for (let i = 0; i < imgs.length; i++) {
                        if (imgs[i].getAttribute('data-name') === item.name) {
                            imgs[i].parentNode.removeChild(imgs[i]);
                            break;
                        }
                    }
                    selectPick(null);
                    if (!document.getElementById('pickGrid').querySelectorAll('img').length) {
                        // 全删光了：重拉一次，让空态文案正常显示
                        loadPickCache();
                    } else {
                        const count = document.getElementById('pickCount');
                        const m = /^最近 (\d+) \/ 共 (\d+) 张$/.exec(count.textContent || '');
                        if (m) {
                            count.textContent = '最近 ' + (Number(m[1]) - 1) + ' / 共 ' + (Number(m[2]) - 1) + ' 张';
                        }
                    }
                } catch (err) {
                    showError('删除失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '删除';
                }
            }

            // 拉自己的图片列表渲染成缩略图网格（服务端只返回本 IP 用户名目录下的图；
            // 缩略图字节优先走 IndexedDB 的 imgBlobs，没有才回源）
            //
            // 列表本身也缓存一份到 kv:pictures：面板每次都重拉是为了"刚存的图立刻出现"，
            // 但网络慢的时候没必要先给一片空白 —— 先用上次的列表画出来，再用服务端的覆盖。
            async function loadPickCache() {
                const hint = document.getElementById('pickHint');
                const count = document.getElementById('pickCount');
                // 重拉时清掉选中态（旧选中项的节点已经不在了）
                selectPick(null);
                hint.style.display = 'block';
                hint.textContent = '加载中…';
                count.textContent = '';
                pickShownFp = '';

                // 1) 先上本地列表：命中就立刻有图可点，hint 直接隐藏
                if (window.IdbStore) {
                    const cached = await IdbStore.soon(IdbStore.kvGet(PICK_LIST_KEY), 200);
                    if (cached && cached.items && cached.items.length) paintPickGrid(cached);
                }

                // 2) 再对齐服务端
                try {
                    const res = await fetch('/pictures?limit=120');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const items = data.items || [];
                    // 列表没变就不重画：省掉整块 DOM 重建，缩略图也不会重新解码
                    if (pickFingerprint(data) !== pickShownFp) paintPickGrid(data);
                    if (window.IdbStore) IdbStore.kvSet(PICK_LIST_KEY, data, 0);
                } catch (err) {
                    // 拉不到就留着本地那份（上面可能已经画出来了），别把已经能用的面板清空
                    if (!pickShownFp) {
                        hint.style.display = 'block';
                        hint.textContent = '加载缓存图片失败：' + err.message;
                    }
                }
            }

            // 把一份 /pictures 结果画成缩略图网格（本地副本与服务端那份共用同一个函数，
            // 差别只在调用时机：本地先画、服务端回来后再决定要不要重画）
            function paintPickGrid(data) {
                const grid = document.getElementById('pickGrid');
                const hint = document.getElementById('pickHint');
                const count = document.getElementById('pickCount');
                const items = data.items || [];
                grid.textContent = '';
                pickShownFp = pickFingerprint(data);
                if (!items.length) {
                    count.textContent = '';
                    hint.style.display = 'block';
                    hint.textContent = '你还没有保存过图片（全屏查看时点 💾 即可存到这里）';
                    return;
                }
                hint.style.display = 'none';
                count.textContent = '最近 ' + items.length + ' / 共 ' + data.total + ' 张';
                // 换头像不接受 GIF：头像位只有 22~32px，动图在那儿看不清还白解码，
                // 首帧常常是空白帧，加载出来就是一块灰。发消息不受影响，只是不能当头像。
                const asAvatar = pickMode() === 'avatar';
                items.forEach(function (it) {
                    const img = document.createElement('img');
                    img.alt = it.name;
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.setAttribute('data-name', it.name);
                    const banned = asAvatar && /\.gif$/i.test(it.name);
                    if (banned) {
                        // 仍然显示（让人知道这张图存在），但不可选：点它不弹操作条，
                        // 用 title + 半透明样式说明原因，省掉一次"选中了却被服务端拒绝"的往返。
                        img.className = 'pick-banned';
                        img.title = it.name + '（GIF 不能用作头像）';
                    } else {
                        img.title = it.name;
                        img.addEventListener('click', function () {
                            // 单击只选中，浮出「查看 / 删除 / 发送」；发不发由用户点按钮决定。
                            // 发送永远只发 ref（服务端按引用转发），本地字节只用于「查看」
                            selectPick({ name: it.name, ref: it.ref });
                        });
                    }
                    // 字节优先本地缓存，没有才走 /img/<name>（见 paintImg）
                    paintImg(img, it.name, it.ref);
                    grid.appendChild(img);
                });
            }
            // Enter 换行（textarea 默认行为），Ctrl/Cmd+Enter 快捷发送
            document.getElementById('content').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMsg();
                }
            });
            // 输入时自己长高。少了这一句 autoGrow 就只在"发送后还原"时被调用过，
            // 打多行字的时候输入框一直只有一行高、内部滚动，写在下面那些注释也就白说了
            const contentEl = document.getElementById('content');
            contentEl.addEventListener('input', function () {
                autoGrow();
                paintMentionPop();
            });
            // 补全面板开着时 ↑↓/Enter/Tab 归面板、Esc 关掉；否则按键照常进 textarea
            contentEl.addEventListener('keydown', handleMentionKey);
            // 光标跑了（点别处、方向键移动）就收起面板，避免停在旧位置
            document.addEventListener('selectionchange', function () {
                if (document.activeElement !== contentEl) hideMentionPop();
            });
            document.getElementById('replyBarClose').addEventListener('click', clearReply);
            // 点一下消息就地展开「回复 / 撤回」，再点一下（或点别处）收起。
            // 触屏没有 hover，这是唯一入口；桌面端悬停本来就会浮现，点击只当补充。
            document.addEventListener('click', function (e) {
                const t = e.target;
                if (!t || !t.closest) { closeAllMsgActions(); return; }
                // 点这几个地方不算"点这条消息"：操作条按钮自己会 stopPropagation，
                // 引用块要点着跳转、图片要点开查看器、链接要能打开 —— 别顺手收起操作条
                if (t.closest('.msg-actions, .reply-quote, a, img')) {
                    closeAllMsgActions();
                    return;
                }
                const box = t.closest('#MsgBox .message-box');
                if (!box) { closeAllMsgActions(); return; }
                // 桌面端选一段文字来复制时，松手也会走到这里 —— 那种情况不该弹操作条
                const sel = window.getSelection && window.getSelection();
                if (sel && String(sel).length) { closeAllMsgActions(); return; }
                toggleMsgActions(box);
            });
            // 设置页改了「显示消息时间」时本页立刻跟着重画（同一标签页走 notify、
            // 另一个标签页走 BroadcastChannel，chat-prefs.js 两种都转成 onChange）
            ChatPrefs.onChange(applyShowTimePref);
            // 手动改私聊对象时退出"浏览某日群聊记录"模式；直接填入日期（yyyy-MM-dd）则切换为该日群聊记录
            document.getElementById('user').addEventListener('input', function () {
                if (isDateStr(this.value)) {
                    currentDay = this.value;
                    refresh();
                } else {
                    currentDay = null; // 改回人名或清空时由后续"刷新"/发送/侧边栏点击重新载入
                }
                syncSidebarActive();
            });
            // 敲完人名离开输入框就切过去。只有 input 事件时，手动输入私聊对象
            // 之后画面还停在原会话上，必须再去点"刷新"才生效（发送时才顺带刷新）。
            // 日期模式已经由 input 处理过，这里跳过，避免同一次编辑刷两遍。
            document.getElementById('user').addEventListener('change', function () {
                if (isDateStr(this.value)) return;
                if (this.value === nowTarget) return;
                refresh();
            });
            await loadMe();
            await refresh();
            connect();
            // 宽屏默认展开侧边栏，窄屏收起，顶栏按钮可手动切换
            if (window.innerWidth > 600) document.getElementById('sidebar').classList.add('open');
        });

        // ===== 会话侧边栏 =====
        // 群聊按日期（history_yyyy-MM-dd.json）归档，私聊按 "名A-名B"（getTarget 排序后命名）归档
        // 加载 message/ 下所有 history 文件名，分组渲染；点击切换对应对话并刷新
        // 未读小红点：按"会话最后消息晚于已读时间且非自己/系统发送"计算（数据来自 /conversations 的 last 字段）
        // 键名直接用用户名，PageStore 内部会做 Cookie 名安全编码（中文等非 token 字符）
        function lastReadKey() { return 'lastRead_' + (me || 'unknown'); }

        // lastRead 是否已经从 Cookie/服务端读进来了。
        // 关键：saveLastRead() 写的是**整张表**，而 loadMe() 里的 store.sync 是异步的
        // （回调式 XHR）。若 WS 在同步回来之前就收到消息，onWsUnread -> markRead 会拿空的
        // lastRead 写进去，把整张表覆盖成"只读过这一条"，其余会话的已读状态全丢；
        // 而且写进去之后 overlay 里就有这个键了，服务端那份也盖不回来。
        // 所以没读完之前一律不写，宁可少记一次已读（红点下次点开会补上）。
        let lastReadLoaded = false;

        // "明确知道自己有一条没看过"的会话（键同 lastRead：'g:' / 'p:对方'）。
        //
        // 为什么时间戳不够：消息时间只精确到秒。已读到 10:00:00 之后，同一秒又来一条，
        // 用 `last.time > readTime` 判不出来（相等），红点不亮且永远不会自愈。
        // 所以"消息到达时用户没正看着这个会话"这件事单独记一笔，作为时间比较的补充。
        // 只活在本页会话里：刷新后靠 lastRead 与 convLast 的时间比较兜底（那时至少不会更糟）。
        // 用户一旦进入该会话（markRead）就删掉，所以它不会和 lastRead 长期打架。
        const unreadKeys = new Set();

        function loadLastRead() {
            try { lastRead = JSON.parse(store.get(lastReadKey()) || '{}'); }
            catch (e) { lastRead = {}; }
            lastReadLoaded = true;
        }

        // 全量已读表：Cookie 只当本机缓存（可能因 4KB 上限被裁剪），
        // 完整的那份在服务端 /api/prefs 里，所以这里永远推完整表，不再自己丢条目
        function saveLastRead() {
            store.set(lastReadKey(), JSON.stringify(lastRead), true);
        }

        function markRead(key, time) {
            // 进过这个会话就算看过，把"明确未读"的标记抹掉（即使时间戳没有前进）
            unreadKeys.delete(key);
            if (!lastReadLoaded) return; // 已读表还没读进来，写了会覆盖掉其他会话（见 lastReadLoaded）
            if (time && (!lastRead[key] || time > lastRead[key])) {
                lastRead[key] = time;
                saveLastRead();
            }
        }

        // 判断一个"最后消息"是否构成未读：晚于已读时间，且发送者不是我（System 归档创建消息也不算）
        function isUnread(last, readTime, key) {
            if (!last || !last.time || !last.by || last.by === 'System') return false;
            if (me && last.by === me) return false;
            // 消息时间戳只精确到秒："刚刚读过 10:00:00" 与"10:00:00 又来一条"用
            // 字符串比较分不出来（`> ` 为假，红点不亮，而且永远不会自愈）。
            // 所以在"用户没正看着这个会话时收到消息"的那一刻明确记一笔，不指望时间戳。
            if (key && unreadKeys.has(key)) return true;
            return last.time > (readTime || '');
        }

        // 从私聊归档文件名（getTarget 排序后 "名A-名B"）反推"对方"是谁。
        // 自己发给自己时两个名字相同，归档名是 "我-我"，按老逻辑找"不等于 me"的那段会落空，
        // 于是整个会话被跳过、侧边栏不显示 —— 这里显式把对方判定为自己。
        function partnerOf(name, self) {
            if (name === self + '-' + self) return self;
            const parts = name.split('-');
            return parts.find(function (x) { return x !== self && x !== ''; }) || null;
        }

        async function loadConversations() {
            let names = [];
            let today = null;
            try {
                const resp = await fetch('/conversations');
                if (!resp.ok) {
                    // 鉴权失败/服务端 500：保持现状，别拿一份空名单去重建侧边栏
                    console.warn('获取会话列表失败: HTTP ' + resp.status);
                    return;
                }
                const data = await resp.json();
                names = data.names || [];
                today = data.today || null; // 服务端 Asia/Shanghai 的今天，避免前端时区偏差
                // 只在真拿到数据时才替换：请求失败（服务器刚重启、网络抖）时
                // 保留上一轮的 convLast/privLastMap，否则红点会整片熄灭，
                // 而下一次成功拉取前用户会以为"消息都读过了"
                convLast = data.last || {};
                privLastMap = {};
            } catch (e) {
                console.warn('获取会话列表失败:', e);
                return;
            }
            if (today) serverToday = today;
            const dayRe = /^\d{4}-\d{2}-\d{2}$/;
            const todayLabel = today || todayStr(); // 服务端今天的日期，失败时退回本地
            const days = names.filter(n => dayRe.test(n)).reverse(); // 最近的日期在前
            const privs = names.filter(n => !dayRe.test(n) && n.includes('-'));
            // 私聊归档按"对方"归并取最新（同一对方可能对应新旧多份归档，换用户名产生）；
            // 无条件缓存，供 onWsUnread/switchPrivate 实时判断未读
            for (const p of privs) {
                const other = me ? partnerOf(p, me) : null;
                const last = convLast[p];
                if (other && last) {
                    const cur = privLastMap[other];
                    if (!cur || last.time > cur.time) privLastMap[other] = last;
                }
            }

            // 轻路径：会话名单没变（典型场景=WS 重连后的补拉）就只重算红点，
            // 不重建列表，避免把用户刚点的项/高亮冲掉
            const namesKey = names.join('|');
            if (lastConvNames !== null && lastConvNames === namesKey) {
                // 名单没变但要重排：私聊的顺序只看"最后一条消息时间"，而新消息不会
                // 改变文件名（同一个归档里追加），断线重连补拉时顺序可能已经过期
                sortPrivList();
                updateUnreadState();
                return;
            }
            lastConvNames = namesKey;

            const dayList = document.getElementById('dayList');
            dayList.innerHTML = '';
            for (const d of days) {
                const item = document.createElement('button');
                item.className = 'conv-item';
                item.dataset.day = d; // 供 syncSidebarActive 判断高亮
                // 群聊项不挂头像（群没有"某个人"，一个「群」字占位反而占地方）
                const dayName = document.createElement('span');
                dayName.className = 'conv-name';
                dayName.textContent = d === todayLabel ? '今天（' + d + '）' : d;
                item.appendChild(dayName);
                // 红点只挂在"今天"项上：旧日归档是只读历史，新消息只会进当天的文件
                if (d === todayLabel && isUnread(convLast[d], lastRead['g:'], 'g:')) {
                    addUnreadDot(item, lastMentionsMe(convLast[d]));
                }
                item.addEventListener('click', function () { switchGroupDay(d); });
                dayList.appendChild(item);
            }
            if (days.length === 0) dayList.innerHTML = '<p class="conv-empty">暂无群聊记录</p>';

            const privList = document.getElementById('privList');
            privList.innerHTML = '';
            let privShown = 0;
            const shownOthers = new Set(); // 按"对方"去重：新旧归档（换用户名后产生）可能映射到同一对象
            privPartners = new Set();
            for (const p of privs) {
                let other = null;
                if (me) {
                    if (!p.split('-').includes(me)) continue; // 归档里没有自己（旧用户名残留），跳过
                    other = partnerOf(p, me);
                    if (!other || shownOthers.has(other)) continue; // 无法解析或已有同一对象的项，跳过
                    shownOthers.add(other);
                }
                const item = document.createElement('button');
                item.className = 'conv-item';
                if (other !== null) {
                    item.dataset.other = other; // 供 syncSidebarActive 判断高亮
                    item.appendChild(privAvatarNode(other));
                    const nameEl = document.createElement('span');
                    nameEl.className = 'conv-name';
                    nameEl.textContent = other;
                    item.appendChild(nameEl);
                    privPartners.add(other);
                    if (isUnread(privLastMap[other], lastRead['p:' + other], 'p:' + other)) {
                        // 私聊不提供 @，所以不会出现「@」胶囊，只有点
                        addUnreadDot(item, false);
                    }
                    item.addEventListener('click', function () { switchPrivate(other); });
                    privShown++;
                } else {
                    // 拿不到自己的用户名时无法确定私聊对象，先禁用
                    item.appendChild(unknownAvatarNode());
                    const nameEl = document.createElement('span');
                    nameEl.className = 'conv-name';
                    nameEl.textContent = p;
                    item.appendChild(nameEl);
                    item.disabled = true;
                    item.title = '无法确定当前用户，请刷新页面';
                    privShown++;
                }
                privList.appendChild(item);
            }
            if (privShown === 0) privList.innerHTML = '<p class="conv-empty">暂无私聊记录</p>';
            sortPrivList(); // 按最后一条消息由新到旧（DOM 是乱序建出来的，见 privSortKey）
            updateUnreadState(); // 重建列表后按实时缓存（convLast/lastRead）同步红点
            updatePresenceDots(); // 重建后绿点也没了，按手上的在线名单补回来
            syncSidebarActive();
        }

        function addUnreadDot(item, mention) {
            const dot = document.createElement('span');
            dot.className = 'unread-dot' + (mention ? ' mention' : '');
            if (mention) dot.textContent = '@';
            item.appendChild(dot);
        }

        // ===== 私聊列表：排序 + 在线绿点 =====

        /**
         * 私聊项的排序键：该对象"最后一条消息"的时间，没有记录的空串。
         * 时间戳是 `yyyy-MM-dd HH:mm:ss` 定长，直接字符串比较就是时间比较。
         */
        function privSortKey(other) {
            const last = privLastMap[other];
            return last && last.time ? last.time : '';
        }

        /**
         * 把私聊项按"最后一条消息由新到旧"重排。
         *
         * 用 appendChild 移动已有节点而不是重建列表：重建会丢掉滚动位置、
         * 正在 hover 的项，以及 `privPartners` 之外那些只存在于 DOM 的状态。
         * 新消息到达（onWsUnread）与列表重建（loadConversations）后都要调**一次**，
         * 不调的话新会话只会被追加到最底下，用户得往下翻才找得到刚聊的人。
         */
        function sortPrivList() {
            const list = document.getElementById('privList');
            if (!list) return;
            const items = Array.prototype.slice.call(list.querySelectorAll('.conv-item'))
                .filter(function (el) { return el.dataset.other !== undefined; });
            if (items.length < 2) return;
            items.sort(function (a, b) {
                const ka = privSortKey(a.dataset.other);
                const kb = privSortKey(b.dataset.other);
                if (ka !== kb) return ka < kb ? 1 : -1; // 时间晚的在前
                // 都没消息记录（理论上不该有）时按名字兜底，保证顺序稳定不抖
                return a.dataset.other < b.dataset.other ? -1 : 1;
            });
            for (const el of items) list.appendChild(el);
        }

        /** 私聊项头像外面包一层，用来挂在线绿点（.avatar 自己没有定位上下文） */
        function privAvatarNode(name) {
            const wrap = document.createElement('span');
            wrap.className = 'avatar-wrap';
            wrap.appendChild(avatarNode(name));
            return wrap;
        }

        /**
         * 按 `onlineSet` 重画私聊项上的绿点。
         *
         * 只增删那一颗点，不重建会话项 —— 在线名单每来一个人就整表重建的话，
         * 用户正在点的项会闪一下，滚动位置也会跳。
         */
        function updatePresenceDots() {
            document.querySelectorAll('#privList .conv-item[data-other]').forEach(function (el) {
                const other = el.dataset.other;
                const wrap = el.querySelector('.avatar-wrap');
                if (!wrap) return;
                const online = onlineSet.has(other);
                const dot = wrap.querySelector('.presence-dot');
                if (online && !dot) {
                    const d = document.createElement('span');
                    d.className = 'presence-dot';
                    wrap.appendChild(d);
                } else if (!online && dot) {
                    dot.remove();
                }
                // 顺手把状态写进 title：绿点很小，鼠标停上去要能说出"在线/离线"
                el.title = online ? other + ' · 在线' : other + ' · 离线';
            });
        }

        /**
         * 服务端推送的在线名单（连接/断开时各一次）。
         *
         * 整份替换：`names` 是当前全部在线用户名，不作增量处理 ——
         * 增量要自己处理乱序与丢帧，而这份全量也就几十个字节。
         */
        function onPresence(msg) {
            onlineSet = new Set(msg.names || []);
            updatePresenceDots();
        }

        // 实时维护未读状态：WS 消息到达时更新各会话"最后消息"缓存，
        // 当前正在看该会话则记为已读；新私聊对象还会动态补一个侧边栏项
        function onWsUnread(msg) {
            if (!msg.time) return;
            const userVal = document.getElementById('user').value;
            const today = serverToday || todayStr();
            if (msg.sendTo === '') {
                const day = msg.time.slice(0, 10); // 群消息按天归档
                // at 由服务端在 /conversations 里算，实时消息得在这儿自己补，
                // 否则刚落地的这条会把上一次带 at 的记录覆盖掉、@ 胶囊一闪就没
                convLast[day] = { time: msg.time, by: msg.name, at: mentionsMe(msg.text) ? [me] : [] };
                ensureDayItem(day); // 当天归档刚创建时侧边栏可能还没有"今天"项，补上才能挂红点
                // 跨午夜：页面从昨天一直开着，serverToday 只在初始化/重连时更新，
                // 于是"今天"的判定还停在前一天，新一天的消息永远挂不上红点
                // （updateUnreadState 只给 serverToday 那一天挂点）。
                // 收到不属于"当前以为的今天"的消息就重拉一次会话列表，把 serverToday 校准过来。
                if (day !== today) loadConversations();
                // 正在看"今天的群聊"（对象框为空且未浏览旧日，或填的就是今天）才算已读；
                // 浏览旧日归档时新群消息仍算未读
                const viewingTodayGroup = userVal === '' ? currentDay === null : (isDateStr(userVal) && userVal === today);
                if (viewingTodayGroup && day === today) {
                    markRead('g:', msg.time);
                } else if (msg.name !== me) {
                    // 没在看今天：明确记一笔未读（时间戳同秒时靠它，见 unreadKeys）
                    unreadKeys.add('g:');
                }
            } else if (me) {
                // 对方：我发的消息时是 sendTo，我收到时是 name
                const partner = msg.name === me ? msg.sendTo : msg.name;
                // 文件名与服务端 getTarget 一致：两人名字排序后以 - 连接
                const pair = [msg.name, msg.sendTo].sort().join('-');
                // 私聊不提供 @，at 恒为空数组（否则侧边栏会出现「@」胶囊）
                convLast[pair] = { time: msg.time, by: msg.name, at: [] };
                privLastMap[partner] = convLast[pair];
                ensurePrivItem(partner);
                sortPrivList(); // 刚聊过的人冒到最上面（顺序按最后一条消息时间）
                if (isRelevant(msg)) {
                    markRead('p:' + partner, msg.time);
                } else if (msg.name !== me) {
                    // 别人发来的、而我没在看这个会话：明确记一笔未读
                    unreadKeys.add('p:' + partner);
                }
            }
            updateUnreadState();
        }

        /**
         * 收到一帧 `del`（撤回）。
         *
         * 关键点：撤回**不一定发生在我正在看的那个会话里**（对方撤回、或我正在看别的会话）。
         * 旧实现把整段包在 `isRelevant(resp)` 里，不相关就什么都不做 —— 于是 `convLast`
         * 里还留着那条已经被删掉的消息，红点一直亮到下次 /conversations 才自愈。
         *
         * 现在分两件事：
         *   1. 正在看的会话：立刻从 DOM 里删掉这条并记为已读（原来就有的行为）；
         *   2. 不管是不是正在看：重拉一次 /conversations 让服务端重算「最后一条消息」。
         *      前端手上只有"那条被删掉的消息"，推不出新的最后一条，只能问服务端。
         *      撤回是低频操作，多这一次请求不值得为省它再在本地维护一份消息序列。
         */
        function handleDelFrame(resp) {
            if (isRelevant(resp)) {
                delMessage(resp.name, resp.time);
                // 被撤回的会话：消息在我方可见过，记为已读到该时刻，避免小红点误亮
                if (resp.sendTo === '') markRead('g:', resp.time);
                else if (me && resp.name === me) markRead('p:' + resp.sendTo, resp.time);
            }
            // unreadKeys 记的是"我确定有一条没看过"，万一被撤回的正是那一条，
            // 这个标记就过期了 —— 不清掉红点会一直亮着（时间比较那边已经看不到它了）。
            // 删掉后交给时间比较判断，最多漏掉"同一秒"那一种情况，比一直亮着好。
            // 键的算法与 onWsUnread 一致
            if (resp.sendTo === '') unreadKeys.delete('g:');
            else {
                const partner = me && resp.name === me ? resp.sendTo : resp.name;
                if (partner) unreadKeys.delete('p:' + partner);
            }
            loadConversations();
        }

        // 对方还没出现在侧边栏（第一次私聊）时补一个可点击的项。
        // 自己发给自己也算一个合法会话（归档名 "我-我"），不能按"对方 === 自己"过滤掉
        function ensurePrivItem(other) {
            if (!me || !other || privPartners.has(other)) return;
            privPartners.add(other);
            const list = document.getElementById('privList');
            const empty = list.querySelector('.conv-empty');
            if (empty) empty.remove();
            const item = document.createElement('button');
            item.className = 'conv-item';
            item.dataset.other = other;
            item.appendChild(privAvatarNode(other));
            const nameEl = document.createElement('span');
            nameEl.className = 'conv-name';
            nameEl.textContent = other;
            item.appendChild(nameEl);
            item.addEventListener('click', function () { switchPrivate(other); });
            list.appendChild(item);
            updatePresenceDots(); // 新补的项也要立刻带上绿点（如果对方在线）
        }

        // 某天的群聊项不在侧边栏时（例如页面加载后当天第一份归档文件才刚创建）补一个；
        // 没有这项的话当天的未读红点无处可挂，"实时不亮"多半就是这个原因
        function ensureDayItem(day) {
            const list = document.getElementById('dayList');
            if (list.querySelector('.conv-item[data-day="' + day + '"]')) return;
            const empty = list.querySelector('.conv-empty');
            if (empty) empty.remove();
            const item = document.createElement('button');
            item.className = 'conv-item';
            item.dataset.day = day;
            const today = serverToday || todayStr();
            const dayName = document.createElement('span');
            dayName.className = 'conv-name';
            dayName.textContent = day === today ? '今天（' + day + '）' : day;
            item.appendChild(dayName);
            item.addEventListener('click', function () { switchGroupDay(day); });
            // 日期按新→旧排序：插到第一个"比它旧"的项之前
            const items = Array.prototype.slice.call(list.querySelectorAll('.conv-item'));
            const idx = items.findIndex(function (el) { return el.dataset.day < day; });
            if (idx === -1) list.appendChild(item);
            else items[idx].before(item);
        }

        // 让侧边栏高亮跟随当前视图，且同一时刻只高亮一组：
        // 群聊/日期模式下高亮"群聊记录"项，私聊模式下高亮"私聊"项
        function syncSidebarActive() {
            const userVal = document.getElementById('user').value;
            const todayLabel = serverToday || todayStr();
            const inGroupMode = userVal === '' || isDateStr(userVal);
            document.querySelectorAll('#dayList .conv-item').forEach(function (el) {
                el.classList.toggle('active', inGroupMode && (currentDay || todayLabel) === el.dataset.day);
            });
            document.querySelectorAll('#privList .conv-item').forEach(function (el) {
                el.classList.toggle('active', !inGroupMode && el.dataset.other !== undefined && userVal === el.dataset.other);
            });
        }

        // 切到某天的群聊记录（今天的文件默认就是不带参数；历史日期走 date 参数）
        function switchGroupDay(day) {
            document.getElementById('user').value = '';
            const today = serverToday || todayStr();
            currentDay = day === today ? null : day;
            clearReply(); // 上一条待回复属于原来的会话，带过去会回错地方
            // 只有切到"今天"的群聊视图才把今天的群消息记为已读；浏览旧日归档不影响今天的红点
            markCurrentAsRead();
            syncSidebarActive();
            updateUnreadState();
            closeSidebarIfNarrow();
            refresh();
        }

        // 切到与某人的私聊
        function switchPrivate(other) {
            document.getElementById('user').value = other;
            currentDay = null;
            clearReply(); // 同上：别把待回复带到另一个人的会话里
            markCurrentAsRead(); // 进入该私聊即已读
            syncSidebarActive();
            updateUnreadState();
            closeSidebarIfNarrow();
            refresh();
        }

        // 窄屏上侧边栏固定占 230px（flex 0 0 230px），手机竖屏只剩几十像素给消息区，
        // 选完会话不收起就基本看不见对话内容。宽屏是并排布局，收起反而多一步，故只在小屏自动收。
        function closeSidebarIfNarrow() {
            if (window.innerWidth > 600) return;
            document.getElementById('sidebar').classList.remove('open');
        }

        // ===== 未读小红点 =====
        // 数据：convLast（服务端 /conversations 的 last 字段，按会话文件），已读：Cookie 里的 lastRead
        // 实时：收到 WS 消息后更新 convLast 并刷新红点；切换会话时把对应"已读时间"记到 lastRead

        /**
         * 把"当前正在看的这个会话"记为已读。
         *
         * 三类入口都要走这里，否则红点会赖着不灭：
         *   1. 点侧边栏项（switchGroupDay / switchPrivate）；
         *   2. 手打私聊对象后按回车/失焦（input 的 change 事件）；
         *   3. 点「刷新」按钮 —— 用户看到消息、点刷新，本来就该算读过了。
         * 早先只有第 1 类调 markRead，后两类只重画历史不动已读表：明明看完了，
         * 切回去红点还在，只能再点一次侧边栏项才能消掉。
         */
        function markCurrentAsRead() {
            const userVal = document.getElementById('user').value;
            const today = serverToday || todayStr();
            if (userVal !== '' && !isDateStr(userVal)) {
                // 私聊：对方就是输入框里的人
                const last = privLastMap[userVal];
                markRead('p:' + userVal, last && last.time);
                return;
            }
            // 群聊：只有在看"今天"时才算已读，浏览旧日归档不能顺手把今天标记掉
            const day = isDateStr(userVal) ? userVal : (currentDay || today);
            if (day === today) markRead('g:', (convLast[today] && convLast[today].time) || null);
        }

        // 根据 convLast 与 lastRead 重算侧边栏所有红点（不重建列表，只增删 dot）
        // 注意：me 为 null（/whoami 失败）时不能整体跳过——群聊红点照样可算，
        // 否则 WS 实时链路全废，红点只能靠轮询慢速补上
        function updateUnreadState() {
            document.querySelectorAll('#dayList .conv-item').forEach(function (el) {
                // 红点只可能在"今天"项上：旧日归档是只读历史，新消息只会进当天的文件
                const isToday = el.dataset.day === (serverToday || todayStr());
                setDot(el, isToday && isUnread(convLast[el.dataset.day], lastRead['g:'], 'g:'),
                    lastMentionsMe(convLast[el.dataset.day]));
            });
            document.querySelectorAll('#privList .conv-item[data-other]').forEach(function (el) {
                // 私聊没有 @ 提及，第二个参数恒为 false（不升级成「@」胶囊）
                setDot(el, isUnread(privLastMap[el.dataset.other], lastRead['p:' + el.dataset.other],
                    'p:' + el.dataset.other), false);
            });
        }

        // 在按钮上增/删小红点。[mention] 为真时升级成「@」胶囊：
        // 一屏会话里「有人找我说话」和「有人点名找我」该长得不一样
        function setDot(el, show, mention) {
            const dot = el.querySelector('.unread-dot');
            if (!show) {
                if (dot) dot.remove();
                return;
            }
            if (!dot) {
                addUnreadDot(el, mention);
            } else if (!!mention !== dot.classList.contains('mention')) {
                dot.remove();
                addUnreadDot(el, mention);
            }
        }

        function todayStr() {
            // 本地日历日期（不能用 toISOString，那是 UTC，跨时区会差一天）
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }

        // 私聊对象框填 yyyy-MM-dd 时进入"浏览该日群聊记录"模式
        function isDateStr(v) {
            return /^\d{4}-\d{2}-\d{2}$/.test(v || '');
        }

        // 当前是不是私聊视图：对象框里填了人名（既不是日期，也不是空）。
        // 只用来关 @（私聊里 @ 对方没人看）；头像在群聊和私聊里都显示。
        function isPrivateView() {
            const el = document.getElementById('user');
            const v = el && el.value ? el.value : '';
            return v !== '' && !isDateStr(v);
        }

        // 群聊模式（对象框为空或填日期）下正在浏览非今天的记录；
        // 此时发消息只会写进今天的存档，不应混入旧日视图，禁止发送
        function inOldGroupDay() {
            const userVal = document.getElementById('user').value;
            if (userVal !== '' && !isDateStr(userVal)) return false; // 私聊模式，允许发送
            const today = serverToday || todayStr();
            if (currentDay !== null) return currentDay !== today; // 侧边栏选了某日
            if (isDateStr(userVal)) return userVal !== today; // 对象框填了某日
            return false; // 对象框为空：正在看今天的记录，允许发送
        }

        // 获取自己的用户名（依赖 Chat.kt 的 /whoami 路由；失败时 me 保持 null，页面照常可用）
        async function loadMe() {
            // 只有 /whoami 这一段用 try 兜：它失败（服务器刚重启、网络抖）时 me 留 null，
            // 但侧边栏照样要建起来。旧写法把 store.sync 一起圈在 try 里，fetch 一抛异常
            // 就直接跳到 catch，loadLastRead/loadConversations 永远不执行 —— 表现为
            // 断线时刷新页面，左侧会话列表一直是空的，连重连都拉不回来。
            try {
                const resp = await fetch('/whoami');
                if (resp.ok) {
                    const name = (await resp.text()).trim();
                    if (name !== '') {
                        me = name;
                        document.getElementById('meName').textContent = me;
                    }
                }
            } catch (e) {
                console.warn('获取当前用户名失败:', e);
            }
            // 头像表必须在首次 renderHistory 之前拿到，否则第一屏全是首字头像，
            // 等表回来后还得整块重画（会滚回底部、闪一下）。拉不到就当没有，照常渲染。
            await loadAvatars();
            paintMeAvatar();
            // 成员名单只用于 @ 高亮与补全，拿不到不影响聊天，所以列在头像之后、不挡渲染
            await loadMembers();
            // 已读表先向服务端同步一次（跨浏览器/清缓存后仍能对上），失败就用本机 Cookie；
            // 不管同步成没成，回调里都要把侧边栏拉起来
            store.sync(function () {
                loadLastRead();
                loadConversations();
            });
        }

        // ===== WebSocket 连接（自动重连）=====
        // 断线（服务器重启/网络抖动/服务端超时）后指数退避重连：3s -> 6s -> 12s -> 30s（封顶）；
        // 重连成功后补拉一次会话列表与当前历史，兜住断线期间错过的消息（未读红点也一并补齐）
        let wsWasConnected = false;
        let wsReconnectTimer = null;
        let wsReconnectDelay = 3000;

        // 顶栏那个小圆点：连接断了要让人看见。以前只 console.log，
        // 页面照旧显示旧消息、输入框照旧能打字，用户以为一切正常
        function setConnState(state) {
            const dot = document.getElementById('connDot');
            if (!dot) return;
            dot.className = 'conn-dot ' + state;
            dot.title = state === 'ok' ? '已连接'
                : state === 'wait' ? '正在连接…'
                : '连接已断开，正在重连（期间消息发不出去）';
        }

        function connect() {
            // 跟 terminal.html 同一套拼法：优先跟着当前页面的 host 与协议走，
            // 硬写 'ws://' + SERVER_IP 有两个坑 —— https 页面下混合内容会被浏览器直接拦，
            // 而 SERVER_IP 是 /config.js 探测出来的网卡地址，用域名或反代进来时对不上。
            // SERVER_IP 只在 file:// 直开时兜底。
            const url = (location.protocol === 'file:'
                ? 'ws://' + SERVER_IP
                : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host) + '/message';
            websocket = new WebSocket(url);
            setConnState('wait');

            websocket.onopen = function () {
                console.log('Connected to WebSocket server');
                setConnState('ok');
                if (wsWasConnected) {
                    // 非首次连接（重连成功）：刷新当前视图的历史并同步会话列表/红点
                    refresh();
                    loadConversations();
                }
                wsWasConnected = true;
                wsReconnectDelay = 3000; // 连接正常后重置退避间隔
            };

            websocket.onmessage = function (event) {
                // 单帧解析失败只丢这一帧：一帧异常不该让 onmessage 中断在半路，
                // 更不该连锁到 onclose（那会触发一次没必要的重连）
                let resp;
                try {
                    resp = JSON.parse(event.data);
                } catch (e) {
                    console.warn('忽略无法解析的 WS 帧:', e);
                    return;
                }
                if (resp.type === 'send') {
                    addMessage(resp);
                    onWsUnread(resp);
                } else if (resp.type === 'del') {
                    handleDelFrame(resp);
                } else if (resp.type === 'presence') {
                    onPresence(resp);
                } else if (resp.type === 'err') {
                    showError(resp.text);
                }
            };

            websocket.onclose = function () {
                console.log('Disconnected from WebSocket server, auto-reconnecting');
                setConnState('down');
                scheduleReconnect();
            };

            websocket.onerror = function (error) {
                console.log('WebSocket error: ' + error);
                // onerror 之后必然跟一个 onclose，重连逻辑统一放 onclose 里
            };
        }

        // 从后台切回来 / 合盖唤醒后，退避计时可能已经等了很久也还没到点，
        // 而连接其实早就死了（服务端 pingPeriod 5s / timeout 15s 早把它判掉）。
        // 这里立刻探一次：不是 OPEN 就清掉待定的计时器、马上重连，别让人干等 30 秒。
        function wakeCheck() {
            if (document.visibilityState !== 'visible') return;
            // CONNECTING 也算活着：再 connect 一次会多插一条连接（服务端按连接存会话，
            // 多出来那条会重复收消息）
            if (websocket && (websocket.readyState === WebSocket.OPEN ||
                              websocket.readyState === WebSocket.CONNECTING)) return;
            clearTimeout(wsReconnectTimer);
            wsReconnectDelay = 3000;
            connect();
        }
        document.addEventListener('visibilitychange', wakeCheck);
        window.addEventListener('online', wakeCheck);

        function scheduleReconnect() {
            clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(function () {
                // 这期间可能已经由 wakeCheck 重连上了，别在这里再插一条
                if (websocket && (websocket.readyState === WebSocket.OPEN ||
                                  websocket.readyState === WebSocket.CONNECTING)) return;
                connect();
                wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000); // 指数退避，封顶 30s
            }, wsReconnectDelay);
        }

        // 判断一条消息是否应在当前面板显示
        // 群聊（输入框留空）：只显示群消息；私聊：只显示"我 ↔ 对方"之间的消息
        function isRelevant(msg) {
            const target = document.getElementById('user').value;
            if (isDateStr(target)) {
                // 输入框填的是日期：浏览该日群聊记录，只显示当天的群消息
                return msg.sendTo === '' && ((msg.time || '').slice(0, 10) === target);
            }
            if (me === null) {
                // 拿不到自己的用户名时退化为旧的宽松匹配
                return target === msg.sendTo || target === msg.name;
            }
            if (target === '') {
                // 侧边栏选了旧日归档时输入框是空的（当前日期在 currentDay 里），
                // 这里必须比一下日期：否则新群消息会被追加到正在看的那一天的历史里，
                // 看着像是"历史记录被改写了"。新消息只属于今天。
                if (currentDay && (msg.time || '').slice(0, 10) !== currentDay) return false;
                return msg.sendTo === '';
            }
            return (msg.name === me && msg.sendTo === target) ||
                   (msg.name === target && msg.sendTo === me);
        }

        function addMessage(msg) {
            if (!isRelevant(msg)) return;
            document.getElementById('MsgBox').appendChild(crtMsg(msg.name, msg.time, msg.text, msg.reply));
            // 自己正往上翻旧消息时不强行拽到底；否则跟随新消息
            if (stickBottom) scrollToBottom(true);
            stickToImages();
            // 本地副本同步追一条：否则切走的这一会儿再来回切，会看到"新消息又没了"
            patchHistoryCache(function (items) {
                const row = { name: msg.name, time: msg.time, text: msg.text };
                if (msg.reply) row.reply = msg.reply;   // 没有就别写 null，省得撑大缓存
                items.push(row);
                return items;
            });
        }

        // ===== 头像 =====
        //
        // 每人一张，优先用自己设过的图（服务端 /avatars 一次性回全表），没设过就是首字头像。
        // 首字取名字里第一个"看起来是字"的字符：中文名取姓，英文名取首字母大写；
        // emoji 之类取不到字符时退回 '?'，绝不抛异常（头像坏掉比没头像更显眼）。
        // 十种底色：色相分散，便于一眼区分不同人。
        // 每个色都配了好读的字色（见 avatarInk），白字/深字自动选，最差也有 4.5:1。
        const AVATAR_COLORS = [
            '#4f7cff', '#7a5cf0', '#c04fd0', '#e0526b', '#e0793a',
            '#c9a227', '#3ba55d', '#2f9e9e', '#437dd7', '#8a6d3b'
        ];

        // 用户 → 头像图片地址（来自 /avatars 的 items）
        const avatarMap = {};

        // 首字：按码点取，避免把 emoji 的代理对切一半（那会渲染成方块）
        function avatarLetter(name) {
            const s = (name || '').trim();
            if (!s) return '?';
            const ch = Array.from(s)[0];
            return ch.toUpperCase();
        }

        // 底色按名字哈希：同一个人永远是同一个颜色，刷新/换设备都一致
        function avatarColor(name) {
            let h = 0;
            const s = name || '';
            for (let i = 0; i < s.length; i++) {
                h = (h * 31 + s.charCodeAt(i)) % 1000000007;
            }
            return AVATAR_COLORS[h % AVATAR_COLORS.length];
        }

        // 首字颜色按底色亮度自动选白或深色：十种底色明暗跨度很大，
        // 一律压白字时 #c9a227 只有 2.42:1（黄底白字几乎看不清）。
        // 用相对亮度公式（WCAG）算，取对比度更高的那个，实测最差 4.55:1。
        function avatarInk(bg) {
            const h = (bg || '').replace('#', '');
            const rgb = [0, 2, 4].map(function (i) {
                const v = parseInt(h.slice(i, i + 2), 16) / 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            const lum = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
            // 与白(1.0)/深(#10131a 相对亮度 0.0065) 的对比度比较，谁大用谁
            const withWhite = 1.05 / (lum + 0.05);
            const withDark = (lum + 0.05) / 0.0565;
            return withWhite >= withDark ? '#ffffff' : '#10131a';
        }

        // 头像引用（/img/<sha256>.<ext>）里取出裸文件名：它同时是 imgBlobs 的键
        // （内容寻址，同名必然同字节），也是 GIF 判定的依据。
        function avatarImageName(ref) {
            if (!ref) return '';
            const i = ref.lastIndexOf('/');
            return i < 0 ? ref : ref.substring(i + 1);
        }

        // 生成一个头像节点：设过图就是 <img>，否则是带首字的 <div>。
        // 两种都是 .avatar，尺寸/圆形裁剪共用一套样式。
        //
        // **头像字节优先走 IndexedDB**（imgBlobs 表，与聊天图/缩略图共用同一份缓存）：
        // 命中时直接给 blob URL，连 /img 的请求都不发；没命中才回源，并顺手补存一份。
        // 这样一排消息里的头像在弱网/离线时也能立刻画出来，刷新不会重新拉一遍。
        function avatarNode(name) {
            const ref = avatarMap[name];
            if (ref) {
                const img = document.createElement('img');
                img.className = 'avatar';
                img.alt = name || '';
                img.title = name || '';
                img.decoding = 'async';
                img.loading = 'lazy';
                // 走和聊天图同一条取字节的路（paintImg：本地命中 → blob URL，否则回源补存）。
                // 设过头像的那张图后来被删了（名字还在 map 里但文件没了）：静默换回首字头像，
                // 否则会留一个破图占位符，而服务端那边其实已经回落成默认了。
                // 用 onFail 而不是自己监听 error：本地那份坏字节会被 paintImg 退回网络重试，
                // 我们挂的 error 会和它抢同一个事件，把"能救回来的图"误判成失效。
                paintImg(img, avatarImageName(ref), ref, function () {
                    delete avatarMap[name];
                    const fallback = avatarFallback(name);
                    if (img.parentNode) img.parentNode.replaceChild(fallback, img);
                });
                return img;
            }
            return avatarFallback(name);
        }

        function avatarFallback(name) {
            const el = document.createElement('div');
            el.className = 'avatar avatar-text';
            const bg = avatarColor(name);
            el.style.background = bg;
            el.style.color = avatarInk(bg);
            el.title = name || '';
            el.textContent = avatarLetter(name);
            return el;
        }

        // /whoami 失败时解析不出私聊对象是谁，给一个中性头像占位（该项本来就禁用了）
        function unknownAvatarNode() {
            const el = document.createElement('div');
            el.className = 'avatar avatar-text';
            const bg = '#9aa3b8';
            el.style.background = bg;
            el.style.color = avatarInk(bg);
            el.textContent = '?';
            return el;
        }

        // 拉全站头像表。失败就清空（全部回落首字头像），不弹错误 —— 头像不该影响聊天。
        async function loadAvatars() {
            try {
                const res = await fetch('/avatars');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const items = data.items || {};
                Object.keys(avatarMap).forEach(function (k) {
                    if (!(k in items)) delete avatarMap[k];
                });
                Object.keys(items).forEach(function (k) { avatarMap[k] = items[k]; });
            } catch (e) {
                console.warn('获取头像列表失败:', e);
            }
        }

        // 自己换了头像后，把已经在屏上的那些消息里的头像就地换掉
        // （重画整个历史会滚回底部、还闪一下，没必要）
        function repaintOwnAvatars() {
            const boxes = document.getElementById('MsgBox').getElementsByClassName('message-box');
            for (let i = 0; i < boxes.length; i++) {
                if (boxes[i].getAttribute('data-own') !== '1') continue;
                const old = boxes[i].querySelector('.avatar');
                if (!old) continue;
                boxes[i].replaceChild(avatarNode(me), old);
            }
        }

        // 顶栏那颗自己的头像：跟着 avatarMap / me 走，任何一处变化都调它重画。
        // **必须留在模块级**（不能塞进 DOMContentLoaded 回调）：loadMe 在模块级调用它，
        // 放进回调里会变成"只在回调作用域可见"，loadMe 一调就 ReferenceError，
        // 而它后面紧跟着 refresh()/connect() —— 整个初始化会断在那里，
        // 表现为历史不加载、WebSocket 不连接、顶栏头像空白。
        function paintMeAvatar() {
            const slot = document.getElementById('meAvatar');
            if (!slot) return;
            slot.innerHTML = '';
            slot.appendChild(avatarNode(me || '?'));
        }

        // ===== @ 提及 =====
        //
        // 名单来自 GET /members（只回名字，不回 IP）。打 @ 时弹一个小面板选人，
        // 选中后往输入框里插一段纯文本 "@名字 "；服务端把消息原样存下来，
        // 渲染时再由 renderText 按名单把 @名字 涂成高亮块 —— 协议里**不加任何标记**，
        // 所以老存档、老客户端都不受影响。

        let mentionMatches = [];   // 当前 @ 补全的候选
        let mentionIndex = 0;      // 键盘高亮到第几个
        let mentionAt = -1;        // 输入框里那个 '@' 的下标
        let mentionRendered = '';  // 已经画进 DOM 的候选（内容变了才重建）

        async function loadMembers() {
            try {
                const resp = await fetch('/members');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                const names = Array.isArray(data.names) ? data.names : [];
                memberNames = names.filter(function (n) { return typeof n === 'string' && n !== ''; });
            } catch (e) {
                // 拉不到就当作没有名单：@ 不高亮、不补全，聊天本身不受影响
                console.warn('获取成员名单失败:', e);
            }
        }

        // 侧边栏的 last 只有 {time, by, at}，没有正文，所以只能看服务端给的 at[]。
        // 正文级高亮（气泡左侧竖线）走下面的 mentionsMe(text)，两者别混。
        function lastMentionsMe(last) {
            if (!me || !last || !last.at) return false;
            for (let i = 0; i < last.at.length; i++) if (last.at[i] === me) return true;
            return false;
        }

        // 这条消息里是不是 @ 了我（用于气泡左侧竖线）
        // 名字边界规则与服务端 mentionsIn 一致：@tester123 不算 @tester，
        // 否则侧边栏（服务端算的 at[]）和气泡（这里算的）会互相打脸
        const MENTION_WORD = /[A-Za-z0-9_\u4e00-\u9fa5]/;

        function mentionsMe(text) {
            if (!me || typeof text !== 'string') return false;
            const token = '@' + me;
            let from = 0;
            while (from <= text.length - token.length) {
                const at = text.indexOf(token, from);
                if (at === -1) return false;
                const next = text.charAt(at + token.length);
                if (!next || !MENTION_WORD.test(next)) return true;
                from = at + 1;
            }
            return false;
        }

        // 光标前正在打的 @片段；不在补全状态返回 null
        function mentionQuery() {
            const ta = document.getElementById('content');
            const caret = ta.selectionStart;
            if (caret !== ta.selectionEnd) return null;      // 有选区时不补全
            const head = ta.value.slice(0, caret);
            const at = head.lastIndexOf('@');
            if (at === -1) return null;
            const frag = head.slice(at + 1);
            if (frag.length > 32) return null;
            // 片段里不能有空白：打了空格就说明这个 @ 已经结束了
            if (/\s/.test(frag)) return null;
            // @ 前面必须是行首或非单词字符，否则 "a@b" 这种邮箱也会触发
            if (at > 0 && /[A-Za-z0-9_\u4e00-\u9fa5]/.test(head.charAt(at - 1))) return null;
            return { at: at, frag: frag };
        }

        function paintMentionPop() {
            const pop = document.getElementById('mentionPop');
            // 私聊不提供 @ 功能：两个人说话，点名没有意义，也省得弹出候选面板
            if (isPrivateView()) { hideMentionPop(); return; }
            const q = mentionQuery();
            if (!q) { hideMentionPop(); return; }
            const lower = q.frag.toLowerCase();
            const list = memberNames.filter(function (n) {
                if (n === me && q.frag === '') return true;  // 自己也能 @（留着给"提醒自己"用）
                return n.toLowerCase().indexOf(lower) !== -1;
            }).slice(0, 8);
            if (!list.length) { hideMentionPop(); return; }
            mentionAt = q.at;
            if (mentionIndex >= list.length) mentionIndex = 0;
            const changed = list.join('\u0001') !== mentionRendered;
            mentionMatches = list;
            if (changed) renderMentionList(pop);
            updateMentionActive(pop);
            pop.classList.add('show');
        }

        // 候选列表的**内容**变了才重建 DOM。
        //
        // 之前每次鼠标移动都整体重建（innerHTML=''），于是：
        //   1) 滚动位置被清零，列表跳回顶部 —— 鼠标不动时高亮行却换了个位置，
        //      看着就是"高亮反了"（指的那行和亮的那行不是一行）；
        //   2) 鼠标底下的元素被换掉，mousemove 的目标也跟着换，容易抖。
        // 现在把"渲染列表"和"标记高亮"拆开：鼠标移动只改 class，不动 DOM 结构。
        function renderMentionList(pop) {
            const scroll = pop.scrollTop;
            pop.innerHTML = '';
            mentionMatches.forEach(function (n, i) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.setAttribute('data-mi', String(i));
                btn.appendChild(avatarNode(n));
                const sp = document.createElement('span');
                sp.className = 'mn';
                sp.textContent = n;
                btn.appendChild(sp);
                // mousedown 而不是 click：click 之前 textarea 会先失焦，光标位置就丢了
                btn.addEventListener('mousedown', function (e) { e.preventDefault(); pickMention(n); });
                btn.addEventListener('mousemove', function () {
                    if (mentionIndex === i) return;
                    mentionIndex = i;
                    updateMentionActive(pop);
                });
                pop.appendChild(btn);
            });
            mentionRendered = mentionMatches.join('\u0001');
            pop.scrollTop = scroll;   // 重建别把滚动位置弄丢
        }

        // 只切换 .active 类，不重建 DOM
        function updateMentionActive(pop) {
            const buttons = pop.getElementsByTagName('button');
            for (let i = 0; i < buttons.length; i++) {
                if (i === mentionIndex) buttons[i].className = 'active';
                else if (buttons[i].className === 'active') buttons[i].className = '';
            }
            // 键盘上下选时把高亮行滚进可视区（鼠标移动不滚，免得跟着晃）
            // 自己算 scrollTop 而不是 scrollIntoView：后者会连带滚动祖先容器，
            // 可能把整个页面拽一下
            const btn = buttons[mentionIndex];
            if (btn) {
                const top = btn.offsetTop;
                const bottom = top + btn.offsetHeight;
                if (top < pop.scrollTop) pop.scrollTop = top;
                else if (bottom > pop.scrollTop + pop.clientHeight) {
                    pop.scrollTop = bottom - pop.clientHeight;
                }
            }
        }

        function hideMentionPop() {
            mentionMatches = [];
            mentionIndex = 0;
            mentionAt = -1;
            mentionRendered = '';
            const pop = document.getElementById('mentionPop');
            if (pop) pop.classList.remove('show');
        }

        function pickMention(name) {
            if (mentionAt < 0) return;
            const ta = document.getElementById('content');
            const caret = ta.selectionStart;
            const before = ta.value.slice(0, mentionAt);
            const after = ta.value.slice(caret);
            // 补一个空格：@名字 后面紧跟文字时渲染端要靠空格界定名字边界
            ta.value = before + '@' + name + ' ' + after;
            const pos = mentionAt + name.length + 2;
            ta.setSelectionRange(pos, pos);
            hideMentionPop();
            autoGrow();
            ta.focus();
        }

        // 补全面板开着时接管方向键/回车/Esc。
        // Enter 在这里被吃掉的关键原因：它既"选中候选"又"发送消息"，不拦就是发出去半截 @。
        function handleMentionKey(e) {
            const pop = document.getElementById('mentionPop');
            const open = pop && pop.classList.contains('show') && mentionMatches.length > 0;
            if (!open) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                const n = mentionMatches.length;
                mentionIndex = e.key === 'ArrowDown'
                    ? (mentionIndex + 1) % n
                    : (mentionIndex - 1 + n) % n;
                updateMentionActive(pop);
                return;
            }
            if (e.key === 'Enter' || e.key === 'Tab') {
                e.preventDefault();
                pickMention(mentionMatches[mentionIndex]);
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                hideMentionPop();
            }
        }

        // ===== 回复某条消息 =====
        //
        // 状态只在前端：选中一条消息后，下一条发出去的消息带一个 reply 快照
        // （name/time/text），服务端把它原样存进存档并广播，聊天记录里就能看到引用块。
        function startReply(name, time, text) {
            replyTo = { name: name, time: time, text: replyPreview(text) };
            // 悬停浮出的条在别处，提示条要让人看得见
            updateReplyBar();
            const ta = document.getElementById('content');
            ta.focus();
            // 把光标放到末尾，接着就能打字
            ta.setSelectionRange(ta.value.length, ta.value.length);
        }

        function clearReply() {
            replyTo = null;
            updateReplyBar();
        }

        function updateReplyBar() {
            const bar = document.getElementById('replyBar');
            if (!bar) return;
            if (!replyTo) { bar.classList.remove('show'); return; }
            bar.classList.add('show');
            document.getElementById('replyBarWho').textContent = '回复 ' + replyTo.name;
            document.getElementById('replyBarText').textContent = replyPreview(replyTo.text);
        }

        // 文字里 `@某人` 的高亮。用 DOM 拼而不是 innerHTML：消息内容是用户输入，
        // 拼字符串一定会被 XSS 打穿。只有**已知的成员名**才会被识别成 @，
        // 否则 `a@b.com` 这种普通邮箱也会被涂成一块蓝。
        function renderText(el, text, highlight) {
            const s = typeof text === 'string' ? text : '';
            // highlight 为 false 时只当纯文本：私聊不提供 @ 功能，正文里的 @xxx 不该被涂色
            if (highlight === false || !memberNames.length) { el.textContent = s; return; }
            let i = 0;
            while (i < s.length) {
                const at = s.indexOf('@', i);
                if (at === -1) { el.appendChild(document.createTextNode(s.slice(i))); break; }
                if (at > i) el.appendChild(document.createTextNode(s.slice(i, at)));
                // @ 后面最长能匹配到哪个成员名（长名优先，避免 alice 吃掉 alice-b 的前缀）
                let hit = '';
                for (let k = 0; k < memberNames.length; k++) {
                    const n = memberNames[k];
                    if (n.length <= hit.length) continue;
                    if (s.substr(at + 1, n.length) !== n) continue;
                    // 名字后面不能紧跟字母数字，否则 @bob123 会被当成 @bob
                    const next = s.charAt(at + 1 + n.length);
                    if (next && /[A-Za-z0-9_\u4e00-\u9fa5]/.test(next)) continue;
                    hit = n;
                }
                if (!hit) { el.appendChild(document.createTextNode('@')); i = at + 1; continue; }
                const span = document.createElement('span');
                span.className = 'mention';
                span.textContent = '@' + hit;
                el.appendChild(span);
                i = at + 1 + hit.length;
            }
        }

        // 一条消息的引用块：显示"回复的是谁、说了什么"，整块可点，点了滚到原消息
        function replyQuoteNode(reply) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'reply-quote';
            btn.title = '跳到被回复的那条消息';
            const who = document.createElement('span');
            who.className = 'reply-who';
            who.textContent = reply.name || '';
            const body = document.createElement('span');
            body.className = 'reply-text';
            body.textContent = replyPreview(reply.text);
            btn.appendChild(who);
            btn.appendChild(document.createTextNode(' '));
            btn.appendChild(body);
            btn.addEventListener('click', function () { jumpToMessage(reply.name, reply.time); });
            return btn;
        }

        // 引用里显示的那一小段：图片消息只有前缀，给它一个人话名字
        function replyPreview(text) {
            const s = typeof text === 'string' ? text : '';
            if (s.startsWith('ImageB64:') || s.startsWith('ImageRef:')) return '[图片]';
            return s;
        }

        /**
         * 滚到某条消息并闪一下。
         *
         * 找不到有两种情况：那条已经被撤回、或者它不在当前会话里（回复的是群聊里的消息，
         * 而我现在看的是私聊）。后者要明确告诉用户，否则点了没反应像是坏了。
         */
        function jumpToMessage(name, time) {
            const boxes = document.getElementById('MsgBox').getElementsByClassName('message-box');
            for (let i = 0; i < boxes.length; i++) {
                if (boxes[i].getAttribute('data-name') !== name) continue;
                if (boxes[i].getAttribute('data-time') !== time) continue;
                const el = boxes[i];
                // 'center' 把目标放在可视区中间，比滚到顶端更容易看清上下文
                el.scrollIntoView({ block: 'center', behavior: 'smooth' });
                el.classList.remove('flash');
                void el.offsetWidth;   // 强制重排，动画才能重播
                el.classList.add('flash');
                setTimeout(function () { el.classList.remove('flash'); }, 1400);
                return;
            }
            showError('没找到被回复的那条消息（可能已撤回，或不在当前会话里）');
        }

        // 设置页改了「显示消息时间」就地生效：只增删 .time 节点，不重画历史
        // （重画会 paintHistory → scrollToBottom，正在往上翻旧消息的人会被硬拽回底部）
        function applyShowTimePref() {
            const show = ChatPrefs.get().showTime;
            document.querySelectorAll('#MsgBox .message-box').forEach(function (box) {
                const col = box.querySelector('.msg-col');
                if (!col) return;
                const old = col.querySelector('.time');
                if (!show) {
                    if (old) old.remove();
                    return;
                }
                if (old) return;
                const timeEl = document.createElement('p');
                timeEl.className = 'time';
                timeEl.textContent = box.getAttribute('data-time') || '';
                col.appendChild(timeEl);
            });
        }

        function crtMsg(sender, time, content, reply) {
            const own = sender === me;
            // 私聊视图（就两个人）：@ 在那种场景没意义，既不高亮也不弹补全。
            // **只用来关 @**，与头像无关 —— 群聊和私聊都显示头像。
            const priv = isPrivateView();
            const box = document.createElement('div');
            box.className = 'message-box' + (own ? ' own' : '');
            // 撤回/删除/回复都要按"发送者 + 时间"定位一条消息，存在 data 属性里而不是去读文本：
            // 自己的消息不显示名字（.sender 是 display:none），innerText 会读成空串
            box.setAttribute('data-name', sender);
            box.setAttribute('data-time', time);
            if (own) box.setAttribute('data-own', '1');
            // @ 高亮只对群聊有意义（私聊里 @ 对方没人看）
            if (!own && !priv && mentionsMe(content)) box.classList.add('mentions-me');

            // 气泡外面包一层竖排容器，时间才能稳稳贴在气泡下面
            //（直接挂在 .message-box 上会跑到 row-reverse 的另一端去）
            const col = document.createElement('div');
            col.className = 'msg-col';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const head = document.createElement('div');
            head.className = 'bubble-head';

            const senderEl = document.createElement('h2');
            senderEl.className = 'sender';
            senderEl.textContent = sender;
            head.appendChild(senderEl);

            // 图片消息渲染为缩略图：
            //   ImageB64:（旧存档）→ data URL 直接当 src；ImageRef:（新）→ /img/ 端点懒加载
            // 普通文本走 renderText（内部只用 textContent / createTextNode，防 XSS）
            const contentEl = document.createElement('p');
            contentEl.className = 'content';
            let isImage = false;
            if (typeof content === 'string' && content.startsWith('ImageB64:')) {
                const img = document.createElement('img');
                img.className = 'img-message';
                img.src = content.slice('ImageB64:'.length); // data URL 自带 mime 前缀
                img.alt = '图片';
                img.loading = 'lazy';
                contentEl.appendChild(img);
                isImage = true;
            } else if (typeof content === 'string' && content.startsWith('ImageRef:')) {
                const img = document.createElement('img');
                img.className = 'img-message';
                const ref = content.slice('ImageRef:'.length); // "/img/<sha256>.<ext>"
                img.alt = '图片';
                img.loading = 'lazy';
                img.decoding = 'async';
                // 优先本地已存的字节（imgBlobs），没有才回源，见 paintImg
                paintImg(img, ref.replace(/^\/img\//, ''), ref);
                contentEl.appendChild(img);
                isImage = true;
            } else {
                renderText(contentEl, content, !priv);
            }
            // 纯图片消息去掉气泡内边距，让缩略图铺满
            if (isImage) bubble.className = 'bubble has-image';

            bubble.appendChild(head);
            if (reply && reply.name) bubble.appendChild(replyQuoteNode(reply));
            bubble.appendChild(contentEl);

            // 悬停浮出的操作条：谁都能"回复"，只有自己的、且还在 2 分钟窗口内的才能"撤回"
            //（服务端按当前用户匹配，过了窗口点了也只会拿到 err，留个必然失败的按钮更糟）
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            const replyBtn = document.createElement('button');
            replyBtn.type = 'button';
            replyBtn.textContent = '回复';
            replyBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closeMsgActions(box);
                startReply(sender, time, content);
            });
            actions.appendChild(replyBtn);
            if (own && canRevoke(time)) {
                const revokeBtn = document.createElement('button');
                revokeBtn.type = 'button';
                revokeBtn.className = 'danger';
                revokeBtn.textContent = '撤回';
                revokeBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    closeMsgActions(box);
                    delMsg(sender, time);
                });
                actions.appendChild(revokeBtn);
            }
            bubble.appendChild(actions);

            col.appendChild(bubble);
            // 时间放气泡下面；设置页关掉显示时整块都不生成（隐藏的节点仍会被读屏念出来）
            if (ChatPrefs.get().showTime) {
                const timeEl = document.createElement('p');
                timeEl.className = 'time';
                timeEl.textContent = time;
                col.appendChild(timeEl);
            }

            // 头像：群聊与私聊都挂，每人一条自己的（默认是首字 + 按名字取色）
            box.appendChild(avatarNode(sender));
            box.appendChild(col);
            return box;
        }

        // ===== 消息操作条（回复 / 撤回）=====
        //
        // 桌面端悬停就浮出来，触屏没有 hover，所以点一下这条消息也能展开；
        // 同时只留一条展开的，点别处收起。
        function toggleMsgActions(box) {
            const open = box.classList.contains('actions-open');
            closeAllMsgActions();
            if (!open) box.classList.add('actions-open');
        }

        function closeMsgActions(box) {
            if (box) box.classList.remove('actions-open');
        }

        function closeAllMsgActions() {
            document.querySelectorAll('#MsgBox .message-box.actions-open').forEach(function (el) {
                el.classList.remove('actions-open');
            });
        }

        // 服务端时间戳是 "yyyy-MM-dd HH:mm:ss"（Asia/Shanghai），与 Time.withinTwoMin 同一窗口。
        // 解析不出来就当作不可撤回，避免挂个必然失败的按钮
        function canRevoke(time) {
            const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/.exec(time || '');
            if (!m) return false;
            const sent = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - 8, +m[5], +m[6]);
            const elapsed = Date.now() - sent;
            return elapsed >= 0 && elapsed <= 120000;
        }

        function delMessage(user, time) {
            const messages = document.getElementById('MsgBox').getElementsByClassName('message-box');
            // 按 data 属性匹配：自己的消息不显示名字（.sender 为 display:none），
            // 读 innerText 会读到空串，永远匹配不上
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].getAttribute('data-name') === user &&
                    messages[i].getAttribute('data-time') === time) {
                    messages[i].remove();
                }
            }
            // 本地副本同步删掉，避免下次刷新又冒出已撤回的消息
            patchHistoryCache(function (items) {
                const kept = items.filter(function (m) { return !(m.name === user && m.time === time); });
                return kept.length === items.length ? null : kept;
            });
        }

        // 服务端返回的 err 类型消息（如私聊对象不存在），显示 4 秒后自动消失
        function showError(text) {
