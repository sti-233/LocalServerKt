<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <script src="/resources/config.js"></script>
    <script>
        // ===== 全局状态 =====
        let websocket = null;
        let nowTarget = null; // 当前私聊对象，与输入框不一致时先刷新再发送
        let me = null;        // 自己的用户名，来自 /whoami；路由未实现时为 null

        document.addEventListener('DOMContentLoaded', async function () {
            document.getElementById('sendBtn').addEventListener('click', sendMsg);
            document.getElementById('refreshBtn').addEventListener('click', refresh);
            // 图片缩略图双击可全屏查看（lightbox：滚轮/捏合缩放、拖拽平移、右上角 ✕ 关闭）
            document.getElementById('MsgBox').addEventListener('dblclick', function (e) {
                const img = e.target.closest('img.img-message');
                if (img) openLightbox(img.src);
            });
            setupLightbox();
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeLightbox();
            });
            // 图片上传：点击 🖼️ 选择文件（限 10MB、image/*），读成 dataURL 走 WebSocket 发送
            document.getElementById('imgBtn').addEventListener('click', function () {
                document.getElementById('imgInput').click();
            });
            document.getElementById('imgInput').addEventListener('change', function (e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showError('请选择图片文件');
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    showError('图片太大，请选择 10MB 以内的图片');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (ev) {
                    // 参考 talk.html 的前缀协议：ImageB64: + 完整 data URL，服务端校验后广播并存档
                    sendRaw('ImageB64:' + ev.target.result);
                };
                reader.onerror = function () {
                    showError('读取图片文件失败');
                };
                reader.readAsDataURL(file);
            });
            // Enter 换行（textarea 默认行为），Ctrl/Cmd+Enter 快捷发送
            document.getElementById('content').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMsg();
                }
            });
            await loadMe();
            await refresh();
            connect();
        });

        // 获取自己的用户名（依赖 Chat.kt 的 /whoami 路由；失败时 me 保持 null，页面照常可用）
        async function loadMe() {
            try {
                const resp = await fetch('/whoami');
                if (resp.ok) {
                    const name = (await resp.text()).trim();
                    if (name !== '') {
                        me = name;
                        document.getElementById('meName').textContent = me;
                    }
                }
            } catch (e) {
                console.warn('获取当前用户名失败:', e);
            }
        }

        function connect() {
            const url = 'ws://' + SERVER_IP + '/message';
            websocket = new WebSocket(url);

            websocket.onopen = function () {
                console.log('Connected to WebSocket server');
            };

            websocket.onmessage = function (event) {
                const resp = JSON.parse(event.data);
                if (resp.type === 'send') {
                    addMessage(resp);
                } else if (resp.type === 'del' && isRelevant(resp)) {
                    delMessage(resp.name, resp.time);
                } else if (resp.type === 'err') {
                    showError(resp.text);
                }
            };

            websocket.onclose = function () {
                console.log('Disconnected from WebSocket server');
            };

            websocket.onerror = function (error) {
                console.log('Error: ' + error);
            };
        }

        // 判断一条消息是否应在当前面板显示
        // 群聊（输入框留空）：只显示群消息；私聊：只显示"我 ↔ 对方"之间的消息
        function isRelevant(msg) {
            const target = document.getElementById('user').value;
            if (me === null) {
                // 拿不到自己的用户名时退化为旧的宽松匹配
                return target === msg.sendTo || target === msg.name;
            }
            if (target === '') {
                return msg.sendTo === '';
            }
            return (msg.name === me && msg.sendTo === target) ||
                   (msg.name === target && msg.sendTo === me);
        }

        function addMessage(msg) {
            if (!isRelevant(msg)) return;
            document.getElementById('MsgBox').appendChild(crtMsg(msg.name, msg.time, msg.text));
            scrollToBottom();
        }

        function crtMsg(sender, time, content) {
            const box = document.createElement('div');
            box.className = 'message-box' + (sender === me ? ' own' : '');

            const senderEl = document.createElement('h2');
            senderEl.className = 'sender';
            senderEl.textContent = sender;

            const timeEl = document.createElement('p');
            timeEl.className = 'time';
            timeEl.textContent = time;

            // 图片消息（ImageB64: 前缀，来自 talk.html 的协议）渲染为缩略图，否则按纯文本渲染
            const contentEl = document.createElement('p');
            contentEl.className = 'content';
            if (typeof content === 'string' && content.startsWith('ImageB64:')) {
                const img = document.createElement('img');
                img.className = 'img-message';
                img.src = content.slice('ImageB64:'.length); // data URL 自带 mime 前缀，无需写死 png
                img.alt = '图片';
                img.loading = 'lazy';
                contentEl.appendChild(img);
            } else {
                contentEl.textContent = content; // 用 textContent，防 XSS
            }

            box.appendChild(senderEl);
            box.appendChild(timeEl);
            box.appendChild(contentEl);

            // 服务端只允许撤回自己的消息（历史删除按当前用户匹配），所以按钮只挂在自己消息上
            if (sender === me) {
                const revokeBtn = document.createElement('button');
                revokeBtn.className = 'revoke-btn';
                revokeBtn.textContent = '撤回';
                revokeBtn.addEventListener('click', function () { delMsg(sender, time); });
                box.appendChild(revokeBtn);
            }
            return box;
        }

        function delMessage(user, time) {
            const messages = document.getElementById('MsgBox').getElementsByClassName('message-box');
            for (let i = messages.length - 1; i >= 0; i--) {
                const senderEl = messages[i].getElementsByClassName('sender')[0];
                const timeEl = messages[i].getElementsByClassName('time')[0];
                if (senderEl && timeEl && senderEl.innerText === user && timeEl.innerText === time) {
                    messages[i].remove();
                }
            }
        }

        // 服务端返回的 err 类型消息（如私聊对象不存在），显示 4 秒后自动消失
        function showError(text) {
            let toast = document.getElementById('errToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'errToast';
                toast.className = 'error-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function () { toast.classList.remove('show'); }, 4000);
        }

        async function renderHistory() {
            const target = document.getElementById('user').value;
            const resp = await fetch('/history?targetuser=' + encodeURIComponent(target));
            let history = [];
            if (resp.ok) {
                history = await resp.json();
            } else {
                // 服务端返回 400（如私聊对象不存在于用户列表）时给出提示，不渲染旧消息
                showError(await resp.text());
            }
            const container = document.getElementById('MsgBox');
            for (const msg of history) {
                container.appendChild(crtMsg(msg.name, msg.time, msg.text));
            }
            scrollToBottom();
        }

        async function sendMsg() {
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const text = document.getElementById('content').value;
            if (text.trim() === '') return; // 纯换行/空白不发送
            sendRaw(text);
            document.getElementById('content').value = '';
            autoGrow(); // 发送后把输入框高度还原
        }

        // 统一的 WS 发送出口：切过私聊对象先刷新再发，保证历史渲染正确
        async function sendRaw(text) {
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const user = document.getElementById('user').value;
            const json = JSON.stringify({ type: 'send', name: 'unused', time: 'unused', text, sendTo: user });
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(json);
            }
        }

        async function delMsg(name, time) {
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const user = document.getElementById('user').value;
            const json = JSON.stringify({ type: 'del', name, time, text: 'unused', sendTo: user });
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(json);
            }
        }

        async function refresh() {
            document.getElementById('MsgBox').innerHTML = '';
            nowTarget = document.getElementById('user').value;
            await renderHistory();
        }

        function scrollToBottom() {
            document.getElementById('end').scrollIntoView({ behavior: 'smooth' });
        }

        // ===== 图片全屏查看（lightbox）=====
        // 关闭：右上角 ✕ 或 Esc；缩放：滚轮 / 双指捏合 / + − 按钮（1x~20x）；单指或鼠标拖拽平移
        let lb = null; // 大图状态：{ img, scale, x, y, pinchDist, pinchMid, panning, panStart, panX0, panY0 }
        const lbPointers = new Map(); // 当前按住的指针（双指捏合用）

        function applyLbTransform() {
            if (!lb) return;
            lb.img.style.transform = `translate(${lb.x}px, ${lb.y}px) scale(${lb.scale})`;
        }

        function openLightbox(src) {
            lb = {
                img: document.querySelector('#lightbox img'),
                scale: 1, x: 0, y: 0,
                pinchDist: 0, pinchMid: null,
                panning: false, panStart: null, panX0: 0, panY0: 0
            };
            lb.img.src = src;
            document.getElementById('lightbox').classList.add('show');
            document.getElementById('lbScale').textContent = '100%';
        }

        function closeLightbox() {
            if (!lb) return;
            document.getElementById('lightbox').classList.remove('show');
            lb.img.src = ''; // 清掉 src，避免 base64 大图驻留内存
            lb = null;
            lbPointers.clear();
        }

        // 以 (cx, cy) 为缩放中心点，该点在视口中的位置保持不变
        function zoomLb(newScale, cx, cy) {
            if (!lb) return;
            newScale = Math.min(20, Math.max(1, newScale));
            const ratio = newScale / lb.scale;
            if (ratio === 1) return;
            // 图片中心 C = 视口中心 + (x, y)；令缩放中心 P 不动：x' = x + (P - C)(1 - ratio)
            lb.x += (cx - window.innerWidth / 2 - lb.x) * (1 - ratio);
            lb.y += (cy - window.innerHeight / 2 - lb.y) * (1 - ratio);
            lb.scale = newScale;
            applyLbTransform();
            clampLbPan();
            document.getElementById('lbScale').textContent = Math.round(lb.scale * 100) + '%';
        }

        // 把平移限制在合理范围，防止图片被拖出视野
        function clampLbPan() {
            if (!lb) return;
            const rect = lb.img.getBoundingClientRect(); // 已包含当前缩放
            const ox = Math.max(0, (rect.width - window.innerWidth) / 2);
            const oy = Math.max(0, (rect.height - window.innerHeight) / 2);
            lb.x = Math.min(ox, Math.max(-ox, lb.x));
            lb.y = Math.min(oy, Math.max(-oy, lb.y));
        }

        function setupLightbox() {
            const lbEl = document.getElementById('lightbox');
            const lbImg = lbEl.querySelector('img');

            // 滚轮缩放（以光标位置为中心）
            lbEl.addEventListener('wheel', function (e) {
                if (!lb || !lb.img.src) return;
                e.preventDefault();
                zoomLb(lb.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
            }, { passive: false });

            // 双击大图：放大 2.5 倍 / 已放大则还原
            lbImg.addEventListener('dblclick', function (e) {
                if (!lb) return;
                e.preventDefault();
                if (lb.scale > 1) {
                    lb.scale = 1; lb.x = 0; lb.y = 0;
                    applyLbTransform();
                    document.getElementById('lbScale').textContent = '100%';
                } else {
                    zoomLb(2.5, e.clientX, e.clientY);
                }
            });

            // 指针手势：单指/鼠标拖拽平移，双指捏合缩放（Pointer Events 兼容触屏与鼠标）
            lbEl.addEventListener('pointerdown', function (e) {
                // 控制条/关闭按钮上不开始手势，保留其点击行为
                if (!lb || !lb.img.src || e.target.closest('.lb-controls') || e.target.closest('#lbClose')) return;
                lbEl.setPointerCapture(e.pointerId);
                lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (lbPointers.size === 1) {
                    lb.panning = true;
                    lb.panStart = { x: e.clientX, y: e.clientY };
                    lb.panX0 = lb.x;
                    lb.panY0 = lb.y;
                } else if (lbPointers.size === 2) {
                    // 进入捏合模式：记录两指初始距离与中点
                    lb.panning = false;
                    const [p1, p2] = [...lbPointers.values()];
                    lb.pinchDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    lb.pinchMid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
                }
            });

            lbEl.addEventListener('pointermove', function (e) {
                if (!lb || !lbPointers.has(e.pointerId)) return;
                const cur = { x: e.clientX, y: e.clientY };
                lbPointers.set(e.pointerId, cur);

                if (lbPointers.size === 2) {
                    // 捏合缩放：以两指中点为中心，按指距变化比例缩放
                    const [p1, p2] = [...lbPointers.values()];
                    const newDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (lb.pinchDist > 0) {
                        zoomLb(lb.scale * (newDist / lb.pinchDist), lb.pinchMid.x, lb.pinchMid.y);
                    }
                    lb.pinchDist = newDist;
                } else if (lb.panning) {
                    // 单指/鼠标拖拽平移（相对起点偏移，避免逐帧累加漂移）
                    lb.x = lb.panX0 + (cur.x - lb.panStart.x);
                    lb.y = lb.panY0 + (cur.y - lb.panStart.y);
                    clampLbPan();
                    applyLbTransform();
                }
            });

            function onLbPointerUp(e) {
                if (!lb) return;
                lbPointers.delete(e.pointerId);
                if (lbPointers.size === 1) {
                    // 捏合后剩下一根手指，无缝接续为平移
                    const [p] = [...lbPointers.values()];
                    lb.panning = true;
                    lb.panStart = p;
                    lb.panX0 = lb.x;
                    lb.panY0 = lb.y;
                } else if (lbPointers.size === 0) {
                    lb.panning = false;
                    lb.pinchDist = 0;
                }
            }
            lbEl.addEventListener('pointerup', onLbPointerUp);
            lbEl.addEventListener('pointercancel', onLbPointerUp);

            // 缩放控制按钮（以视口中心为中心缩放）
            document.getElementById('lbZoomIn').addEventListener('click', function () {
                if (lb) zoomLb(lb.scale * 1.25, window.innerWidth / 2, window.innerHeight / 2);
            });
            document.getElementById('lbZoomOut').addEventListener('click', function () {
                if (lb) zoomLb(lb.scale / 1.25, window.innerWidth / 2, window.innerHeight / 2);
            });
            document.getElementById('lbClose').addEventListener('click', closeLightbox);
        }

        // 输入框随内容自动增高（有上限），发送后重置
        function autoGrow() {
            const ta = document.getElementById('content');
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
        }
    </script>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --accent: #4f7cff;
            --accent-soft: #e9efff;
            --text: #232a3b;
            --muted: #8b91a5;
            --border: #e4e7f0;
            --danger: #ff4d4d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 顶栏 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .topbar h1 { margin: 0; font-size: 18px; }
        .topbar .meta { display: flex; align-items: center; gap: 14px; }
        .topbar .me { font-size: 13px; font-weight: 600; color: var(--muted); }
        .topbar .me:empty { display: none; }
        .topbar a { color: var(--accent); font-size: 13px; text-decoration: none; }
        .topbar a:hover { text-decoration: underline; }

        /* 消息区 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-box {
            position: relative;
            align-self: flex-start;
            max-width: 72%;
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }
        .message-box.own {
            align-self: flex-end;
            background: var(--accent-soft);
            border-color: #cdd9ff;
        }
        .sender { margin: 0; font-size: 12px; font-weight: 700; color: var(--accent); }
        .message-box.own .sender { color: #7a8bb0; }
        .time { margin: 1px 0 4px; font-size: 11px; color: var(--muted); }
        /* pre-wrap 保留消息里的换行 */
        .content { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

        /* 撤回按钮：只出现在自己消息上，悬停才显示 */
        .revoke-btn {
            position: absolute;
            top: -9px;
            right: 10px;
            padding: 2px 10px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s;
        }
        .message-box:hover .revoke-btn { opacity: 1; }
        .revoke-btn:hover { background: #e63535; }

        /* 错误提示浮层（服务端 err 消息，如私聊对象不存在） */
        .error-toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            max-width: 80vw;
            padding: 10px 18px;
            background: #ff4d4d;
            color: #fff;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(255, 77, 77, .35);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 10;
        }
        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 底部输入栏 */
        .inputbar {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .inputbar input,
        .inputbar textarea {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .inputbar input:focus,
        .inputbar textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .inputbar #user { flex: 0 0 180px; }
        .inputbar textarea {
            resize: none;      /* 高度由 autoGrow 自动控制 */
            overflow-y: auto;
            max-height: 120px;
        }
        .inputbar button {
            padding: 9px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .inputbar button:hover { background: #3f68e8; }
        .inputbar button.ghost { background: #eef1f8; color: var(--text); }
        .inputbar button.ghost:hover { background: #e2e6f2; }

        /* 图片消息缩略图（配合 ImageB64: 前缀协议） */
        .img-message {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            display: block;
            cursor: zoom-in;
        }

        /* 图片全屏查看遮罩（右上角 ✕ 关闭；滚轮/双指捏合缩放；拖拽平移） */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .85);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            /* 禁止浏览器默认手势（滚页/双指缩放页面），交给 Pointer Events 处理 */
            touch-action: none;
        }
        #lightbox.show { opacity: 1; pointer-events: auto; }
        #lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
            /* 让 Pointer Events 接管手势，禁用浏览器默认的触摸滚/捏合行为 */
            touch-action: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        /* 右上角控制条：关闭 + 缩放按钮 */
        #lbClose, .lb-btn {
            position: fixed;
            z-index: 101;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        #lbClose {
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            line-height: 1;
        }
        #lbClose:hover { background: rgba(255, 77, 77, .6); }
        .lb-controls {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .lb-btn {
            width: 40px;
            height: 40px;
            position: static; /* 覆盖 #lbClose/.lb-btn 的 fixed 定位，统一由 .lb-controls 定位 */
        }
        .lb-btn:hover { background: rgba(255, 255, 255, .3); }
        #lbScale {
            min-width: 56px;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        /* 小屏适配 */
        @media (max-width: 600px) {
            .message-box { max-width: 88%; }
            .inputbar { flex-wrap: wrap; }
            .inputbar #user { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>Chat</h1>
        <div class="meta">
            <span id="meName" class="me"></span>
            <a href="/userList">查看用户列表</a>
        </div>
    </header>

    <main id="MsgBox" class="chat-area"></main>

    <footer class="inputbar">
        <input type="text" id="user" placeholder="私聊对象，留空发到群里">
        <textarea id="content" rows="1" placeholder="输入消息，Enter 换行，Ctrl+Enter 发送"></textarea>
        <button id="imgBtn" class="ghost" title="发送图片（≤10MB）">🖼️</button>
        <input type="file" id="imgInput" accept="image/*" style="display:none">
        <button id="sendBtn">发送</button>
        <button id="refreshBtn" class="ghost">刷新</button>
    </footer>
    <!-- 图片全屏查看遮罩：右上角 ✕ 关闭；+ − 缩放按钮；滚轮/双指捏合缩放；拖拽平移 -->
    <div id="lightbox">
        <img alt="全屏查看">
        <button id="lbClose" title="关闭 (Esc)">✕</button>
        <div class="lb-controls">
            <button id="lbZoomIn" class="lb-btn" title="放大">+</button>
            <span id="lbScale">100%</span>
            <button id="lbZoomOut" class="lb-btn" title="缩小">−</button>
        </div>
    </div>
    <div id="end"></div>
</body>
</html>
