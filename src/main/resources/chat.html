<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <link rel="stylesheet" href="/resources/lib/theme.css">
    <script src="/resources/lib/theme.js"></script>
    <script src="/resources/config.js"></script>
    <script src="/resources/lib/page-store.js"></script>
    <link rel="stylesheet" href="/resources/lib/lightbox.css">
    <script src="/resources/lib/lightbox.js"></script>
    <script>
        // 本页配置存 Cookie（路径 /resources/chat.html，与其他页面互不混杂）
        // remote：同时同步一份到服务端 /api/prefs —— 已读表条目数随私聊对象增长，
        // 单靠 4KB 的 Cookie 迟早撑破，服务端那份没有上限
        const store = PageStore.create('chat', { remote: true });

        // ===== 全局状态 =====
        let websocket = null;
        let nowTarget = null; // 当前私聊对象，与输入框不一致时先刷新再发送
        let me = null;        // 自己的用户名，来自 /whoami；路由未实现时为 null
        let currentDay = null; // 群聊当前查看的历史日期（null 表示今天）
        let serverToday = null; // 服务端今天（Asia/Shanghai），来自 /conversations 的 today 字段
        let convLast = {}; // 各会话最后一条消息 {time, by}（按 history 文件名），来自 /conversations，未读判断用
        let privLastMap = {}; // "对方" -> {time, by}：同一对方可能对应新旧多份归档，取最新一条
        let privPartners = new Set(); // 侧边栏已渲染的私聊对象，用于判断是否需要重新拉取会话列表
        let lastConvNames = null; // 上次拉取到的会话名单（拼接串）；重连后重拉时名单没变就只重算红点、不重建列表
        let lastRead = {}; // 各会话已读到的时间戳 {键: 时间}，存 Cookie；私聊键 'p:对方'，群聊键 'g:'

        document.addEventListener('DOMContentLoaded', async function () {
            document.getElementById('sendBtn').addEventListener('click', sendMsg);
            document.getElementById('refreshBtn').addEventListener('click', refresh);
            // 侧边栏展开/收起
            document.getElementById('sidebarToggle').addEventListener('click', function () {
                document.getElementById('sidebar').classList.toggle('open');
            });
            // 记住用户有没有自己往上翻：只有仍贴着底部时才自动跟随新消息/图片撑高。
            // 自己刚触发的滚动（含 smooth 动画进行中）跳过，否则动画每帧都"没到底"，
            // 会把 stickBottom 误置 false，之后新消息就再也不跟随了。
            document.getElementById('MsgBox').addEventListener('scroll', function () {
                if (Date.now() < autoScrollUntil) return;
                stickBottom = nearBottom();
            });
            // 图片缩略图双击全屏查看：统一交给 /resources/lib/lightbox.js
            // （与 B 站各页共用同一实现；缩放/平移/手势/关闭、以及设置页的控件显隐都在那边）
            // 聊天图本身已在服务端缓存里，但保存按钮仍然开放：点 💾 会把它复制一份到
            // cache/picture/<当前用户名>/，这样它才会出现在自己「从缓存中选取」的列表里；
            // 裁剪不开放（聊天图直接改内容容易误伤存档）。
            Lightbox.mount({ dblclick: 'img.img-message', save: true, edit: false });
            // 图片发送：点 🖼️ 打开选择面板（本地选取 / 从自己的 cache/picture/<用户名>/ 里挑），两个 tab
            document.getElementById('imgBtn').addEventListener('click', openPickPanel);
            document.getElementById('pickClose').addEventListener('click', closePickPanel);
            document.getElementById('pickMask').addEventListener('click', closePickPanel);
            document.getElementById('pickTabLocal').addEventListener('click', function () { switchPickTab('local'); });
            document.getElementById('pickTabCache').addEventListener('click', function () { switchPickTab('cache'); });
            // 点中缩略图后的三个动作：查看（走共用查看器）/ 删除（只删自己目录）/ 发送（发引用）
            document.getElementById('pickView').addEventListener('click', viewPicked);
            document.getElementById('pickDelete').addEventListener('click', deletePicked);
            document.getElementById('pickSend').addEventListener('click', sendPicked);
            // 本地选取：面板上的大按钮转去点隐藏的 file input
            document.getElementById('pickLocalBtn').addEventListener('click', function () {
                document.getElementById('imgInput').click();
            });
            document.getElementById('imgInput').addEventListener('change', function (e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (inOldGroupDay()) {
                    showError('正在浏览旧日群聊记录，该日不可发送图片');
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    showError('请选择图片文件');
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    showError('图片太大，请选择 10MB 以内的图片');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (ev) {
                    // 参考 talk.html 的前缀协议：ImageB64: + 完整 data URL，服务端校验后广播并存档
                    closePickPanel();
                    sendRaw('ImageB64:' + ev.target.result);
                };
                reader.onerror = function () {
                    showError('读取图片文件失败');
                };
                reader.readAsDataURL(file);
            });

            // Esc 关闭选择面板（只在面板打开时生效，不干扰页面上其他 Esc 行为）
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && document.getElementById('pickPanel').classList.contains('show')) {
                    closePickPanel();
                }
            });

            // ===== 图片选择面板 =====
            function openPickPanel() {
                if (inOldGroupDay()) {
                    showError('正在浏览旧日群聊记录，该日不可发送图片');
                    return;
                }
                document.getElementById('pickMask').classList.add('show');
                document.getElementById('pickPanel').classList.add('show');
                // 默认落在缓存 tab：多数时候发的是已经保存过的图
                switchPickTab('cache');
            }

            function closePickPanel() {
                document.getElementById('pickMask').classList.remove('show');
                document.getElementById('pickPanel').classList.remove('show');
                // 关掉时清掉选中态，下次打开是干净的
                selectPick(null);
            }

            function switchPickTab(tab) {
                document.getElementById('pickTabLocal').classList.toggle('active', tab === 'local');
                document.getElementById('pickTabCache').classList.toggle('active', tab === 'cache');
                document.getElementById('pickBodyLocal').classList.toggle('hidden', tab !== 'local');
                document.getElementById('pickBodyCache').classList.toggle('hidden', tab !== 'cache');
                // 操作条只服务于缓存里的图，切到本地选取时收起
                if (tab !== 'cache') selectPick(null);
                // 每次切到缓存都重拉：刚保存的图要能立刻出现在列表里
                if (tab === 'cache') loadPickCache();
            }

            // 当前选中的缓存图片（{name, ref} 或 null）。点缩略图只是选中并浮出「查看/删除/发送」，
            // 不再像旧版那样单击直接发送 —— 发错了撤回也麻烦，多一步确认更稳。
            var pickSel = null;

            function selectPick(item) {
                pickSel = item;
                const actions = document.getElementById('pickActions');
                const nameEl = document.getElementById('pickSelName');
                if (item) {
                    actions.classList.add('show');
                    // 只显示哈希前 8 位，完整名字在 title 里（64 位哈希全显示会把按钮挤走）
                    nameEl.textContent = item.name.substring(0, 8) + '…';
                    nameEl.title = item.name;
                } else {
                    actions.classList.remove('show');
                    nameEl.textContent = '';
                    nameEl.title = '';
                }
                // 同步缩略图的选中框
                const imgs = document.getElementById('pickGrid').querySelectorAll('img');
                for (let i = 0; i < imgs.length; i++) {
                    const on = !!item && imgs[i].getAttribute('data-name') === item.name;
                    imgs[i].classList.toggle('sel', on);
                }
            }

            // 发送当前选中的图：服务端已有这份文件，只发引用，不走 base64 重传
            function sendPicked() {
                if (!pickSel) return;
                // 面板开着的时候可能切到了旧日群聊，这里再挡一次（与本地选取一致）
                if (inOldGroupDay()) {
                    showError('正在浏览旧日群聊记录，该日不可发送图片');
                    return;
                }
                const ref = pickSel.ref;
                closePickPanel();
                sendRaw('ImageRef:' + ref);
            }

            // 查看当前选中的图：交给共用查看器（缩放/保存都在那边，裁剪仍关闭）
            function viewPicked() {
                if (!pickSel || !window.Lightbox) return;
                Lightbox.open(pickSel.ref);
            }

            // 删除当前选中的图：只删自己目录里的那一份，成功后从网格里摘掉
            async function deletePicked() {
                if (!pickSel) return;
                const item = pickSel;
                const btn = document.getElementById('pickDelete');
                btn.disabled = true;
                btn.textContent = '删除中…';
                try {
                    const res = await fetch('/deletePicture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: item.name })
                    });
                    const data = await res.json().catch(function () { return {}; });
                    if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
                    // 摘掉对应缩略图
                    const imgs = document.getElementById('pickGrid').querySelectorAll('img');
                    for (let i = 0; i < imgs.length; i++) {
                        if (imgs[i].getAttribute('data-name') === item.name) {
                            imgs[i].parentNode.removeChild(imgs[i]);
                            break;
                        }
                    }
                    selectPick(null);
                    if (!document.getElementById('pickGrid').querySelectorAll('img').length) {
                        // 全删光了：重拉一次，让空态文案正常显示
                        loadPickCache();
                    } else {
                        const count = document.getElementById('pickCount');
                        const m = /^最近 (\d+) \/ 共 (\d+) 张$/.exec(count.textContent || '');
                        if (m) {
                            count.textContent = '最近 ' + (Number(m[1]) - 1) + ' / 共 ' + (Number(m[2]) - 1) + ' 张';
                        }
                    }
                } catch (err) {
                    showError('删除失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '删除';
                }
            }

            // 拉自己的图片列表渲染成缩略图网格（服务端只返回本 IP 用户名目录下的图；
            // 缩略图走 /img/<name>，由浏览器缓存）
            async function loadPickCache() {
                const grid = document.getElementById('pickGrid');
                const hint = document.getElementById('pickHint');
                const count = document.getElementById('pickCount');
                grid.textContent = '';
                // 重拉时清掉选中态（旧选中项的节点已经不在了）
                selectPick(null);
                hint.style.display = 'block';
                hint.textContent = '加载中…';
                count.textContent = '';
                try {
                    const res = await fetch('/pictures?limit=120');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const items = data.items || [];
                    count.textContent = items.length ? ('最近 ' + items.length + ' / 共 ' + data.total + ' 张') : '';
                    if (!items.length) {
                        hint.textContent = '你还没有保存过图片（全屏查看时点 💾 即可存到这里）';
                        return;
                    }
                    hint.style.display = 'none';
                    items.forEach(function (it) {
                        const img = document.createElement('img');
                        img.src = it.ref;               // "/img/<sha256>.<ext>"
                        img.alt = it.name;
                        img.title = it.name;
                        img.loading = 'lazy';
                        img.decoding = 'async';
                        img.setAttribute('data-name', it.name);
                        img.addEventListener('click', function () {
                            // 单击只选中，浮出「查看 / 删除 / 发送」；发不发由用户点按钮决定
                            selectPick({ name: it.name, ref: it.ref });
                        });
                        grid.appendChild(img);
                    });
                } catch (err) {
                    hint.style.display = 'block';
                    hint.textContent = '加载缓存图片失败：' + err.message;
                }
            }
            // Enter 换行（textarea 默认行为），Ctrl/Cmd+Enter 快捷发送
            document.getElementById('content').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMsg();
                }
            });
            // 手动改私聊对象时退出"浏览某日群聊记录"模式；直接填入日期（yyyy-MM-dd）则切换为该日群聊记录
            document.getElementById('user').addEventListener('input', function () {
                if (isDateStr(this.value)) {
                    currentDay = this.value;
                    refresh();
                } else {
                    currentDay = null; // 改回人名或清空时由后续"刷新"/发送/侧边栏点击重新载入
                }
                syncSidebarActive();
            });
            await loadMe();
            await refresh();
            connect();
            // 宽屏默认展开侧边栏，窄屏收起，顶栏按钮可手动切换
            if (window.innerWidth > 600) document.getElementById('sidebar').classList.add('open');
        });

        // ===== 会话侧边栏 =====
        // 群聊按日期（history_yyyy-MM-dd.json）归档，私聊按 "名A-名B"（getTarget 排序后命名）归档
        // 加载 message/ 下所有 history 文件名，分组渲染；点击切换对应对话并刷新
        // 未读小红点：按"会话最后消息晚于已读时间且非自己/系统发送"计算（数据来自 /conversations 的 last 字段）
        // 键名直接用用户名，PageStore 内部会做 Cookie 名安全编码（中文等非 token 字符）
        function lastReadKey() { return 'lastRead_' + (me || 'unknown'); }

        function loadLastRead() {
            try { lastRead = JSON.parse(store.get(lastReadKey()) || '{}'); }
            catch (e) { lastRead = {}; }
        }

        // 全量已读表：Cookie 只当本机缓存（可能因 4KB 上限被裁剪），
        // 完整的那份在服务端 /api/prefs 里，所以这里永远推完整表，不再自己丢条目
        function saveLastRead() {
            store.set(lastReadKey(), JSON.stringify(lastRead), true);
        }

        function markRead(key, time) {
            if (time && (!lastRead[key] || time > lastRead[key])) {
                lastRead[key] = time;
                saveLastRead();
            }
        }

        // 判断一个"最后消息"是否构成未读：晚于已读时间，且发送者不是我（System 归档创建消息也不算）
        function isUnread(last, readTime) {
            if (!last || !last.time || !last.by || last.by === 'System') return false;
            if (me && last.by === me) return false;
            return last.time > (readTime || '');
        }

        // 从私聊归档文件名（getTarget 排序后 "名A-名B"）反推"对方"是谁。
        // 自己发给自己时两个名字相同，归档名是 "我-我"，按老逻辑找"不等于 me"的那段会落空，
        // 于是整个会话被跳过、侧边栏不显示 —— 这里显式把对方判定为自己。
        function partnerOf(name, self) {
            if (name === self + '-' + self) return self;
            const parts = name.split('-');
            return parts.find(function (x) { return x !== self && x !== ''; }) || null;
        }

        async function loadConversations() {
            let names = [];
            let today = null;
            convLast = {};
            privLastMap = {}; // 等拿到 me 后再把各私聊归档按"对方"归并取最新
            try {
                const resp = await fetch('/conversations');
                if (resp.ok) {
                    const data = await resp.json();
                    names = data.names || [];
                    today = data.today || null; // 服务端 Asia/Shanghai 的今天，避免前端时区偏差
                    convLast = data.last || {}; // 各会话最后一条消息 {time, by}
                }
            } catch (e) {
                console.warn('获取会话列表失败:', e);
                return;
            }
            if (today) serverToday = today;
            const dayRe = /^\d{4}-\d{2}-\d{2}$/;
            const todayLabel = today || todayStr(); // 服务端今天的日期，失败时退回本地
            const days = names.filter(n => dayRe.test(n)).reverse(); // 最近的日期在前
            const privs = names.filter(n => !dayRe.test(n) && n.includes('-'));
            // 私聊归档按"对方"归并取最新（同一对方可能对应新旧多份归档，换用户名产生）；
            // 无条件缓存，供 onWsUnread/switchPrivate 实时判断未读
            for (const p of privs) {
                const other = me ? partnerOf(p, me) : null;
                const last = convLast[p];
                if (other && last) {
                    const cur = privLastMap[other];
                    if (!cur || last.time > cur.time) privLastMap[other] = last;
                }
            }

            // 轻路径：会话名单没变（典型场景=WS 重连后的补拉）就只重算红点，
            // 不重建列表，避免把用户刚点的项/高亮冲掉
            const namesKey = names.join('|');
            if (lastConvNames !== null && lastConvNames === namesKey) {
                updateUnreadState();
                return;
            }
            lastConvNames = namesKey;

            const dayList = document.getElementById('dayList');
            dayList.innerHTML = '';
            for (const d of days) {
                const item = document.createElement('button');
                item.className = 'conv-item';
                item.dataset.day = d; // 供 syncSidebarActive 判断高亮
                item.textContent = d === todayLabel ? '今天（' + d + '）' : d;
                // 红点只挂在"今天"项上：旧日归档是只读历史，新消息只会进当天的文件
                if (d === todayLabel && isUnread(convLast[d], lastRead['g:'])) addUnreadDot(item);
                item.addEventListener('click', function () { switchGroupDay(d); });
                dayList.appendChild(item);
            }
            if (days.length === 0) dayList.innerHTML = '<p class="conv-empty">暂无群聊记录</p>';

            const privList = document.getElementById('privList');
            privList.innerHTML = '';
            let privShown = 0;
            const shownOthers = new Set(); // 按"对方"去重：新旧归档（换用户名后产生）可能映射到同一对象
            privPartners = new Set();
            for (const p of privs) {
                let other = null;
                if (me) {
                    if (!p.split('-').includes(me)) continue; // 归档里没有自己（旧用户名残留），跳过
                    other = partnerOf(p, me);
                    if (!other || shownOthers.has(other)) continue; // 无法解析或已有同一对象的项，跳过
                    shownOthers.add(other);
                }
                const item = document.createElement('button');
                item.className = 'conv-item';
                if (other !== null) {
                    item.dataset.other = other; // 供 syncSidebarActive 判断高亮
                    item.textContent = other;
                    privPartners.add(other);
                    if (isUnread(privLastMap[other], lastRead['p:' + other])) addUnreadDot(item);
                    item.addEventListener('click', function () { switchPrivate(other); });
                    privShown++;
                } else {
                    // 拿不到自己的用户名时无法确定私聊对象，先禁用
                    item.textContent = p;
                    item.disabled = true;
                    item.title = '无法确定当前用户，请刷新页面';
                    privShown++;
                }
                privList.appendChild(item);
            }
            if (privShown === 0) privList.innerHTML = '<p class="conv-empty">暂无私聊记录</p>';
            updateUnreadState(); // 重建列表后按实时缓存（convLast/lastRead）同步红点
            syncSidebarActive();
        }

        function addUnreadDot(item) {
            const dot = document.createElement('span');
            dot.className = 'unread-dot';
            item.appendChild(dot);
        }

        // 实时维护未读状态：WS 消息到达时更新各会话"最后消息"缓存，
        // 当前正在看该会话则记为已读；新私聊对象还会动态补一个侧边栏项
        function onWsUnread(msg) {
            if (!msg.time) return;
            const userVal = document.getElementById('user').value;
            const today = serverToday || todayStr();
            if (msg.sendTo === '') {
                const day = msg.time.slice(0, 10); // 群消息按天归档
                convLast[day] = { time: msg.time, by: msg.name };
                ensureDayItem(day); // 当天归档刚创建时侧边栏可能还没有"今天"项，补上才能挂红点
                // 正在看"今天的群聊"（对象框为空且未浏览旧日，或填的就是今天）才算已读；
                // 浏览旧日归档时新群消息仍算未读
                const viewingTodayGroup = userVal === '' ? currentDay === null : (isDateStr(userVal) && userVal === today);
                if (viewingTodayGroup && day === today) markRead('g:', msg.time);
            } else if (me) {
                // 对方：我发的消息时是 sendTo，我收到时是 name
                const partner = msg.name === me ? msg.sendTo : msg.name;
                // 文件名与服务端 getTarget 一致：两人名字排序后以 - 连接
                const pair = [msg.name, msg.sendTo].sort().join('-');
                convLast[pair] = { time: msg.time, by: msg.name };
                privLastMap[partner] = convLast[pair];
                ensurePrivItem(partner);
                if (isRelevant(msg)) markRead('p:' + partner, msg.time);
            }
            updateUnreadState();
        }

        // 对方还没出现在侧边栏（第一次私聊）时补一个可点击的项。
        // 自己发给自己也算一个合法会话（归档名 "我-我"），不能按"对方 === 自己"过滤掉
        function ensurePrivItem(other) {
            if (!me || !other || privPartners.has(other)) return;
            privPartners.add(other);
            const list = document.getElementById('privList');
            const empty = list.querySelector('.conv-empty');
            if (empty) empty.remove();
            const item = document.createElement('button');
            item.className = 'conv-item';
            item.dataset.other = other;
            item.textContent = other;
            item.addEventListener('click', function () { switchPrivate(other); });
            list.appendChild(item);
        }

        // 某天的群聊项不在侧边栏时（例如页面加载后当天第一份归档文件才刚创建）补一个；
        // 没有这项的话当天的未读红点无处可挂，"实时不亮"多半就是这个原因
        function ensureDayItem(day) {
            const list = document.getElementById('dayList');
            if (list.querySelector('.conv-item[data-day="' + day + '"]')) return;
            const empty = list.querySelector('.conv-empty');
            if (empty) empty.remove();
            const item = document.createElement('button');
            item.className = 'conv-item';
            item.dataset.day = day;
            const today = serverToday || todayStr();
            item.textContent = day === today ? '今天（' + day + '）' : day;
            item.addEventListener('click', function () { switchGroupDay(day); });
            // 日期按新→旧排序：插到第一个"比它旧"的项之前
            const items = Array.prototype.slice.call(list.querySelectorAll('.conv-item'));
            const idx = items.findIndex(function (el) { return el.dataset.day < day; });
            if (idx === -1) list.appendChild(item);
            else items[idx].before(item);
        }

        // 让侧边栏高亮跟随当前视图，且同一时刻只高亮一组：
        // 群聊/日期模式下高亮"群聊记录"项，私聊模式下高亮"私聊"项
        function syncSidebarActive() {
            const userVal = document.getElementById('user').value;
            const todayLabel = serverToday || todayStr();
            const inGroupMode = userVal === '' || isDateStr(userVal);
            document.querySelectorAll('#dayList .conv-item').forEach(function (el) {
                el.classList.toggle('active', inGroupMode && (currentDay || todayLabel) === el.dataset.day);
            });
            document.querySelectorAll('#privList .conv-item').forEach(function (el) {
                el.classList.toggle('active', !inGroupMode && el.dataset.other !== undefined && userVal === el.dataset.other);
            });
        }

        // 切到某天的群聊记录（今天的文件默认就是不带参数；历史日期走 date 参数）
        function switchGroupDay(day) {
            document.getElementById('user').value = '';
            const today = serverToday || todayStr();
            currentDay = day === today ? null : day;
            // 只有切到"今天"的群聊视图才把今天的群消息记为已读；浏览旧日归档不影响今天的红点
            if (currentDay === null) {
                markRead('g:', convLast[today]?.time || today);
            }
            syncSidebarActive();
            updateUnreadState();
            refresh();
        }

        // 切到与某人的私聊
        function switchPrivate(other) {
            document.getElementById('user').value = other;
            currentDay = null;
            markRead('p:' + other, privLastMap[other]?.time || null); // 进入该私聊即已读
            syncSidebarActive();
            updateUnreadState();
            refresh();
        }

        // ===== 未读小红点 =====
        // 数据：convLast（服务端 /conversations 的 last 字段，按会话文件），已读：Cookie 里的 lastRead
        // 实时：收到 WS 消息后更新 convLast 并刷新红点；切换会话时把对应"已读时间"记到 lastRead

        // 根据 convLast 与 lastRead 重算侧边栏所有红点（不重建列表，只增删 dot）
        // 注意：me 为 null（/whoami 失败）时不能整体跳过——群聊红点照样可算，
        // 否则 WS 实时链路全废，红点只能靠轮询慢速补上
        function updateUnreadState() {
            document.querySelectorAll('#dayList .conv-item').forEach(function (el) {
                // 红点只可能在"今天"项上：旧日归档是只读历史，新消息只会进当天的文件
                const isToday = el.dataset.day === (serverToday || todayStr());
                setDot(el, isToday && isUnread(convLast[el.dataset.day], lastRead['g:']));
            });
            document.querySelectorAll('#privList .conv-item[data-other]').forEach(function (el) {
                setDot(el, isUnread(privLastMap[el.dataset.other], lastRead['p:' + el.dataset.other]));
            });
        }

        // 在按钮上增/删小红点
        function setDot(el, show) {
            const dot = el.querySelector('.unread-dot');
            if (show && !dot) addUnreadDot(el);
            else if (!show && dot) dot.remove();
        }

        function todayStr() {
            // 本地日历日期（不能用 toISOString，那是 UTC，跨时区会差一天）
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }

        // 私聊对象框填 yyyy-MM-dd 时进入"浏览该日群聊记录"模式
        function isDateStr(v) {
            return /^\d{4}-\d{2}-\d{2}$/.test(v || '');
        }

        // 群聊模式（对象框为空或填日期）下正在浏览非今天的记录；
        // 此时发消息只会写进今天的存档，不应混入旧日视图，禁止发送
        function inOldGroupDay() {
            const userVal = document.getElementById('user').value;
            if (userVal !== '' && !isDateStr(userVal)) return false; // 私聊模式，允许发送
            const today = serverToday || todayStr();
            if (currentDay !== null) return currentDay !== today; // 侧边栏选了某日
            if (isDateStr(userVal)) return userVal !== today; // 对象框填了某日
            return false; // 对象框为空：正在看今天的记录，允许发送
        }

        // 获取自己的用户名（依赖 Chat.kt 的 /whoami 路由；失败时 me 保持 null，页面照常可用）
        async function loadMe() {
            try {
                const resp = await fetch('/whoami');
                if (resp.ok) {
                    const name = (await resp.text()).trim();
                    if (name !== '') {
                        me = name;
                        document.getElementById('meName').textContent = me;
                    }
                }
                // 侧边栏依赖自己的用户名与已读记录，成功后加载会话列表
                // 已读表先向服务端同步一次（跨浏览器/清缓存后仍能对上），失败就用本机 Cookie
                store.sync(function () {
                    loadLastRead();
                    loadConversations();
                });
            } catch (e) {
                console.warn('获取当前用户名失败:', e);
            }
        }

        // ===== WebSocket 连接（自动重连）=====
        // 断线（服务器重启/网络抖动/服务端超时）后指数退避重连：3s -> 6s -> 12s -> 30s（封顶）；
        // 重连成功后补拉一次会话列表与当前历史，兜住断线期间错过的消息（未读红点也一并补齐）
        let wsWasConnected = false;
        let wsReconnectTimer = null;
        let wsReconnectDelay = 3000;

        function connect() {
            const url = 'ws://' + SERVER_IP + '/message';
            websocket = new WebSocket(url);

            websocket.onopen = function () {
                console.log('Connected to WebSocket server');
                if (wsWasConnected) {
                    // 非首次连接（重连成功）：刷新当前视图的历史并同步会话列表/红点
                    refresh();
                    loadConversations();
                }
                wsWasConnected = true;
                wsReconnectDelay = 3000; // 连接正常后重置退避间隔
            };

            websocket.onmessage = function (event) {
                const resp = JSON.parse(event.data);
                if (resp.type === 'send') {
                    addMessage(resp);
                    onWsUnread(resp);
                } else if (resp.type === 'del' && isRelevant(resp)) {
                    delMessage(resp.name, resp.time);
                    // 被撤回的会话：消息在我方可见过，记为已读到该时刻，避免小红点误亮
                    if (resp.sendTo === '') markRead('g:', resp.time);
                    else if (me && resp.name === me) markRead('p:' + resp.sendTo, resp.time);
                } else if (resp.type === 'err') {
                    showError(resp.text);
                }
            };

            websocket.onclose = function () {
                console.log('Disconnected from WebSocket server, auto-reconnecting');
                scheduleReconnect();
            };

            websocket.onerror = function (error) {
                console.log('WebSocket error: ' + error);
                // onerror 之后必然跟一个 onclose，重连逻辑统一放 onclose 里
            };
        }

        function scheduleReconnect() {
            clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(function () {
                connect();
                wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000); // 指数退避，封顶 30s
            }, wsReconnectDelay);
        }

        // 判断一条消息是否应在当前面板显示
        // 群聊（输入框留空）：只显示群消息；私聊：只显示"我 ↔ 对方"之间的消息
        function isRelevant(msg) {
            const target = document.getElementById('user').value;
            if (isDateStr(target)) {
                // 输入框填的是日期：浏览该日群聊记录，只显示当天的群消息
                return msg.sendTo === '' && ((msg.time || '').slice(0, 10) === target);
            }
            if (me === null) {
                // 拿不到自己的用户名时退化为旧的宽松匹配
                return target === msg.sendTo || target === msg.name;
            }
            if (target === '') {
                return msg.sendTo === '';
            }
            return (msg.name === me && msg.sendTo === target) ||
                   (msg.name === target && msg.sendTo === me);
        }

        function addMessage(msg) {
            if (!isRelevant(msg)) return;
            document.getElementById('MsgBox').appendChild(crtMsg(msg.name, msg.time, msg.text));
            // 自己正往上翻旧消息时不强行拽到底；否则跟随新消息
            if (stickBottom) scrollToBottom(true);
            stickToImages();
        }

        function crtMsg(sender, time, content) {
            const box = document.createElement('div');
            box.className = 'message-box' + (sender === me ? ' own' : '');

            const senderEl = document.createElement('h2');
            senderEl.className = 'sender';
            senderEl.textContent = sender;

            const timeEl = document.createElement('p');
            timeEl.className = 'time';
            timeEl.textContent = time;

            // 图片消息渲染为缩略图：
            //   ImageB64:（旧存档）→ data URL 直接当 src；ImageRef:（新）→ /img/ 端点懒加载
            // 普通文本走 textContent 防 XSS
            const contentEl = document.createElement('p');
            contentEl.className = 'content';
            if (typeof content === 'string' && content.startsWith('ImageB64:')) {
                const img = document.createElement('img');
                img.className = 'img-message';
                img.src = content.slice('ImageB64:'.length); // data URL 自带 mime 前缀
                img.alt = '图片';
                img.loading = 'lazy';
                contentEl.appendChild(img);
            } else if (typeof content === 'string' && content.startsWith('ImageRef:')) {
                const img = document.createElement('img');
                img.className = 'img-message';
                img.src = content.slice('ImageRef:'.length); // "/img/<sha256>.<ext>"
                img.alt = '图片';
                img.loading = 'lazy';
                img.decoding = 'async';
                contentEl.appendChild(img);
            } else {
                contentEl.textContent = content; // 用 textContent，防 XSS
            }

            box.appendChild(senderEl);
            box.appendChild(timeEl);
            box.appendChild(contentEl);

            // 服务端只允许撤回自己的消息（历史删除按当前用户匹配），所以按钮只挂在自己消息上
            if (sender === me) {
                const revokeBtn = document.createElement('button');
                revokeBtn.className = 'revoke-btn';
                revokeBtn.textContent = '撤回';
                revokeBtn.addEventListener('click', function () { delMsg(sender, time); });
                box.appendChild(revokeBtn);
            }
            return box;
        }

        function delMessage(user, time) {
            const messages = document.getElementById('MsgBox').getElementsByClassName('message-box');
            for (let i = messages.length - 1; i >= 0; i--) {
                const senderEl = messages[i].getElementsByClassName('sender')[0];
                const timeEl = messages[i].getElementsByClassName('time')[0];
                if (senderEl && timeEl && senderEl.innerText === user && timeEl.innerText === time) {
                    messages[i].remove();
                }
            }
        }

        // 服务端返回的 err 类型消息（如私聊对象不存在），显示 4 秒后自动消失
        function showError(text) {
            let toast = document.getElementById('errToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'errToast';
                toast.className = 'error-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function () { toast.classList.remove('show'); }, 4000);
        }

        async function renderHistory() {
            const target = document.getElementById('user').value;
            // 日期不是用户名：浏览某日群聊记录时 targetuser 留空，只带 date 参数，避免服务端 400
            const userParam = isDateStr(target) ? '' : target;
            // 群聊模式下 currentDay 非空时查看该日期的历史文件，否则由服务端默认今天
            const dateParam = currentDay ? '&date=' + encodeURIComponent(currentDay) : '';
            const resp = await fetch('/history?targetuser=' + encodeURIComponent(userParam) + dateParam);
            let history = [];
            if (resp.ok) {
                history = await resp.json();
            } else {
                // 服务端返回 400（如私聊对象不存在于用户列表）时给出提示，不渲染旧消息
                showError(await resp.text());
            }
            const container = document.getElementById('MsgBox');
            container.innerHTML = '';
            for (const msg of history) {
                container.appendChild(crtMsg(msg.name, msg.time, msg.text));
            }
            // 切会话/切日期/刷新后一律回到最新一条：先瞬时到底（不走动画），
            // 再给懒加载的图片挂回调，等它们把高度撑开后继续贴底
            stickBottom = true;
            scrollToBottom(false);
            stickToImages();
        }

        async function sendMsg() {
            // 私聊对象填的是日期时处于"浏览群聊记录"模式，不能发消息
            if (isDateStr(document.getElementById('user').value)) {
                showError('正在浏览某日群聊记录，请先清空对象框再发送消息');
                return;
            }
            // 浏览非今天的群聊记录（侧边栏日期项或对象框填日期）时禁止发送：
            // 新消息只会写入今天的存档，发到群里也不属于正在查看的旧日
            if (inOldGroupDay()) {
                showError('正在浏览旧日群聊记录，该日不可发送消息；点"今天"或改选私聊对象后可发送');
                return;
            }
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const text = document.getElementById('content').value;
            if (text.trim() === '') return; // 纯换行/空白不发送
            sendRaw(text);
            document.getElementById('content').value = '';
            autoGrow(); // 发送后把输入框高度还原
        }

        // 统一的 WS 发送出口：切过私聊对象先刷新再发，保证历史渲染正确
        async function sendRaw(text) {
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const user = document.getElementById('user').value;
            const json = JSON.stringify({ type: 'send', name: 'unused', time: 'unused', text, sendTo: user });
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(json);
            }
        }

        async function delMsg(name, time) {
            if (document.getElementById('user').value !== nowTarget) {
                await refresh();
            }
            const user = document.getElementById('user').value;
            const json = JSON.stringify({ type: 'del', name, time, text: 'unused', sendTo: user });
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(json);
            }
        }

        async function refresh() {
            nowTarget = document.getElementById('user').value;
            await renderHistory();
        }

        // 是否"贴着底部"：切进会话后图片懒加载会不断撑高消息区，
        // 只有用户没自己往上翻（仍贴底）时才继续跟着滚，否则会把他正在看的位置拽走
        let stickBottom = true;

        // 自己触发的滚动期间，不能用 scroll 事件反推用户意图：smooth 动画的每一帧
        // 都还"没到底"，若据此把 stickBottom 置 false，后面新消息就再也不跟随了。
        let autoScrollUntil = 0;

        function nearBottom() {
            const box = document.getElementById('MsgBox');
            return box.scrollHeight - box.scrollTop - box.clientHeight < 8;
        }

        // 滚到最新一条。必须直接改消息区自己的 scrollTop —— 页面本身不滚动
        // （body 固定 100vh，滚动条在 .chat-area 上），scrollIntoView 那类
        // 对 window 生效的调用在这里没有效果，这正是之前"切会话没滚到底"的原因。
        // smooth 只给新消息用；切换会话要瞬时到底，否则会看到从顶部一路滑下去的动画。
        function scrollToBottom(smooth) {
            const box = document.getElementById('MsgBox');
            if (!box) return;
            autoScrollUntil = Date.now() + (smooth ? 800 : 120);
            if (smooth && box.scrollTo) {
                box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
            } else {
                box.scrollTop = box.scrollHeight;
            }
        }

        // 给还没加载完的图片挂一次性回调：加载完高度才最终确定，这时再补一次贴底
        function stickToImages() {
            const imgs = document.getElementById('MsgBox').querySelectorAll('img');
            for (let i = 0; i < imgs.length; i++) {
                const img = imgs[i];
                if (img.complete) continue; // 已加载好的不用管
                img.addEventListener('load', onImageSettle);
                img.addEventListener('error', onImageSettle);
            }
        }

        function onImageSettle() {
            this.removeEventListener('load', onImageSettle);
            this.removeEventListener('error', onImageSettle);
            if (stickBottom) scrollToBottom(false);
        }

        // 输入框随内容自动增高（有上限），发送后重置
        function autoGrow() {
            const ta = document.getElementById('content');
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
        }
    </script>

        }
        .message-box.own {
            align-self: flex-end;
            background: var(--accent-soft);
            border-color: var(--accent-soft-strong);
        }
        .sender { margin: 0; font-size: 12px; font-weight: 700; color: var(--accent); }
        .message-box.own .sender { color: var(--muted); }
        .time { margin: 1px 0 4px; font-size: 11px; color: var(--muted); }
        /* pre-wrap 保留消息里的换行 */
        .content { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

        /* 撤回按钮：只出现在自己消息上，悬停才显示 */
        .revoke-btn {
            position: absolute;
            top: -9px;
            right: 10px;
            padding: 2px 10px;
            background: var(--danger);
            color: var(--on-danger);
            border: none;
            border-radius: 999px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s;
        }
        .message-box:hover .revoke-btn { opacity: 1; }
        .revoke-btn:hover { background: var(--danger-hover, #e63535); }

        /* 错误提示浮层（服务端 err 消息，如私聊对象不存在） */
        .error-toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            max-width: 80vw;
            padding: 10px 18px;
            background: var(--danger);
            color: var(--on-danger);
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(255, 77, 77, .35);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 10;
        }
        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 底部输入栏 */
        .inputbar {
            position: relative; /* 图片选择面板 #pickPanel 以它为定位祖先，贴在输入栏正上方 */
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .inputbar input,
        .inputbar textarea {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .inputbar input:focus,
        .inputbar textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, .15);
            background: var(--card);
        }
        .inputbar #user { flex: 0 0 180px; }
        .inputbar textarea {
            resize: none;      /* 高度由 autoGrow 自动控制 */
            overflow-y: auto;
            max-height: 120px;
        }
        .inputbar button {
            padding: 9px 16px;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .inputbar button:hover { background: var(--accent-hover); }
        .inputbar button.ghost { background: var(--fill); color: var(--text); }
        .inputbar button.ghost:hover { background: var(--fill-strong); }

        /* 图片消息缩略图（配合 ImageB64: 前缀协议） */
        .img-message {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            display: block;
            cursor: zoom-in;
        }

        /* ===== 图片选择面板（点 🖼️ 弹出：本地选取 / 缓存里挑） =====
           浮在输入栏上方，靠 .inputbar 的 position:relative 定位；
           样式全部用 theme.css 变量，日间/夜间自动跟随 */
        .pick-mask {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 60;
            display: none;
        }
        .pick-mask.show { display: block; }
        .pick-panel {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 100%;               /* 贴在输入栏上沿 */
            margin-bottom: 8px;
            z-index: 61;
            display: none;
            flex-direction: column;
            max-height: 52vh;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
            overflow: hidden;
        }
        .pick-panel.show { display: flex; }
        .pick-head {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }
        .pick-tabs { display: flex; }
        .pick-tabs button {
            padding: 6px 12px;
            margin-right: 6px;          /* 不用 flex gap（Chrome<84 不支持） */
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--fill);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .pick-tabs button.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }
        .pick-count {
            margin-left: auto;          /* 靠右 */
            font-size: 12px;
            color: var(--muted);
        }
        /* 注意：面板里的 button 都在 .inputbar 内，会被 `.inputbar button`（0,1,1）命中，
           所以这几个按类选中的规则要带上 .pick-panel 前缀提高特异性，否则背景/内边距会被顶掉 */
        .pick-panel .pick-close {
            width: 28px; height: 28px;
            padding: 0;
            margin-left: 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .pick-panel .pick-close:hover { background: var(--fill); color: var(--text); }
        .pick-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
        }
        .pick-body.hidden { display: none; }
        /* 本地选取 tab：一整块虚线区，点哪儿都触发文件选择 */
        .pick-panel .pick-local {
            display: block;
            width: 100%;
            padding: 26px 12px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            background: var(--fill);
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }
        .pick-panel .pick-local:hover { border-color: var(--accent); color: var(--accent); }
        /* 缓存 tab：缩略图网格（用 grid gap，Chrome 57+ 支持） */
        .pick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 8px;
        }
        .pick-grid img {
            width: 100%;
            height: 84px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            background: var(--fill);
            cursor: pointer;
            display: block;
        }
        .pick-grid img:hover { border-color: var(--accent); }
        /* 选中的那张：加一圈 accent 边，和操作条呼应 */
        .pick-grid img.sel {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        /* 点中缩略图后浮出的操作条（查看 / 删除 / 发送），钉在面板底部 */
        .pick-actions {
            display: none;
            align-items: center;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            background: var(--fill);
        }
        .pick-actions.show { display: flex; }
        .pick-sel-name {
            flex: 1 1 auto;
            min-width: 0;               /* 允许收缩，否则长文件名把按钮挤出去 */
            margin-right: 8px;
            font-size: 12px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 同样要带 .pick-panel 前缀压过 `.inputbar button`（见上） */
        .pick-panel .pick-actions button {
            padding: 6px 12px;
            margin-left: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .pick-panel .pick-actions button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .pick-panel .pick-actions button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }
        .pick-panel .pick-actions button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--on-accent);
        }
        .pick-panel .pick-actions button.danger {
            color: var(--danger);
            border-color: var(--danger-border);
        }
        .pick-panel .pick-actions button.danger:hover {
            background: var(--danger-soft);
            color: var(--danger);
        }
        .pick-hint {
            padding: 18px 8px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        /* 小屏适配 */
        @media (max-width: 600px) {
            .message-box { max-width: 88%; }
            .inputbar { flex-wrap: wrap; }
            .inputbar #user { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <button id="sidebarToggle" class="icon-btn" title="显示/收起会话">☰</button>
            <h1>Chat</h1>
        </div>
        <div class="meta">
            <span id="meName" class="me"></span>
            <a href="/userList">查看用户列表</a>
            <a class="nav-setting" href="/setting" title="设置">⚙ 设置</a>
        </div>
    </header>

    <div class="layout">
        <!-- 会话侧边栏：按 message/history_*.json 文件名分组（私聊 "名A-名B"、群聊 yyyy-MM-dd），点击切换 -->
        <aside id="sidebar">
            <div class="conv-section">
                <h3>私聊</h3>
                <div id="privList"></div>
            </div>
            <div class="conv-section">
                <h3>群聊记录</h3>
                <div id="dayList"></div>
            </div>
        </aside>

        <div class="right-col">
            <main id="MsgBox" class="chat-area"></main>

            <footer class="inputbar">
                <input type="text" id="user" placeholder="私聊对象，留空发到群里；填日期(yyyy-MM-dd)浏览该日群聊">
                <textarea id="content" rows="1" placeholder="输入消息，Enter 换行，Ctrl+Enter 发送"></textarea>
                <button id="imgBtn" class="ghost" title="发送图片（本地选取或从缓存中选择）">🖼️</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none">
                <button id="sendBtn">发送</button>
                <button id="refreshBtn" class="ghost">刷新</button>

                <!-- 图片选择面板：🖼️ 触发，浮在输入栏上方（绝对定位，不占 flex 流） -->
                <div id="pickMask" class="pick-mask"></div>
                <div id="pickPanel" class="pick-panel">
                    <div class="pick-head">
                        <div class="pick-tabs">
                            <button type="button" id="pickTabCache" class="active">缓存图片</button>
                            <button type="button" id="pickTabLocal">本地选取</button>
                        </div>
                        <span id="pickCount" class="pick-count"></span>
                        <button type="button" id="pickClose" class="pick-close" title="关闭">✕</button>
                    </div>
                    <div id="pickBodyCache" class="pick-body">
                        <div id="pickGrid" class="pick-grid"></div>
                        <div id="pickHint" class="pick-hint" style="display:none"></div>
                    </div>
                    <div id="pickBodyLocal" class="pick-body hidden">
                        <button type="button" id="pickLocalBtn" class="pick-local">
                            点击选择本地图片（≤10MB）
                        </button>
                    </div>
                    <!-- 点中缩略图后浮出的操作条：查看 / 删除 / 发送 -->
                    <div id="pickActions" class="pick-actions">
                        <span id="pickSelName" class="pick-sel-name"></span>
                        <button type="button" id="pickView">查看</button>
                        <button type="button" id="pickDelete" class="danger">删除</button>
                        <button type="button" id="pickSend" class="primary">发送</button>
                    </div>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
